<title>我的课表</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #172033;
    --sub: #7b8497;
    --line: #e9edf3;
    --primary: #3978ff;
    --primary-light: #edf3ff;
    --shadow: 0 8px 30px rgba(35, 48, 75, .07);
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* 顶部 */
.header {
    padding: 24px 18px 16px;
    max-width: 1100px;
    margin: auto;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
}

.subtitle {
    color: var(--sub);
    font-size: 13px;
    margin-top: 7px;
}

.today-btn {
    border: 0;
    background: var(--primary-light);
    color: var(--primary);
    padding: 9px 13px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

/* 学期信息 */
.term-card {
    background: var(--card);
    margin: 4px 18px 12px;
    max-width: 1064px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 18px;
    padding: 15px 17px;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.term-info small {
    color: var(--sub);
    font-size: 12px;
}

.term-info strong {
    display: block;
    margin-top: 5px;
    font-size: 15px;
}

.select {
    border: 1px solid var(--line);
    background: #fafbfc;
    border-radius: 10px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
}

/* 周选择 */
.week-bar {
    max-width: 1064px;
    margin: 0 auto 14px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.week-arrow {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border: 0;
    border-radius: 12px;
    background: white;
    box-shadow: var(--shadow);
    cursor: pointer;
    font-size: 20px;
    color: var(--text);
}

.week-selector {
    flex: 1;
    overflow-x: auto;
    display: flex;
    gap: 8px;
    scrollbar-width: none;
}

.week-selector::-webkit-scrollbar {
    display: none;
}

.week {
    flex-shrink: 0;
    padding: 9px 14px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: white;
    font-size: 13px;
    color: var(--sub);
    cursor: pointer;
}

.week.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 5px 15px rgba(57,120,255,.22);
}

/* 课表 */
.schedule-wrap {
    max-width: 1064px;
    margin: auto;
    padding: 0 18px 40px;
}

.schedule {
    background: white;
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

/* 横向滚动区域 */
.table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.grid {
    min-width: 900px;
    display: grid;
    grid-template-columns: 58px repeat(7, 1fr);
}

/* 星期标题 */
.day-head {
    background: #fafbfc;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    padding: 13px 5px;
    text-align: center;
}

.day-head .day {
    font-size: 13px;
    font-weight: 700;
}

.day-head .date {
    color: var(--sub);
    font-size: 11px;
    margin-top: 4px;
}

.day-head.today {
    background: var(--primary-light);
    color: var(--primary);
}

/* 节次 */
.time {
    min-height: 100px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: var(--sub);
    font-size: 11px;
    background: #fafbfc;
    padding: 5px;
}

/* 单元格 */
.cell {
    min-height: 100px;
    padding: 5px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: white;
}

.empty {
    height: 100%;
    min-height: 88px;
}

/* 课程卡 */
.course {
    min-height: 88px;
    border-radius: 13px;
    padding: 10px 9px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    overflow: hidden;
}

.course:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 20px rgba(0,0,0,.08);
}

.course-name {
    font-size: 13px;
    font-weight: 750;
    line-height: 1.4;
}

.course-teacher {
    font-size: 11px;
    margin-top: 7px;
    opacity: .75;
}

.course-room {
    font-size: 11px;
    margin-top: 4px;
    opacity: .75;
}

.course-week {
    font-size: 10px;
    margin-top: 6px;
    opacity: .65;
}

/* 不同课程颜色 */
.c1 {
    background: #eaf1ff;
    color: #315fb8;
}

.c2 {
    background: #e9f8f1;
    color: #207653;
}

.c3 {
    background: #fff2e5;
    color: #a65d1b;
}

.c4 {
    background: #f3eaff;
    color: #7040a5;
}

.c5 {
    background: #ffe9ef;
    color: #a4425c;
}

.c6 {
    background: #e8f7fa;
    color: #237481;
}

/* 底部 */
.footer {
    text-align: center;
    color: #a0a8b7;
    font-size: 11px;
    padding: 0 18px 30px;
}

/* 弹窗 */
.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .38);
    backdrop-filter: blur(5px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(560px, 100%);
    background: white;
    border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    animation: up .22s ease;
}

@keyframes up {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

.modal-title {
    font-size: 20px;
    font-weight: 800;
}

.modal-code {
    color: var(--sub);
    font-size: 12px;
    margin-top: 5px;
}

.detail {
    margin-top: 20px;
}

.detail-row {
    display: flex;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
}

.detail-row span:first-child {
    width: 70px;
    color: var(--sub);
}

.detail-row span:last-child {
    flex: 1;
    font-weight: 600;
}

.close {
    width: 100%;
    border: 0;
    margin-top: 20px;
    padding: 13px;
    border-radius: 13px;
    background: #f1f3f7;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;

/* 手机 */
@media (max-width: 600px) {

    }

        padding: 9px 7px;
    }

    .course-name {
        font-size: 12px;
    }
}

========================= */

let currentWeek = 1;


/* =========================
   初始化
========================= */

function init() {

    showDate();

    renderWeekList();

    renderSchedule();

}


/* =========================
   日期
========================= */

function showDate() {

    const now = new Date();

    const text =
        now.getFullYear() +
        "年" +
        (now.getMonth() + 1) +
        "月" +
        now.getDate() +
        "日";

    document.getElementById("currentDate").textContent =
        text + " · 本学期课表";

}


/* =========================
   周选择
========================= */

function renderWeekList() {

    const box = document.getElementById("weekList");

    box.innerHTML = "";

    for (let i = 1; i <= 18; i++) {

        const el = document.createElement("button");

        el.className =
            "week" +
            (i === currentWeek ? " active" : "");

        el.textContent = "第" + i + "周";

        el.onclick = () => {

            currentWeek = i;

            document.getElementById("weekSelect").value = i;

            renderWeekList();

            renderSchedule();

        };

        box.appendChild(el);

    }

}


function changeWeek(value) {

    currentWeek = Number(value);

    renderWeekList();

    renderSchedule();

}


function previousWeek() {

    if (currentWeek > 1) {

        currentWeek--;

        document.getElementById("weekSelect").value = currentWeek;

        renderWeekList();

        renderSchedule();

    }

}


function nextWeek() {

    if (currentWeek < 18) {

        currentWeek++;

        document.getElementById("weekSelect").value = currentWeek;

        renderWeekList();

        renderSchedule();

    }

}


/* =========================
   返回今天
========================= */

function goToday() {

    /*
       当前学期开始日期。
       这里暂时设置为 2026-09-07。
       后面可以改成真实开学日期。
    */

    const semesterStart =
        new Date("2026-09-07T00:00:00");

    const today = new Date();

    const diff =
        today - semesterStart;

    let week =
        Math.floor(
            diff / (7 * 24 * 60 * 60 * 1000)
        ) + 1;

    if (week < 1) week = 1;

    if (week > 18) week = 18;

    currentWeek = week;

    document.getElementById("weekSelect").value =
        currentWeek;

    renderWeekList();

    renderSchedule();

}


/* =========================
   判断课程是否存在
========================= */

function getCourse(day, period) {

    return courses.filter(course => {

        return (
            course.day === day &&
            period >= course.start &&
            period <= course.end &&
            course.weeks.includes(currentWeek)
        );

    });

}


/* =========================
   生成课表
========================= */

function renderSchedule() {

    const grid =
        document.getElementById("scheduleGrid");

    grid.innerHTML = "";


    /*
       左上角
    */

    const emptyHead =
        document.createElement("div");

    emptyHead.className = "day-head";

    emptyHead.innerHTML =
        "<div class='day'>节次</div>";

    grid.appendChild(emptyHead);


    /*
       星期标题
    */

    const today =
        new Date().getDay();

    const todayIndex =
        today === 0 ? 6 : today - 1;


    days.forEach((day, index) => {

        const head =
            document.createElement("div");

        head.className =
            "day-head" +
            (index === todayIndex ? " today" : "");

        head.innerHTML = `
            <div class="day">${day.replace("星期","")}</div>
            <div class="date">${getDateForDay(index)}</div>
        `;

        grid.appendChild(head);

    });


    /*
       12节课
    */

    periods.forEach((periodName, periodIndex) => {

        const period =
            periodIndex + 1;


        /*
           左边节次
        */

        const time =
            document.createElement("div");

        time.className = "time";

        time.innerHTML =
            `<span>${periodName}</span>`;

        grid.appendChild(time);


        /*
           7天
        */

        for (let day = 0; day < 7; day++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";


            const list =
                getCourse(day, period);


            if (list.length === 0) {

                cell.innerHTML =
                    `<div class="empty"></div>`;

            } else {

                list.forEach(course => {

                    /*
                       只在课程开始节次显示卡片，
                       避免同一课程重复显示。
                    */

                    if (course.start === period) {

                        const card =
                            document.createElement("div");

                        card.className =
                            "course " +
                            course.color;

                        card.innerHTML = `

                            <div class="course-name">
                                ${course.name}
                            </div>

                            <div class="course-teacher">
                                ${course.teacher}
                            </div>

                            <div class="course-room">
                                📍 ${course.room}
                            </div>

                            <div class="course-week">
                                第 ${formatWeeks(course.weeks)} 周
                            </div>

                        `;

                        card.onclick = () =>
                            showCourse(course);

                        /*
                           如果跨两节，让卡片更高
                        */

                        if (course.end > course.start) {

                            card.style.minHeight =
                                (88 +
                                (course.end -
                                course.start) * 94) + "px";

                        }

                        cell.appendChild(card);

                    }

                });

            }

            grid.appendChild(cell);

        }

    });

}


/* =========================
   周次格式化
========================= */

function formatWeeks(weeks) {

    if (!weeks.length) return "";

    /*
       连续周合并
       例如：
       [1,2,3,4,5,7,8]
       → 1-5、7-8
    */

    const result = [];

    let start = weeks[0];

    let prev = weeks[0];


    for (let i = 1; i < weeks.length; i++) {

        if (weeks[i] === prev + 1) {

            prev = weeks[i];

        } else {

            result.push(
                start === prev
                    ? start
                    : start + "-" + prev
            );

            start = weeks[i];

            prev = weeks[i];

        }

    }


    result.push(
        start === prev
            ? start
            : start + "-" + prev
    );


    return result.join("、");

}


/* =========================
   星期日期
========================= */

function getDateForDay(index) {

    /*
       当前周暂时以 2026-09-07 为第1周。
    */

    const start =
        new Date("2026-09-07T00:00:00");

    const date =
        new Date(start);

    date.setDate(
        date.getDate() +
        (currentWeek - 1) * 7 +
        index
    );

    return (
        (date.getMonth() + 1) +
        "/" +
        date.getDate()
    );

}


/* =========================
   课程详情
========================= */

function showCourse(course) {

    document.getElementById("modalName").textContent =
        course.name;

    document.getElementById("modalCode").textContent =
        course.code;

    document.getElementById("modalTeacher").textContent =
        course.teacher;

    document.getElementById("modalRoom").textContent =
        course.room;

    document.getElementById("modalTime").textContent =
        `${days[course.day]} · 第${course.start}-${course.end}节`;

    document.getElementById("modalWeek").textContent =
        `第 ${formatWeeks(course.weeks)} 周`;

    document.getElementById("modalBg")
        .classList.add("show");

}


function hideModal() {

    document.getElementById("modalBg")
        .classList.remove("show");

}


function closeModal(event) {

    if (event.target.id === "modalBg") {

        hideModal();

    }

}


/* =========================
   启动
========================= */

init();

</script>
