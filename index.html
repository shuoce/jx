
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta name="theme-color" content="#07111f">

<meta
    name="description"
    content="我的课表 · 手机端个人课程表"
>

<title>我的课表</title>

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    color:#eef6ff;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(56,189,248,.16),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 20%,
            rgba(99,102,241,.13),
            transparent 35%
        ),
        #07111f;

    min-height:100vh;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================================================
   背景装饰
========================================================= */

.bg-orb{
    position:fixed;
    width:260px;
    height:260px;
    border-radius:50%;
    filter:blur(70px);
    opacity:.18;
    pointer-events:none;
    z-index:0;
}

.bg-orb.one{
    background:#38bdf8;
    top:-100px;
    left:-100px;
}

.bg-orb.two{
    background:#8b5cf6;
    right:-120px;
    top:30%;
}


/* =========================================================
   页面
========================================================= */

.page{
    position:relative;
    z-index:1;
    min-height:100vh;
}

.container{
    width:min(1500px,100%);
    margin:auto;
    padding:18px;
}


/* =========================================================
   顶部
========================================================= */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    margin-bottom:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-icon{
    width:46px;
    height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.25),
            rgba(99,102,241,.2)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);

    font-size:23px;
}

.brand-title{
    font-size:21px;
    font-weight:800;
}

.brand-subtitle{
    margin-top:3px;
    font-size:12px;
    color:#8ea5bd;
}

.top-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;

    border:1px solid rgba(255,255,255,.1);

    border-radius:13px;

    background:rgba(255,255,255,.055);

    color:#eaf4ff;

    font-size:18px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.icon-btn:active{
    transform:scale(.95);
}


/* =========================================================
   卡片
========================================================= */

.glass{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(255,255,255,.09);

    box-shadow:
        0 20px 70px rgba(0,0,0,.22);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-radius:22px;
}


/* =========================================================
   导入页
========================================================= */

.import-page{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.import-card{
    width:min(600px,100%);
    padding:30px;
}

.import-icon{
    width:72px;
    height:72px;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:35px;

    margin-bottom:20px;

    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.2),
            rgba(99,102,241,.18)
        );

    border:1px solid rgba(255,255,255,.1);
}

.import-title{
    font-size:29px;
    font-weight:850;
    margin-bottom:9px;
}

.import-desc{
    color:#91a7bd;
    line-height:1.7;
    font-size:14px;
}

.import-tips{
    margin-top:20px;
    padding:15px;

    border-radius:15px;

    background:rgba(255,255,255,.04);

    color:#9db0c3;

    font-size:13px;
    line-height:1.8;
}

.import-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.primary-btn,
.secondary-btn{
    min-height:48px;

    border-radius:14px;

    padding:0 17px;

    border:1px solid rgba(255,255,255,.1);

    font-weight:700;
}

.primary-btn{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #1685c7,
            #635bdb
        );
}

.secondary-btn{
    color:#e8f3ff;
    background:rgba(255,255,255,.055);
}

.primary-btn:active,
.secondary-btn:active{
    transform:scale(.98);
}


/* =========================================================
   主页面顶部信息
========================================================= */

.semester-card{
    padding:18px 20px;
    margin-bottom:14px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.semester-label{
    color:#8197ad;
    font-size:12px;
    margin-bottom:4px;
}

.semester-name{
    font-size:17px;
    font-weight:750;
}

.week-now{
    text-align:right;
}

.week-now-label{
    color:#8197ad;
    font-size:11px;
}

.week-now-number{
    font-size:23px;
    font-weight:850;
}


/* =========================================================
   周次
========================================================= */

.week-card{
    padding:13px;
    margin-bottom:15px;
}

.week-list{
    display:flex;
    gap:7px;
    overflow-x:auto;

    scrollbar-width:none;
}

.week-list::-webkit-scrollbar{
    display:none;
}

.week-btn{
    flex:0 0 auto;

    border:1px solid rgba(255,255,255,.08);

    color:#9cb1c6;

    background:rgba(255,255,255,.045);

    border-radius:11px;

    padding:9px 13px;

    font-size:12px;
    font-weight:650;
}

.week-btn.active{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.4),
            rgba(99,102,241,.42)
        );

    border-color:
        rgba(125,211,252,.3);

    box-shadow:
        0 5px 20px rgba(56,189,248,.12);
}


/* =========================================================
   课表
========================================================= */

.schedule-card{
    overflow:hidden;
}

.schedule-scroll{
    width:100%;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
}

.schedule{
    border-collapse:collapse;

    width:100%;
    min-width:980px;

    table-layout:fixed;
}

.schedule th,
.schedule td{
    border-right:
        1px solid rgba(255,255,255,.055);

    border-bottom:
        1px solid rgba(255,255,255,.055);

    padding:5px;

    vertical-align:top;
}

.schedule thead th{
    height:64px;

    position:sticky;
    top:0;
    z-index:4;

    background:
        rgba(9,22,38,.94);

    backdrop-filter:blur(15px);

    text-align:center;
}

.schedule thead th:first-child{
    width:70px;
}

.schedule tbody th{
    width:70px;

    text-align:center;

    color:#8197ad;

    background:
        rgba(255,255,255,.025);

    position:sticky;
    left:0;
    z-index:3;
}

.day-name{
    font-weight:800;
    font-size:14px;
}

.day-date{
    margin-top:5px;
    color:#7890a8;
    font-size:11px;
}

.period-number{
    color:#dceaff;
    font-size:14px;
    font-weight:800;
}

.schedule td{
    height:72px;
    background:rgba(255,255,255,.012);
}


/* =========================================================
   课程卡片
========================================================= */

.course{
    height:100%;
    min-height:61px;

    padding:9px;

    margin:2px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            rgba(37,99,235,.26),
            rgba(14,116,144,.2)
        );

    border:
        1px solid rgba(125,211,252,.14);

    box-shadow:
        0 6px 20px rgba(0,0,0,.15);

    transition:.15s;

    display:flex;
    flex-direction:column;
    justify-content:flex-start;
}

.course:active{
    transform:scale(.97);
}

.course-name{
    font-size:12px;
    font-weight:800;
    line-height:1.4;
    color:#f1f8ff;
}

.course-room{
    margin-top:5px;
    font-size:10px;
    color:#a9d8ef;
    line-height:1.35;
}

.course-teacher{
    margin-top:3px;
    font-size:10px;
    color:#8ca6bd;
}


/* =========================================================
   今日课程
========================================================= */

.today-card{
    margin-top:15px;
    padding:18px;
}

.section-title{
    font-size:16px;
    font-weight:800;
    margin-bottom:3px;
}

.section-subtitle{
    color:#71879d;
    font-size:12px;
    margin-bottom:13px;
}

.today-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.today-item{
    display:flex;
    align-items:center;
    gap:13px;

    padding:13px;

    border-radius:14px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.055);
}

.today-period{
    min-width:54px;

    color:#75d5ff;

    font-size:11px;
    font-weight:750;
}

.today-info{
    min-width:0;
}

.today-course{
    font-size:14px;
    font-weight:750;
}

.today-room{
    margin-top:4px;
    color:#8198ae;
    font-size:11px;
}

.empty{
    padding:24px;
    text-align:center;
    color:#657b91;
    font-size:13px;
}


/* =========================================================
   模态框
========================================================= */

.modal-mask{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:18px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.modal{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #101e30,
            #0a1625
        );

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 30px 100px rgba(0,0,0,.5);

    padding:20px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    margin-bottom:15px;
}

.modal-title{
    font-size:18px;
    font-weight:800;
}

.close-btn{
    width:38px;
    height:38px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.05);

    color:#dcecff;
}

textarea{
    width:100%;
    min-height:280px;

    resize:vertical;

    color:#eaf5ff;

    background:#07111e;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius:15px;

    outline:none;

    padding:14px;

    line-height:1.55;

    font-size:13px;
}

textarea:focus{
    border-color:
        rgba(56,189,248,.45);
}

.modal-actions{
    display:flex;
    gap:9px;

    margin-top:13px;
}

.modal-actions button{
    flex:1;
}


/* =========================================================
   课程详情
========================================================= */

.detail-course-name{
    font-size:22px;
    font-weight:850;
    line-height:1.4;
}

.detail-code{
    color:#718ba4;
    font-size:11px;
    margin-top:5px;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:18px;
}

.detail-item{
    padding:13px;

    border-radius:14px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.055);
}

.detail-label{
    color:#71879d;
    font-size:11px;
    margin-bottom:5px;
}

.detail-value{
    color:#e9f5ff;
    font-size:13px;
    font-weight:650;
}


/* =========================================================
   设置
========================================================= */

.settings-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.setting-btn{
    width:100%;

    text-align:left;

    padding:15px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.06);

    background:rgba(255,255,255,.04);

    color:#eaf5ff;
}

.setting-btn strong{
    display:block;
    font-size:14px;
}

.setting-btn span{
    display:block;
    margin-top:4px;
    color:#70869c;
    font-size:11px;
}


/* =========================================================
   Toast
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    z-index:500;

    padding:11px 17px;

    border-radius:13px;

    background:
        rgba(14,28,45,.94);

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    color:#eaf5ff;

    font-size:12px;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   移动端
========================================================= */

@media(max-width:700px){

    .container{
        padding:11px;
    }

    .brand-title{
        font-size:18px;
    }

    .brand-subtitle{
        font-size:10px;
    }

    .brand-icon{
        width:41px;
        height:41px;
        border-radius:13px;
        font-size:20px;
    }

    .semester-card{
        padding:15px;
    }

    .semester-name{
        font-size:14px;
    }

    .week-card{
        border-radius:17px;
    }

    .schedule-card{
        border-radius:17px;
    }

    .today-card{
        border-radius:17px;
    }

    .import-card{
        padding:23px;
    }

    .import-title{
        font-size:25px;
    }

    .import-actions{
        grid-template-columns:1fr;
    }

    .detail-grid{
        grid-template-columns:1fr 1fr;
    }

}


/* =========================================================
   很小屏幕
========================================================= */

@media(max-width:380px){

    .detail-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="bg-orb one"></div>
<div class="bg-orb two"></div>


<!-- =======================================================
     导入页面
======================================================= -->

<section
    id="importPage"
    class="page import-page"
>

    <div class="glass import-card">

        <div class="import-icon">
            📚
        </div>

        <div class="import-title">
            我的课表
        </div>

        <div class="import-desc">
            把教务系统中的「我的课表」复制下来，
            粘贴到这里，即可自动生成手机课表。
        </div>

        <div class="import-tips">

            <b>导入方法</b><br>

            ① 打开学校教务系统 → 我的课表<br>

            ② 选择「全部教学周」<br>

            ③ 复制整个课表页面文字<br>

            ④ 点击下面的「粘贴课表」<br>

            ⑤ 点击「生成我的课表」

        </div>

        <div class="import-actions">

            <button
                id="pasteBtn"
                class="primary-btn"
            >
                📋 粘贴课表
            </button>

            <button
                id="fileImportBtn"
                class="secondary-btn"
            >
                📄 导入文件
            </button>

        </div>

        <input
            id="fileInput"
            type="file"
            accept=".txt,.html,.htm"
            hidden
        >

    </div>

</section>


<!-- =======================================================
     主页面
======================================================= -->

<section
    id="mainPage"
    class="page hidden"
>

<div class="container">

    <div class="topbar">

        <div class="brand">

            <div class="brand-icon">
                📚
            </div>

            <div>

                <div class="brand-title">
                    我的课表
                </div>

                <div class="brand-subtitle">
                    手机端个人课程表
                </div>

            </div>

        </div>

        <div class="top-actions">

            <button
                id="settingsBtn"
                class="icon-btn"
                title="设置"
            >
                ⚙️
            </button>

        </div>

    </div>


    <div class="glass semester-card">

        <div>

            <div class="semester-label">
                当前学期
            </div>

            <div
                id="semesterText"
                class="semester-name"
            >
                2026-2027学年1学期
            </div>

        </div>

        <div class="week-now">

            <div class="week-now-label">
                当前周
            </div>

            <div
                id="currentWeekNumber"
                class="week-now-number"
            >
                --
            </div>

        </div>

    </div>


    <div class="glass week-card">

        <div
            id="weekList"
            class="week-list"
        ></div>

    </div>


    <div class="glass schedule-card">

        <div class="schedule-scroll">

            <table class="schedule">

                <thead>

                    <tr>

                        <th>
                            节次
                        </th>

                        <th data-day="1">
                            星期一
                        </th>

                        <th data-day="2">
                            星期二
                        </th>

                        <th data-day="3">
                            星期三
                        </th>

                        <th data-day="4">
                            星期四
                        </th>

                        <th data-day="5">
                            星期五
                        </th>

                        <th data-day="6">
                            星期六
                        </th>

                        <th data-day="7">
                            星期日
                        </th>

                    </tr>

                </thead>

                <tbody id="scheduleBody"></tbody>

            </table>

        </div>

    </div>


    <div class="glass today-card">

        <div class="section-title">
            今日课程
        </div>

        <div
            id="todayDate"
            class="section-subtitle"
        >
            --
        </div>

        <div
            id="todayList"
            class="today-list"
        ></div>

    </div>


</div>

</section>


<!-- =======================================================
     粘贴窗口
======================================================= -->

<div
    id="pasteModal"
    class="modal-mask hidden"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                粘贴教务系统课表
            </div>

            <button
                id="closePasteBtn"
                class="close-btn"
            >
                ×
            </button>

        </div>

        <textarea
            id="pasteText"
            placeholder="请把教务系统「我的课表」页面复制的全部文字粘贴到这里……"
        ></textarea>

        <div class="modal-actions">

            <button
                id="cancelPasteBtn"
                class="secondary-btn"
            >
                取消
            </button>

            <button
                id="generateBtn"
                class="primary-btn"
            >
                ✨ 生成我的课表
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     课程详情
======================================================= -->

<div
    id="detailModal"
    class="modal-mask hidden"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                课程详情
            </div>

            <button
                id="closeDetailBtn"
                class="close-btn"
            >
                ×
            </button>

        </div>

        <div id="detailContent"></div>

    </div>

</div>


<!-- =======================================================
     设置
======================================================= -->

<div
    id="settingsModal"
    class="modal-mask hidden"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                设置
            </div>

            <button
                id="closeSettingsBtn"
                class="close-btn"
            >
                ×
            </button>

        </div>

        <div class="settings-list">

            <button
                id="exportBtn"
                class="setting-btn"
            >
                <strong>
                    📦 导出课表备份
                </strong>

                <span>
                    保存为 JSON 文件
                </span>
            </button>


            <button
                id="backupBtn"
                class="setting-btn"
            >
                <strong>
                    ♻️ 恢复课表
                </strong>

                <span>
                    从 JSON 备份恢复
                </span>
            </button>

            <input
                id="backupInput"
                type="file"
                accept=".json"
                hidden
            >


            <button
                id="reimportBtn"
                class="setting-btn"
            >
                <strong>
                    📋 重新导入课表
                </strong>

                <span>
                    清空当前数据并重新粘贴
                </span>
            </button>


            <button
                id="resetBtn"
                class="setting-btn"
            >
                <strong>
                    🗑️ 清除当前课表
                </strong>

                <span>
                    删除本机保存的课表数据
                </span>
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     Toast
======================================================= -->

<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================================
   配置
========================================================= */

const STORAGE_KEY =

    );

const DAYS = [
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六",
    "星期日"
];

const chineseNumbers = {

    "1":"一",
    "2":"二",
    "3":"三",
    "4":"四",
    "5":"五",
    "6":"六",
    "7":"七",
    "8":"八",
    "9":"九"

};

/* =========================================================
   HTML 转义
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   当前周
========================================================= */

function getCurrentWeek(){

    const now =
        new Date();

    const diff =
        now.getTime() -
        semesterStart.getTime();

    const week =
        Math.floor(
            diff /
            (
                7 *
                24 *
                60 *
                60 *
                1000
            )
        ) + 1;

    return Math.max(
        1,
        Math.min(
            18,
            week
        )
    );

}


/* =========================================================
   房间名称
========================================================= */

function getRoomName(room){

    if(!room){

        return "未设置";

    }

    room =
        String(room)
        .trim();


    let match =
        room.match(
            /^(x\d+)\(x\d+$/i
        );

    if(match){

        room =
            match[1];

    }


    /*
       先处理完整名称：

       电气传动实训室
       可编程控制器实训室
       工业机器人综合应用实训室
       体育场
    */

    if(
        room.includes("实训室") ||
        room.includes("实验室") ||
        room.includes("体育场")
    ){

        return room;

    }


    if(
        room.startsWith("x体育场")
    ){

        return "体育场";

    }


    /*
       x1201 → 一教201
       x2213 → 二教213
    */

    match =
        room.match(
            /^x(\d)(\d{3})$/i
        );

    if(match){

        return (
            chineseNumbers[
                match[1]
            ] ||
            match[1]
        ) +
        "教" +
        match[2];

    }


    /*
       xs1203 → 203
       xs1204-2 → 204
       xs1102-1 → 102
    */

    match =
        room.match(
            /^xs\d(\d{3})(?:-\d+)?$/i
        );

    if(match){

        return match[1];

    }


    return room;

}


/* =========================================================
   周次解析
========================================================= */

function parseWeeks(text){

    if(!text){

        return [];

    }

    text =
        String(text)
        .replace(/第/g,"")
        .replace(/周/g,"")
        .trim();


    const result = [];


    const parts =
        text.split(
            /[\s,，、]+/
        );


    parts.forEach(
        part => {

            part =
                part.trim();


            if(!part){

                return;

            }


            const range =
                part.match(
                    /^(\d+)\s*-\s*(\d+)$/
                );


            if(range){

                let start =
                    Number(range[1]);

                let end =
                    Number(range[2]);


                if(start > end){

                    [
                        start,
                        end
                    ] =
                    [
                        end,
                        start
                    ];

                }


                for(
                    let i=start;
                    i<=end;
                    i++
                ){

                    if(
                        i >= 1 &&
                        i <= 18 &&
                        !result.includes(i)
                    ){

                        result.push(i);

                    }

                }

                return;

            }


            const n =
                Number(
                    part.replace(
                        /[^0-9]/g,
                        ""
                    )
                );


            if(
                n >= 1 &&
                n <= 18 &&
                !result.includes(n)
            ){

                result.push(n);

            }

        }
    );


    return result.sort(
        (a,b) => a-b
    );

}


/* =========================================================
   创建课程
========================================================= */

function createCourse(
    day,
    start,
    name,
    code,
    teacher,
    weeks,
    room
){

    return {

        id:
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .slice(2),

        day:
            Number(day),

        start:
            Number(start),

        /*
           你的课表通常两节连续：

           第1-2节
           第3-4节
           第5-6节
           ...

           所以课程块默认占两节。

           注意：
           这里没有任何“几点上课”的假设。
        */

        end:
            Math.min(
                12,
                Number(start) + 1
            ),

        name:
            String(
                name || ""
            ).trim(),

        code:
            String(
                code || ""
            ).trim(),

        teacher:
            String(
                teacher || ""
            ).trim(),

        weeks:
            Array.isArray(weeks)
            ? weeks
            : [],

        room:
            String(
                room || ""
            ).trim()

    };

}


/* =========================================================
   找课程头
========================================================= */

const COURSE_HEADER =
    /([^()\t\r\n]+?)\(([A-Za-z0-9]+\.[A-Za-z0-9]+)\)\s*\(([^()\r\n]*)\)/g;


function findCourseHeaders(text){

    const result = [];


    COURSE_HEADER.lastIndex = 0;


    let match;


    while(
        (
            match =
            COURSE_HEADER.exec(text)
        ) !== null
    ){

        result.push({

            name:
                match[1].trim(),

            code:
                match[2].trim(),

            teacher:
                match[3].trim(),

            index:
                match.index,

            end:
                COURSE_HEADER.lastIndex

        });

    }


    return result;

}


/* =========================================================
   房间解析
========================================================= */

function parseLocation(text){

    if(!text){

        return {
            weeks:[],
            room:""
        };

    }


    const match =
        text.match(
            /\(\s*([0-9][0-9\s,\-]*)\s*,\s*([\s\S]*)/
        );


    if(!match){

        return {
            weeks:[],
            room:""
        };

    }


    const weekText =
        match[1].trim();


    let room =
        match[2].trim();


    room =
        room.replace(
            /\)+$/g,
            ""
        );


    let duplicate =
        room.match(
            /^(x\d+)\(x\d+$/i
        );


    if(duplicate){

        room =
            duplicate[1];

    }


    room =
        room.replace(
            /^x体育场\(x体育场$/i,
            "x体育场"
        );


    room =
        room.replace(
            /(实训室|实验室)\(xs\d+(?:-\d+)?$/i,
            "$1"
        );


    return {

        weeks:
            parseWeeks(
                weekText
            ),

        room:
            room

    };

}


/* =========================================================
   单元格课程解析
========================================================= */

function parseCell(
    cellText,
    day,
    period
){

    if(
        !cellText ||
        !cellText.trim()
    ){

        return [];

    }


    const text =
        String(cellText)
        .replace(
            /\r/g,
            ""
        )
        .replace(
            /\n+/g,
            " "
        )
        .replace(
            /\s{2,}/g,
            " "
        )
        .trim();


    const headers =
        findCourseHeaders(text);


    if(
        headers.length === 0
    ){

        return [];

    }


    const result = [];


    headers.forEach(
        (
            header,
            index
        ) => {

            const next =
                headers[index + 1];


            const end =
                next
                ? next.index
                : text.length;


            const after =
                text.slice(
                    header.end,
                    end
                );


            const location =
                parseLocation(
                    after
                );


            let weeks =
                location.weeks;


            if(
                weeks.length === 0
            ){

                weeks =
                    Array.from(
                        {
                            length:18
                        },
                        (_,i) =>
                            i + 1
                    );

            }


            result.push(
                createCourse(
                    day,
                    period,
                    header.name,
                    header.code,
                    header.teacher,
                    weeks,
                    location.room
                )
            );

        }
    );


    return result;

}


/* =========================================================
   核心课表解析器
========================================================= */

function parseSchoolSchedule(text){

    if(!text){

        return [];

    }


    text =
        String(text)
        .replace(
            /\r\n/g,
            "\n"
        )
        .replace(
            /\r/g,
            "\n"
        );


    const tableStart =
        text.indexOf(
            "节次/周次"
        );


    if(
        tableStart >= 0
    ){

        text =
            text.slice(
                tableStart
            );

    }


    const periodRegex =
        /^第\s*(一|二|三|四|五|六|七|八|九|十|十一|十二|1[0-2]|[1-9])\s*节/gm;


    const blocks = [];


    let match;


    while(
        (
            match =
            periodRegex.exec(text)
        ) !== null
    ){

        let raw =
            match[1];


        let period;


        if(
            /^\d+$/.test(raw)
        ){

            period =
                Number(raw);

        }else{

            const map = {

                "一":1,
                "二":2,
                "三":3,
                "四":4,
                "五":5,
                "六":6,
                "七":7,
                "八":8,
                "九":9,
                "十":10,
                "十一":11,
                "十二":12

            };

            period =
                map[raw];

        }


        blocks.push({

            period,

            start:
                match.index,

            end:
                periodRegex.lastIndex

        });

    }


    console.log(
        "识别到节次:",
        blocks.map(
            x => x.period
        )
    );


    if(
        blocks.length === 0
    ){

        return [];

    }


    const result = [];


    blocks.forEach(
        (
            block,
            index
        ) => {

            const next =
                blocks[index + 1];


            const blockEnd =
                next
                ? next.start
                : text.length;


            let content =
                text.slice(
                    block.end,
                    blockEnd
                );


            if(
                content.startsWith("\t")
            ){

                content =
                    content.slice(1);

            }


            /*
               非常重要：

               必须保留空 TAB。
            */

            const cells =
                content.split("\t");


            console.log(
                `第${block.period}节列数:`,
                cells.length
            );


            for(
                let day=1;
                day<=7;
                day++
            ){

                const cell =
                    cells[day - 1] || "";


                if(
                    !cell.trim()
                ){

                    continue;

                }


                const courses =
                    parseCell(
                        cell,
                        day,
                        block.period
                    );


                result.push(
                    ...courses
                );

            }

        }
    );


    return mergeCourses(
        result
    );

}


/* =========================================================
   合并重复课程
========================================================= */

function mergeCourses(list){

    const map =
        new Map();


    list.forEach(
        course => {

            const key =
                [
                    course.day,
                    course.start,
                    course.name,
                    course.code,
                    course.teacher,
                    course.room
                ].join("|");


            if(
                !map.has(key)
            ){

                map.set(
                    key,
                    {
                        ...course,
                        weeks:[
                            ...course.weeks
                        ]
                    }
                );

            }else{

                const old =
                    map.get(key);


                course.weeks.forEach(
                    week => {

                        if(
                            !old.weeks.includes(week)
                        ){

                            old.weeks.push(week);

                        }

                    }
                );

            }

        }
    );


    return Array
        .from(map.values())
        .map(
            course => {

                course.weeks.sort(
                    (a,b) => a-b
                );

                return course;

            }
        );

}

/* =========================================================
   获取课程
========================================================= */

function getCourses(
    week,
    day
){

    return scheduleData
        .filter(
            course =>
                Number(course.day) === Number(day) &&
                Array.isArray(course.weeks) &&
                course.weeks.includes(Number(week))
        )
        .sort(
            (a,b) =>
                a.start - b.start
        );

}


/* =========================================================
   日期
========================================================= */

function getDateForDay(
    week,
    day
){

    const date =
        new Date(
            semesterStart
        );


    date.setDate(
        date.getDate() +
        (week - 1) * 7 +
        (day - 1)
    );


    return date;

}


function formatDate(date){

    return (
        date.getMonth() + 1
    ) +
    "/" +
    date.getDate();

}

/* =========================================================
   判断两个课程是否相同
========================================================= */

function sameCourse(a,b){

    if(!a || !b){

        return false;

    }


    return (
        Number(a.day) === Number(b.day) &&
        Number(a.start) === Number(b.start) &&
        a.name === b.name &&
        a.code === b.code &&
        a.teacher === b.teacher &&
        a.room === b.room
    );

}


/* =========================================================
   ★ 渲染课表
=========================================================

   重点：

   第1节 + 第2节
   第3节 + 第4节
   第5节 + 第6节
   ...

   课程卡片使用 rowspan=2，
   因此视觉上就是一个完整的大课程块。

   不显示任何课程时间。
========================================================= */

function renderSchedule(){

    const body =
        document.getElementById(
            "scheduleBody"
        );


    body.innerHTML = "";


    /*
       记录哪些单元格已经被 rowspan 占用。

       occupied[day][period] = true
    */

    const occupied =
        Array.from(
            {
                length:8
            },
            () =>
                Array(13).fill(false)
        );


    for(
        let period=1;
        period<=12;
        period++
    ){

        const tr =
            document.createElement(
                "tr"
            );


        /*
           左侧节次

           不再显示课程时间。
        */

        const th =
            document.createElement(
                "th"
            );


        th.innerHTML = `

            <div class="period-number">
                第${period}节
            </div>

        `;


        tr.appendChild(
            th
        );


        for(
            let day=1;
            day<=7;
            day++
        ){

            /*
               如果上一行课程已经 rowspan，
               当前这个 td 就不要创建。
            */

            if(
                occupied[day][period]
            ){

                continue;

            }


            const td =
                document.createElement(
                    "td"
                );


            const courses =
                getCourses(
                    currentWeek,
                    day
                ).filter(
                    course =>
                        Number(course.start) === period
                );


            /*
               当前节没有课程。
            */

            if(
                courses.length === 0
            ){

                tr.appendChild(
                    td
                );

                continue;

            }


            /*
               正常情况下一个时间块只有一个课程。

               如果出现多个课程，
               仍然全部显示。
            */

            courses.forEach(
                course => {

                    /*
                       默认两节连续。

                       如果是第12节，
                       不能超过12。
                    */

                    const canSpanTwo =
                        Number(course.end) >
                        Number(course.start) &&
                        Number(course.start) < 12;


                    if(
                        canSpanTwo
                    ){

                        /*
                           如果第二节没有其他独立课程，
                           就让当前课程占两行。

                           这里不强行要求第二行存在相同课程，
                           因为你学校复制出来的课表本身
                           经常只在第一行保留课程内容。
                        */

                        const nextCourses =
                            getCourses(
                                currentWeek,
                                day
                            ).filter(
                                other =>
                                    Number(other.start) ===
                                    Number(course.start) + 1
                            );


                        /*
                           如果下一节完全没有课程，
                           才安全 rowspan=2。

                           这样不会把两个不同课程压在一起。
                        */

                        const safeToSpan =
                            nextCourses.length === 0;


                        if(
                            safeToSpan
                        ){

                            td.rowSpan = 2;

                            occupied[day][period + 1] = true;

                        }

                    }


                    const card =
                        createCourseCard(
                            course
                        );


                    td.appendChild(
                        card
                    );

                }
            );


            tr.appendChild(
                td
            );

        }


        body.appendChild(
            tr
        );

    }


    updateHeaderDates();

}

                        course.day - 1
                    ]}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    节次
                </div>

                <div class="detail-value">
                    第${course.start}-${course.end}节
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    教室
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        room
                    )}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    教师
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        course.teacher ||
                        "未设置"
                    )}
                </div>

            </div>


            <div
                class="detail-item"
                style="grid-column:1/-1"
            >

                <div class="detail-label">
                    上课周次
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        weeks
                    )}
                </div>

            </div>

        </div>

    `;


    modal.classList.remove(
        "hidden"
    );

}


/* =========================================================
   保存
========================================================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({

            version:10,

            semester:
                "2026-2027学年1学期",

            courses:
                scheduleData

        })
    );

}


/* =========================================================
   加载
========================================================= */

function loadData(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(!raw){

            return false;

        }


        const data =
            JSON.parse(
                raw
            );


        if(
            !data ||
            !Array.isArray(
                data.courses
            ) ||
            data.courses.length === 0
        ){

            return false;

        }


        scheduleData =
            data.courses;


        return true;

    }catch(error){

        console.error(
            error
        );

        return false;

    }

}


/* =========================================================
   导入文本
========================================================= */

function importText(text){

    if(
        !text ||
        !text.trim()
    ){

        toast(
            "请先粘贴课表"
        );

        return;

    }


    importScheduleText(
        text
    );

}


/* =========================================================
   显示主页面
========================================================= */

function showMainPage(){

    document
        .getElementById(
            "importPage"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "mainPage"
        )
        .classList.remove(
            "hidden"
        );


    renderWeeks();

    renderSchedule();

    renderToday();

}


/* =========================================================
   显示导入页
========================================================= */

function showImportPage(){

    document
        .getElementById(
            "mainPage"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "importPage"
        )
        .classList.remove(
            "hidden"
        );

}


/* =========================================================
   Toast
========================================================= */

let toastTimer = null;


function toast(message){

    const box =
        document.getElementById(
            "toast"
        );


    box.textContent =
        message;


    box.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                box.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   粘贴按钮
========================================================= */

document
    .getElementById(
        "pasteBtn"
    )
    .onclick =
    () => {

        document
            .getElementById(
                "pasteModal"
            )
            .classList.remove(
                "hidden"
            );

    };


/* =========================================================
   导入文件
========================================================= */

document
    .getElementById(
        "fileImportBtn"
    )
    .onclick =
    () => {

        document
            .getElementById(
                "fileInput"
            )
            .click();

    };


/* =========================================================
   关闭粘贴
========================================================= */

function closePasteModal(){

    document
        .getElementById(
            "pasteModal"
        )
        .classList.add(
            "hidden"
        );

}


document
    .getElementById(
        "closePasteBtn"
    )
    .onclick =
    closePasteModal;


document
    .getElementById(
        "cancelPasteBtn"
    )
    .onclick =
    closePasteModal;


/* =========================================================
   生成课表
========================================================= */

document
    .getElementById(
        "generateBtn"
    )
    .onclick =
    () => {

        const textarea =
            document.getElementById(
                "pasteText"
            );


        importText(
            textarea.value
        );

    };


/* =========================================================
   文件导入
========================================================= */

document
    .getElementById(
        "fileInput"
    )
    .addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];


            if(!file){

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                () => {

                    importText(
                        reader.result
                    );

                };


            reader.readAsText(
                file,
                "utf-8"
            );


            event.target.value =
                "";

        }
    );


/* =========================================================
   设置
========================================================= */

document
    .getElementById(
        "settingsBtn"
    )
    .onclick =
    () => {

        document
            .getElementById(
                "settingsModal"
            )
            .classList.remove(
                "hidden"
            );

    };


document
    .getElementById(
        "closeSettingsBtn"
    )
    .onclick =
    () => {

        document
            .getElementById(
                "settingsModal"
            )
            .classList.add(
                "hidden"
            );

    };


/* =========================================================
   详情关闭
========================================================= */

document
    .getElementById(
        "closeDetailBtn"
    )
    .onclick =
    () => {

        document
            .getElementById(
                "detailModal"
            )
            .classList.add(
                "hidden"
            );

    };


/* =========================================================
   导出
========================================================= */

document
    .getElementById(
        "exportBtn"
    )
    .onclick =
    () => {

        const data = {

            version:10,

            exportTime:
                new Date()
                .toISOString(),

            semester:
                "2026-2027学年1学期",

            courses:
                scheduleData

        };


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;

        a.download =
            "我的课表备份.json";


        document
            .body
            .appendChild(a);


        a.click();

        a.remove();


        URL.revokeObjectURL(
            url
        );


        toast(
            "课表备份已导出"
        );

    };


/* =========================================================
   恢复备份
========================================================= */

document
    .getElementById(
        "backupBtn"
    )
    .onclick =
    () => {

        document
            .getElementById(
                "backupInput"
            )
            .click();

    };


document
    .getElementById(
        "backupInput"
    )
    .addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];


            if(!file){

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                () => {

                    try{

                        const data =
                            JSON.parse(
                                reader.result
                            );


                        if(
                            !Array.isArray(
                                data.courses
                            )
                        ){

                            throw new Error(
                                "格式错误"
                            );

                        }


                        scheduleData =
                            data.courses;


                        saveData();

                        showMainPage();


                        toast(
                            `已恢复 ${scheduleData.length} 个课程`
                        );

                    }catch(error){

                        console.error(
                            error
                        );

                        toast(
                            "备份文件格式错误"
                        );

                    }

                };


            reader.readAsText(
                file,
                "utf-8"
            );


            event.target.value =
                "";

        }
    );


/* =========================================================
   重新导入
========================================================= */

document
    .getElementById(
        "reimportBtn"
    )
    .onclick =
    () => {

        document
            .getElementById(
                "settingsModal"
            )
            .classList.add(
                "hidden"
            );


        document
            .getElementById(
                "pasteText"
            )
            .value = "";


        document
            .getElementById(
                "pasteModal"
            )
            .classList.remove(
                "hidden"
            );

    };


/* =========================================================
   清除
========================================================= */

document
    .getElementById(
        "resetBtn"
    )
    .onclick =
    () => {

        if(
            !confirm(
                "确定清除当前课表吗？"
            )
        ){

            return;

        }


        localStorage.removeItem(
            STORAGE_KEY
        );


        localStorage.removeItem(
            "my_schedule_v9"
        );

        localStorage.removeItem(
            "my_schedule_v8"
        );

        localStorage.removeItem(
            "my_schedule_v7"
        );


        scheduleData = [];


        document
            .getElementById(
                "settingsModal"
            )
            .classList.add(
                "hidden"
            );


        showImportPage();


        toast(
            "课表已清除"
        );

    };


/* =========================================================
   点击遮罩关闭
========================================================= */

document
    .querySelectorAll(
        ".modal-mask"
    )
    .forEach(
        mask => {

            mask.addEventListener(
                "click",
                event => {

                    if(
                        event.target === mask
                    ){

                        mask.classList.add(
                            "hidden"
                        );

                    }

                }
            );

        }
    );


/* =========================================================
   初始化
========================================================= */

function init(){

    if(
        loadData()
    ){

        showMainPage();

    }else{

        showImportPage();

    }

}


init();

</script>

</body>
</html>
