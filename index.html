<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="我的课表">
<title>我的课表</title>

<style>
:root{
    --bg:#07111f;
    --bg2:#0b1728;
    --card:rgba(18,32,52,.88);
    --card2:rgba(25,43,68,.94);
    --line:rgba(255,255,255,.08);
    --text:#f5f8ff;
    --muted:#8fa1ba;
    --primary:#5b8cff;
    --primary2:#765cff;
    --green:#39d98a;
    --shadow:0 18px 50px rgba(0,0,0,.28);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 0%,rgba(91,140,255,.18),transparent 30%),
        radial-gradient(circle at 90% 5%,rgba(118,92,255,.14),transparent 30%),
        linear-gradient(145deg,#050c17,#081321 55%,#07111f);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}

button,textarea,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    width:min(1500px,100%);
    margin:auto;
    padding:14px 10px 45px;
}

.header{
    position:relative;
    overflow:hidden;
    margin-bottom:14px;
    padding:20px;
    border:1px solid var(--line);
    border-radius:25px;
    background:linear-gradient(135deg,rgba(31,54,87,.88),rgba(11,24,41,.92));
    box-shadow:var(--shadow);
}

.header-main{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    color:white;
    font-size:23px;
    font-weight:900;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.title{
    margin:0;
    font-size:24px;
}

.subtitle{
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    color:white;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.07);
}

.today-panel{
    margin-bottom:14px;
    padding:17px;
    border:1px solid rgba(91,140,255,.22);
    border-radius:21px;
    background:linear-gradient(135deg,rgba(37,64,105,.92),rgba(16,31,51,.94));
    box-shadow:var(--shadow);
}

.today-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:13px;
}

.today-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:18px;
    font-weight:900;
}

.today-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 14px var(--green);
}

.today-info{
    color:var(--muted);
    font-size:12px;
}

.today-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:9px;
}

.today-course{
    position:relative;
    overflow:hidden;
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
}

.today-course:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:linear-gradient(var(--primary),var(--primary2));
}

.today-course-name{
    padding-left:5px;
    font-size:15px;
    font-weight:900;
}

.today-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:9px;
}

.badge{
    padding:5px 8px;
    border-radius:8px;
    background:rgba(255,255,255,.07);
    color:#c9d6e9;
    font-size:11px;
}

.today-empty{
    color:var(--muted);
    font-size:13px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
}

.control-btn{
    padding:10px 14px;
    border-radius:12px;
    color:#dce7fa;
    background:rgba(255,255,255,.065);
    border:1px solid var(--line);
}

.control-btn.primary{
    color:white;
    border:0;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.week-panel{
    margin-bottom:14px;
    padding:13px;
    border:1px solid var(--line);
    border-radius:19px;
    background:rgba(10,23,39,.8);
}

.week-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.week-title strong{
    font-size:14px;
}

.week-title span{
    color:var(--muted);
    font-size:12px;
}

.weeks{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:6px;
}

.week-btn{
    min-height:35px;
    border-radius:9px;
    color:#91a4bd;
    background:rgba(255,255,255,.045);
    border:1px solid transparent;
    font-size:12px;
}

.week-btn.current{
    color:#a9c1ff;
    border-color:rgba(91,140,255,.4);
}

.week-btn.active{
    color:white;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.schedule-wrap{
    overflow:auto;
    border:1px solid var(--line);
    border-radius:21px;
    background:rgba(7,16,29,.75);
    box-shadow:var(--shadow);
    -webkit-overflow-scrolling:touch;
}

.schedule{
    width:100%;
    min-width:980px;
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
}

.schedule th,
.schedule td{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
}

.schedule thead th{
    position:sticky;
    top:0;
    z-index:5;
    height:62px;
    background:rgba(11,24,41,.97);
    backdrop-filter:blur(15px);
}

.schedule thead th:first-child{
    width:82px;
    position:sticky;
    left:0;
    z-index:8;
}

.day-head{
    text-align:center;
}

.day-name{
    color:white;
    font-size:14px;
    font-weight:900;
}

.date{
    display:block;
    margin-top:4px;
    color:#7489a5;
    font-size:11px;
}

.day-head.today{
    background:linear-gradient(180deg,rgba(91,140,255,.28),rgba(91,140,255,.07));
}

.day-head.today .day-name{
    color:#9eb9ff;
}

.period-cell{
    width:82px;
    min-width:82px;
    position:sticky;
    left:0;
    z-index:4;
    text-align:center;
    background:rgba(9,20,34,.98);
}

.period-cell.part-start{
    border-top:2px solid rgba(255,255,255,.1);
}

.period-num{
    font-size:15px;
    font-weight:900;
}

.period-part{
    margin-top:4px;
    color:#7187a3;
    font-size:10px;
}

.schedule td{
    height:72px;
    padding:5px;
    vertical-align:top;
    background:rgba(7,16,29,.44);
}

.schedule td.today-col{
    background:rgba(91,140,255,.055);
}

.course-card{
    position:relative;
    height:100%;
    min-height:60px;
    overflow:hidden;
    padding:10px 9px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:13px;
    background:linear-gradient(135deg,rgba(49,82,137,.76),rgba(35,50,79,.8));
    box-shadow:0 7px 18px rgba(0,0,0,.15);
    cursor:pointer;
}

.course-card.today-highlight{
    border-color:rgba(91,140,255,.8);
    box-shadow:0 0 0 1px rgba(91,140,255,.15),0 8px 25px rgba(44,100,255,.24);
}

.course-name{
    padding-right:18px;
    font-size:13px;
    line-height:1.4;
    font-weight:900;
}

.course-teacher{
    margin-top:6px;
    color:#aebed4;
    font-size:10px;
}

.course-room{
    margin-top:5px;
    color:#d2def0;
    font-size:10px;
}

.modal-mask{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
}

.modal-mask.show{
    display:flex;
}

.modal{
    width:min(680px,100%);
    max-height:90vh;
    overflow:auto;
    padding:20px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px 25px 0 0;
    background:#0d1b2d;
    box-shadow:0 -20px 70px rgba(0,0,0,.4);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.modal-title{
    font-size:19px;
    font-weight:900;
}

.close{
    width:38px;
    height:38px;
    border-radius:12px;
    color:#cbd7e9;
    background:rgba(255,255,255,.07);
}

.detail-item{
    padding:13px 0;
    border-bottom:1px solid var(--line);
}

.detail-label{
    margin-bottom:5px;
    color:#7187a3;
    font-size:11px;
}

.detail-value{
    color:#f2f6ff;
    font-size:14px;
    line-height:1.5;
}

textarea{
    width:100%;
    min-height:270px;
    padding:12px;
    resize:vertical;
    outline:none;
    border:1px solid var(--line);
    border-radius:14px;
    color:white;
    background:rgba(255,255,255,.045);
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:13px;
}

.modal-actions button{
    flex:1;
    padding:12px;
    border-radius:13px;
}

.primary-btn{
    color:white;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.secondary-btn{
    color:#cbd8ea;
    background:rgba(255,255,255,.07);
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:200;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    padding:11px 16px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    color:white;
    background:rgba(20,31,48,.97);
    box-shadow:var(--shadow);
    font-size:13px;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:700px){
    .app{
        padding:9px 7px 35px;
    }

    .header{
        padding:17px;
    }

    .logo{
        width:46px;
        height:46px;
        font-size:20px;
    }

    .title{
        font-size:21px;
    }

    .today-list{
        display:flex;
        overflow-x:auto;
    }

    .today-course{
        min-width:260px;
    }

    .weeks{
        grid-template-columns:repeat(9,1fr);
    }
}

@media(max-width:430px){
    .weeks{
        grid-template-columns:repeat(6,1fr);
    }

    .controls{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }

    .control-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<script>

const semesterStart = new Date("2026-09-01T00:00:00");

const STORAGE_KEY = "shuoce_schedule_v8";

const DAY_NAMES = [
    "星期一","星期二","星期三",
    "星期四","星期五","星期六","星期日"
];

const CN_PERIOD = {
    "一":1,
    "二":2,
    "三":3,
    "四":4,
    "五":5,
    "六":6,
    "七":7,
    "八":8,
    "九":9,
    "十":10,
    "十一":11,
    "十二":12
};

let courses = [];
let selectedWeek = getCurrentWeek();


function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   周次
========================= */

function getCurrentWeek(){

    const now = new Date();

    const today = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

    const start = new Date(
        semesterStart.getFullYear(),
        semesterStart.getMonth(),
        semesterStart.getDate()
    );

    const diff = Math.floor(
        (today - start) / 86400000
    );

    if(diff < 0) return 1;

    return Math.floor(diff / 7) + 1;
}


function getWeekMonday(week){

    const base = new Date(
        semesterStart.getFullYear(),
        semesterStart.getMonth(),
        semesterStart.getDate()
    );

    const day = base.getDay();

    const offset = day === 0 ? -6 : 1 - day;

    base.setDate(
        base.getDate() +
        offset +
        (week - 1) * 7
    );

    base.setHours(0,0,0,0);

    return base;
}


function getDateForDay(week,day){

    const monday = getWeekMonday(week);

    const date = new Date(monday);

    date.setDate(
        monday.getDate() + day - 1
    );

    return date;
}


function formatDate(date){

    return `${date.getMonth()+1}月${date.getDate()}日`;
}


function getDayNumber(date=new Date()){

    const day = date.getDay();

    return day === 0 ? 7 : day;
}


function getPart(period){

    if(period <= 4) return "上午";
    if(period <= 8) return "下午";
    return "晚上";
}


/* =========================
   节次
========================= */

function parsePeriod(text){

    if(!text) return null;

    text = String(text).trim();

    const cn = text.match(
        /第\s*(十一|十二|十|一|二|三|四|五|六|七|八|九)\s*节/
    );

    if(cn){
        return CN_PERIOD[cn[1]];
    }

    const number = text.match(/\b(1[0-2]|[1-9])\b/);

    return number ? Number(number[1]) : null;
}


/* =========================
   周次
========================= */

function parseWeeks(text){

    if(!text) return [];

    text = String(text)
        .replace(/第/g,"")
        .replace(/周/g,"")
        .replace(/，/g,",")
        .trim();

    const result = [];

    for(const m of text.matchAll(/(\d+)\s*[-~—至]\s*(\d+)/g)){

        let a = Number(m[1]);
        let b = Number(m[2]);

        if(a > b){
            [a,b] = [b,a];
        }

        for(let i=a;i<=b;i++){
            if(i >= 1 && i <= 18){
                result.push(i);
            }
        }
    }

    const rest = text.replace(
        /\d+\s*[-~—至]\s*\d+/g,
        " "
    );

    for(const m of rest.matchAll(/\d+/g)){

        const n = Number(m[0]);

        if(n >= 1 && n <= 18){
            result.push(n);
        }
    }

    return [...new Set(result)].sort((a,b)=>a-b);
}


/* =========================
   地点
========================= */

function normalizeRoom(raw){

    if(!raw) return "未设置";

    let room = String(raw)
        .trim()
        .replace(/\s+/g," ");

    room = room.replace(/[)\]}>]+$/,"");

    /*
     * 体育场
     */
    if(room.includes("体育场")){
        return "体育场";
    }

    /*
     * 有正式名称的实训室/实验室：
     *
     * 电气传动实训室(xs1204-2)
     *
     * 直接取括号前的名称。
     */
    if(
        room.includes("实训室") ||
        room.includes("实验室")
    ){

        const name = room
            .split("(")[0]
            .trim();

        if(name) return name;
    }

    /*
     * x1201(x1201)
     */
    let match = room.match(
        /^(x\d{4})\(\1\)$/i
    );

    if(match){
        room = match[1];
    }

    /*
     * x1201 → 一教201
     */
    match = room.match(
        /^x(\d)(\d{3})$/i
    );

    if(match){

        const building = {
            "1":"一",
            "2":"二",
            "3":"三",
            "4":"四",
            "5":"五"
        }[match[1]] || match[1];

        return `${building}教${match[2]}`;
    }

    /*
     * xs1203 → 203
     * xs1204-2 → 204
     * xs1102-1 → 102
     */
    match = room.match(
        /^xs\d(\d{3})(?:-\d+)?$/i
    );

    if(match){
        return match[1];
    }

    return room;
}


/* =========================
   括号解析
========================= */

function readBalanced(text,start){

    if(text[start] !== "("){
        return null;
    }

    let depth = 0;

    for(let i=start;i<text.length;i++){

        const c = text[i];

        if(c === "("){
            depth++;
        }
        else if(c === ")"){

            depth--;

            if(depth === 0){

                return {
                    content:text.slice(start+1,i),
                    end:i+1
                };
            }
        }
    }

    /*
     * 教务系统复制文本偶尔少一个右括号。
     * 这种情况直接读到末尾。
     */
    return {
        content:text.slice(start+1),
        end:text.length
    };
}


/* =========================
   找课程代码
========================= */

const COURSE_CODE_RE =
    /\(([0-9][A-Za-z0-9]*\.[A-Za-z0-9]+)\)/g;


function findCourseHeaders(text){

    const result = [];

    COURSE_CODE_RE.lastIndex = 0;

    let match;

    while(
        (match = COURSE_CODE_RE.exec(text))
    ){

        const code = match[1];

        let nameStart = match.index - 1;

        while(
            nameStart >= 0 &&
            /\s/.test(text[nameStart])
        ){
            nameStart--;
        }

        /*
         * 找课程名称起点。
         *
         * 课程名称通常从：
         * 行首 / 上一个换行 / +
         * 开始。
         */
        let start = nameStart;

        while(start >= 0){

            const c = text[start];

            if(
                c === "\n" ||
                c === "\r" ||
                c === "+"
            ){
                start++;
                break;
            }

            start--;
        }

        if(start < 0){
            start = 0;
        }

        let name =
            text.slice(
                start,
                match.index
            ).trim();

        /*
         * 清除可能残留的分隔符。
         */
        name = name
            .replace(/^[+\s]+/,"")
            .replace(/[+\s]+$/,"");

        /*
         * 如果名称前混入了地点信息，
         * 只保留最后一个明显的课程名称片段。
         */
        if(name.includes("\n")){
            const arr = name
                .split(/\n+/)
                .map(x=>x.trim())
                .filter(Boolean);

            name = arr[arr.length-1] || name;
        }

        result.push({
            name,
            code,
            codeStart:match.index,
            codeEnd:COURSE_CODE_RE.lastIndex
        });
    }

    return result;
}


/* =========================
   解析一个星期单元格
========================= */

function parseCell(cell,day,period){

    if(!cell || !cell.trim()){
        return [];
    }

    /*
     * 保留换行。
     * 换行对课程之间的分隔非常重要。
     */
    const text = cell
        .replace(/\r/g,"")
        .trim();

    const headers = findCourseHeaders(text);

    const result = [];

    for(let i=0;i<headers.length;i++){

        const h = headers[i];

        const end =
            i + 1 < headers.length
                ? headers[i+1].codeStart
                : text.length;

        const afterCode = text.slice(
            h.codeEnd,
            end
        );

        /*
         * 从课程代码后开始找括号。
         */
        let pos = 0;

        const groups = [];

        while(pos < afterCode.length){

            const index =
                afterCode.indexOf(
                    "(",
                    pos
                );

            if(index < 0){
                break;
            }

            const absolute =
                index;

            const group =
                readBalanced(
                    afterCode,
                    absolute
                );

            if(!group){
                break;
            }

            groups.push(
                group.content.trim()
            );

            pos =
                group.end;
        }

        /*
         * groups通常是：
         *
         * 0 = 教师
         * 1 = 周次+地点
         * 2 = 另一组周次+地点
         *
         * 如果第一个就是周次，则没有教师。
         */
        let teacher = "";
        let locationGroups = [];

        if(groups.length){

            const first = groups[0];

            if(
                /^\s*\d/.test(first) &&
                first.includes(",")
            ){

                locationGroups = groups;

            }else{

                teacher = first;
                locationGroups = groups.slice(1);
            }
        }

        /*
         * 如果正常括号结构没有解析出来，
         * 再直接从 afterCode 中寻找：
         *
         * (1-16,x1101...)
         */
        if(!locationGroups.length){

            const locRegex =
                /\(\s*([0-9][^,()]*)\s*,\s*([\s\S]*?)(?=\n\s*[^\n(]+\([0-9][A-Za-z0-9]*\.[A-Za-z0-9]+\)|$)/g;

            let lm;

            while(
                (lm = locRegex.exec(afterCode))
            ){

                locationGroups.push(
                    `${lm[1]},${lm[2]}`
                );
            }
        }

        /*
         * 一个课程可能有多个安排：
         *
         * (1 3-8,x1101...)
         * (2,x1201...)
         *
         * 必须分别保存。
         */
        for(
            const location of locationGroups
        ){

            const comma =
                location.indexOf(",");

            if(comma < 0){
                continue;
            }

            const weekText =
                location
                    .slice(0,comma)
                    .trim();

            let rawRoom =
                location
                    .slice(comma+1)
                    .trim();

            /*
             * 清理复制文本可能缺失/多出的括号。
             */
            rawRoom =
                rawRoom
                    .replace(/[)\]}]+$/,"")
                    .trim();

            const weeks =
                parseWeeks(
                    weekText
                );

            if(!weeks.length){
                continue;
            }

            result.push({

                id:
                    `${Date.now()}_${Math.random().toString(36).slice(2)}`,

                name:h.name,

                code:h.code,

                teacher:
                    teacher ||
                    "教师未设置",

                day,

                start:period,

                /*
                 * 教务系统这里的连续课，
                 * 按两节一块显示。
                 */
                end:
                    Math.min(
                        period + 1,
                        12
                    ),

                weeks,

                room:
                    normalizeRoom(
                        rawRoom
                    ),

                rawRoom

            });
        }
    }

    return result;
}


/* =========================
   最关键：
   按TAB恢复7个星期列
========================= */

function parseRows(text){

    const lines =
        text
            .replace(/\r\n/g,"\n")
            .replace(/\r/g,"\n")
            .split("\n");

    const rows = [];

    let current = null;

    /*
     * 当前正在写入的星期列。
     *
     * 这比“寻找最后一个非空单元格”
     * 准确很多。
     */
    let currentCol = -1;

    for(const rawLine of lines){

        if(
            rawLine.includes("课程列表:")
        ){
            break;
        }

        const periodMatch =
            rawLine.match(
                /^\s*第(一|二|三|四|五|六|七|八|九|十|十一|十二)节/
            );

        if(periodMatch){

            if(current){
                rows.push(current);
            }

            const period =
                CN_PERIOD[
                    periodMatch[1]
                ];

            current = {
                period,
                cells:["","","","","","",""]
            };

            currentCol = -1;

            /*
             * 第一列是“第一节”，
             * 后面严格按照TAB对应星期。
             */
            const parts =
                rawLine.split("\t");

            for(
                let i=1;
                i<parts.length;
                i++
            ){

                const day = i - 1;

                if(day > 6) break;

                if(parts[i]){
                    current.cells[day] =
                        parts[i].trim();
                }
            }

            currentCol =
                Math.min(
                    6,
                    parts.length - 2
                );

            continue;
        }

        if(!current){
            continue;
        }

        /*
         * 空行：
         * 不改变当前列。
         */
        if(rawLine === ""){
            continue;
        }

        const parts =
            rawLine.split("\t");

        /*
         * 没有TAB：
         *
         * 一定是当前星期单元格的
         * 后续文字。
         */
        if(parts.length === 1){

            if(currentCol >= 0){

                current.cells[currentCol] +=
                    (
                        current.cells[currentCol]
                            ? "\n"
                            : ""
                    ) +
                    parts[0].trim();
            }

            continue;
        }

        /*
         * 有TAB：
         *
         * 第一个字段属于当前列，
         * 后面的字段依次进入后面的星期。
         */
        let col = currentCol;

        for(const part of parts){

            if(col < 0){
                col = 0;
            }

            if(col > 6){
                break;
            }

            if(part){

                current.cells[col] +=
                    (
                        current.cells[col]
                            ? "\n"
                            : ""
                    ) +
                    part.trim();
            }

            col++;
        }

        currentCol =
            Math.min(
                6,
                col - 1
            );
    }

    if(current){
        rows.push(current);
    }

    return rows;
}


/* =========================
   主解析
========================= */

function parseSchoolSchedule(source){

    if(
        !source ||
        !source.trim()
    ){
        throw new Error("没有课表内容");
    }

    const text =
        source
            .replace(/\u00a0/g," ")
            .replace(/\r\n/g,"\n")
            .replace(/\r/g,"\n");

    /*
     * 必须找到课表表头。
     */
    if(
        !text.includes("星期一") ||
        !text.includes("星期二") ||
        !text.includes("星期三") ||
        !text.includes("星期四")
    ){
        throw new Error(
            "没有找到完整课表表头"
        );
    }

    /*
     * 找到“节次/周次”所在位置。
     */
    const headerIndex =
        text.indexOf("星期一");

    /*
     * 从课表表头附近开始，
     * 避免把菜单里的其他内容
     * 当成课程。
     */
    const scheduleText =
        text.slice(
            Math.max(
                0,
                text.lastIndexOf(
                    "节次/周次",
                    headerIndex
                )
            )
        );

    const rows =
        parseRows(
            scheduleText
        );

    const result = [];

    for(const row of rows){

        if(
            !row.period ||
            row.period < 1 ||
            row.period > 12
        ){
            continue;
        }

        for(let day=1;day<=7;day++){

            const cell =
                row.cells[day-1];

            if(!cell){
                continue;
            }

            const parsed =
                parseCell(
                    cell,
                    day,
                    row.period
                );

            result.push(
                ...parsed
            );
        }
    }

    /*
     * 去重。
     */
    const map = new Map();

    for(const course of result){

        const key = [
            course.code,
            course.day,
            course.start,
            course.end,
            course.teacher,
            course.room,
            course.weeks.join(",")
        ].join("|");

        if(!map.has(key)){
            map.set(key,course);
        }
    }

    const finalCourses =
        [...map.values()];

    if(!finalCourses.length){
        throw new Error(
            "没有识别到课程"
        );
    }

    return finalCourses;
}


/* =========================
   周课程
========================= */

function getCoursesForWeek(week){

    return courses.filter(
        course =>
            Array.isArray(course.weeks) &&
            course.weeks.includes(week)
    );
}


/* =========================
   周按钮
========================= */

function renderWeeks(){

    const box =
        document.getElementById("weeks");

    box.innerHTML = "";

    const current =
        getCurrentWeek();

    for(let i=1;i<=18;i++){

        const button =
            document.createElement("button");

        button.className =
            "week-btn";

        if(i === current){
            button.classList.add("current");
        }

        if(i === selectedWeek){
            button.classList.add("active");
        }

        button.textContent = i;

        button.onclick = () => {
            selectedWeek = i;
            renderAll();
        };

        box.appendChild(button);
    }

    document.getElementById("weekText").textContent =
        `第 ${selectedWeek} 周`;
}

function renderDayHeaders(){

    const currentWeek =
        getCurrentWeek();

        getDayNumber();

    for(let day=1;day<=7;day++){

            document.getElementById(

function courseCardHTML(course){

    const today =
        selectedWeek === getCurrentWeek() &&
        course.day === getDayNumber();

    return `
        <div
            class="course-card ${today ? "today-highlight" : ""}"
            onclick="showCourseDetail('${course.id}')"
        >

                ${escapeHTML(course.name)}
            </div>

            <div class="course-teacher">
                👤 ${escapeHTML(course.teacher)}

            </div>
        </div>
    `;
}


/* =========================
   课表
========================= */

function renderSchedule(){

    const body =
        document.getElementById("scheduleBody");

    body.innerHTML = "";

    const weekCourses =
        getCoursesForWeek(
            selectedWeek
        );

    const occupied =
        new Set();

    for(let period=1;period<=12;period++){

        const tr =
            document.createElement("tr");

        const periodCell =
            document.createElement("td");

        periodCell.className =
            "period-cell";

        if(
            period === 1 ||
            period === 5 ||
            period === 9
        ){
            periodCell.classList.add(
                "part-start"
            );
        }

        periodCell.innerHTML = `
            <div class="period-num">${period}</div>
            <div class="period-part">${getPart(period)}</div>
        `;

        tr.appendChild(periodCell);

        for(let day=1;day<=7;day++){

            const key =
                `${day}-${period}`;

            if(occupied.has(key)){
                continue;
            }

            const td =
                document.createElement("td");

            if(
                selectedWeek === getCurrentWeek() &&
                day === getDayNumber()
            ){
                td.classList.add("today-col");
            }

            const matches =
                weekCourses.filter(
                    course =>
                        course.day === day &&
                        course.start === period
                );

            if(matches.length){

                td.innerHTML =
                    matches
                        .map(course =>
                            courseCardHTML(course)
                        )
                        .join("");

                /*
                 * 只有一个课程时合并连续两节。
                 */
                if(matches.length === 1){

                    const course =
                        matches[0];

                    const span =
                        Math.min(
                            course.end -
                            course.start +
                            1,
                            12 -
                            period +
                            1
                        );

                    if(span > 1){

                        td.rowSpan = span;

                        for(
                            let p=period+1;
                            p<period+span;
                            p++
                        ){
                            occupied.add(
                                `${day}-${p}`
                            );
                        }
                    }
                }

            }else{

                td.innerHTML = "";
            }

            tr.appendChild(td);
        }

        body.appendChild(tr);
    }
}


/* =========================
   今日
========================= */

function renderToday(){

    const list =
        document.getElementById("todayList");

    const info =
        document.getElementById("todayInfo");

    const now =
        new Date();

    const week =
        getCurrentWeek();

    const day =
        getDayNumber(now);

    info.textContent =
        `${formatDate(now)} · 第${week}周 · ${DAY_NAMES[day-1]}`;

    const todayCourses =
        courses
            .filter(
                course =>
                    course.day === day &&
                    course.weeks.includes(week)
            )
            .sort(
                (a,b) =>
                    a.start - b.start
            );

    if(!todayCourses.length){

        list.innerHTML = `
            <div class="today-empty">
                🎉 今天没有安排课程
            </div>
        `;

        return;
    }

    list.innerHTML =
        todayCourses
            .map(course => `
                <div
                    class="today-course"
                    onclick="showCourseDetail('${course.id}')"
                >
                    <div class="today-course-name">
                        ${escapeHTML(course.name)}
                    </div>

                    <div class="today-meta">
                        <span class="badge">
                            第${course.start}-${course.end}节
                        </span>

                        <span class="badge">
                            ${getPart(course.start)}
                        </span>

                        <span class="badge">
                            📍 ${escapeHTML(course.room)}
                        </span>
                    </div>
                </div>
            `)
            .join("");
}

function openImportModal(){

function importScheduleText(){

    const input =
        document.getElementById(
            "scheduleInput"
        );

    const text =
        input.value;

    if(!text.trim()){

        showToast("请先粘贴课表");

        return;
    }

    try{

        const parsed =
            parseSchoolSchedule(
                text
            );

        const uniqueNames =
            new Set(
                parsed.map(
                    x => x.code
                )
            );

        /*
         * 正常应该识别到14门课程。
         *
         * 少于3门直接拒绝覆盖。
         */
        if(uniqueNames.size < 3){

            throw new Error(
                `只识别到 ${uniqueNames.size} 门课程，已取消导入`
            );
        }

        courses = parsed;

        saveData();

        selectedWeek =
            getCurrentWeek();

        renderAll();

        closeModal("importModal");

        showToast(
            `已识别 ${uniqueNames.size} 门课程`
        );

    }catch(error){

        console.error(error);

        showToast(
            error.message ||
            "解析失败"
        );
    }
}

function exportJSON(){

    const data = {
        version:8,
        semesterStart:"2026-09-01",
        semester:"2026-2027学年1学期",
        courses
    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "我的课表备份.json";

    a.click();

    URL.revokeObjectURL(url);

    showToast("备份已导出");
}


function importJSON(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload = function(){

        try{

            const data =
                JSON.parse(
                    reader.result
                );

            if(
                !data ||
                !Array.isArray(data.courses)
            ){
                throw new Error(
                    "备份格式错误"
                );
            }

            courses =
                data.courses;

            saveData();

            selectedWeek =
                getCurrentWeek();

            renderAll();

            showToast("备份恢复成功");

        }catch(error){

            showToast(
                "恢复失败：" +
                error.message
            );
        }
    };

    reader.readAsText(file);

    event.target.value = "";
}

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            3000
        );
}
