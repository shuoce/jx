<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<meta name="description" content="我的课表">
<title>我的课表</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07111f;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
        "PingFang SC","Microsoft YaHei",sans-serif;
}

body{
    overflow-x:hidden;
}

button,input,textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   背景
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 10%,
        rgba(40,120,255,.18),transparent 35%),
        radial-gradient(circle at 80% 80%,
        rgba(160,60,255,.14),transparent 35%);
}

/* =========================
   导入页
========================= */

#importPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.import-box{
    width:100%;
    max-width:520px;
    padding:32px 24px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 20px 80px rgba(0,0,0,.35);
    text-align:center;
}

.logo{
    width:72px;
    height:72px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    font-size:34px;
    box-shadow:0 12px 40px rgba(59,130,246,.3);
}

.import-box h1{
    margin:0;
    font-size:28px;
}

.import-box p{
    margin:10px 0 28px;
    color:#94a3b8;
    line-height:1.7;
}

.import-buttons{
    display:flex;
    gap:12px;
}

.import-buttons button{
    flex:1;
}

.primary-btn,
.secondary-btn{
    min-height:50px;
    padding:0 18px;
    border-radius:15px;
    font-weight:700;
    color:#fff;
}

.primary-btn{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    box-shadow:0 8px 28px rgba(37,99,235,.25);
}

.primary-btn:disabled{
    opacity:.6;
    cursor:wait;
}

.secondary-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
}

.import-tip{
    margin-top:20px;
    padding:14px;
    border-radius:14px;
    background:rgba(255,255,255,.035);
    color:#64748b;
    font-size:12px;
    line-height:1.7;
}

/* =========================
   主页面
========================= */

#mainPage{
    min-height:100vh;
    padding-bottom:40px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    padding:
        calc(12px + env(safe-area-inset-top))
        16px 12px;
    background:rgba(7,17,31,.82);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.title-area h1{
    margin:0;
    font-size:22px;
}

.title-area p{
    margin:4px 0 0;
    color:#64748b;
    font-size:12px;
}

.top-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    background:rgba(255,255,255,.07);
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
    font-size:18px;
}

/* =========================
   周
========================= */

.week-area{
    max-width:1200px;
    margin:16px auto 0;
    padding:0 16px;
}

.weeks{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:5px;
    scrollbar-width:none;
}

.weeks::-webkit-scrollbar{
    display:none;
}

.week-btn{
    flex:none;
    padding:9px 15px;
    border-radius:12px;
    background:rgba(255,255,255,.055);
    color:#94a3b8;
    border:1px solid rgba(255,255,255,.06);
}

.week-btn.active{
    color:#fff;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    border-color:transparent;
}

.week-btn.today-week{
    box-shadow:inset 0 -2px 0 #38bdf8;
}

/* =========================
   今日
========================= */

.overview{
    max-width:1200px;
    margin:16px auto;
    padding:0 16px;
}

.overview-box{
    padding:18px;
    border-radius:20px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(15px);
}

.overview-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.overview-title{
    font-size:19px;
    font-weight:800;
}

.overview-date{
    color:#64748b;
    font-size:12px;
}

.overview-desc{
    margin-top:6px;
    color:#94a3b8;
    font-size:13px;
}

.today-list{
    display:flex;
    gap:10px;
    margin-top:14px;
    overflow-x:auto;
}

.today-card{
    flex:none;
    min-width:180px;
    padding:13px;
    border-radius:15px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);
}

.today-time{
    color:#60a5fa;
    font-size:11px;
}

.today-name{
    margin-top:5px;
    font-size:14px;
    font-weight:700;
}

.today-room{
    margin-top:7px;
    color:#94a3b8;
    font-size:11px;
}

/* =========================
   课表
========================= */

.schedule-wrapper{
    max-width:1200px;
    margin:auto;
    padding:0 10px;
    overflow-x:auto;
}

.schedule{
    min-width:760px;
}

.days{
    display:grid;
    grid-template-columns:44px repeat(7,1fr);
    gap:4px;
    margin-bottom:4px;
}

.day{
    padding:10px 4px;
    text-align:center;
    border-radius:10px;
    background:rgba(255,255,255,.045);
    color:#94a3b8;
    font-size:12px;
}

.day.today{
    color:#fff;
    background:rgba(37,99,235,.25);
    border:1px solid rgba(59,130,246,.4);
}

.day-date{
    display:block;
    margin-top:3px;
    font-size:10px;
    color:#64748b;
}

.grid{
    position:relative;
    display:grid;
    grid-template-columns:44px repeat(7,1fr);
    grid-template-rows:repeat(12,72px);
    gap:4px;
}

.period{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:rgba(255,255,255,.035);
    color:#64748b;
    font-size:11px;
}

.empty{
    border-radius:10px;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.025);
}

.course{
    position:relative;
    z-index:3;
    margin:2px;
    padding:9px;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.course-name{
    font-size:12px;
    font-weight:800;
    line-height:1.35;
}

.course-teacher{
    margin-top:4px;
    font-size:10px;
    color:rgba(255,255,255,.75);
}

.course-room{
    display:flex;
    gap:3px;
    margin-top:5px;
    font-size:9px;
    color:rgba(255,255,255,.7);
}

.course-period{
    position:absolute;
    right:5px;
    bottom:4px;
    font-size:8px;
    opacity:.65;
}

.course.blue{
    background:linear-gradient(145deg,
    rgba(37,99,235,.72),
    rgba(29,78,216,.48));
}

.course.purple{
    background:linear-gradient(145deg,
    rgba(124,58,237,.72),
    rgba(109,40,217,.48));
}

.course.green{
    background:linear-gradient(145deg,
    rgba(16,185,129,.72),
    rgba(5,150,105,.48));
}

.course.orange{
    background:linear-gradient(145deg,
    rgba(249,115,22,.72),
    rgba(234,88,12,.48));
}

.course.pink{
    background:linear-gradient(145deg,
    rgba(236,72,153,.72),
    rgba(219,39,119,.48));
}

.course.cyan{
    background:linear-gradient(145deg,
    rgba(6,182,212,.72),
    rgba(8,145,178,.48));
}

.no-class{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#64748b;
    pointer-events:none;
}

.no-class-icon{
    font-size:30px;
}

.no-class-title{
    margin-top:6px;
    color:#94a3b8;
    font-weight:700;
}

.no-class-desc{
    margin-top:4px;
    font-size:11px;
}

/* =========================
   弹窗
========================= */

.modal-mask{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:15px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
}

.modal-mask.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:620px;
    max-height:90vh;
    overflow:auto;
    padding:20px;
    border-radius:24px;
    background:#101b2c;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.modal-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.modal-title h2{
    margin:0;
    font-size:19px;
}

.close-btn{
    width:36px;
    height:36px;
    border-radius:10px;
    background:rgba(255,255,255,.07);
    color:#fff;
}

textarea{
    width:100%;
    min-height:280px;
    resize:vertical;
    padding:14px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    background:rgba(0,0,0,.25);
    color:#fff;
    line-height:1.55;
    font-size:13px;
}

textarea:focus{
    border-color:#3b82f6;
}

.modal-tip{
    margin:10px 0;
    color:#64748b;
    font-size:11px;
    line-height:1.7;
}

.import-status{
    display:none;
    margin-top:10px;
    padding:11px 12px;
    border-radius:12px;
    background:rgba(59,130,246,.08);
    border:1px solid rgba(59,130,246,.15);
    color:#93c5fd;
    font-size:12px;
    line-height:1.6;
}

.import-status.show{
    display:block;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.modal-actions button{
    flex:1;
}

/* =========================
   抽屉
========================= */

.drawer-mask{
    position:fixed;
    inset:0;
    z-index:110;
    display:none;
    align-items:flex-end;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(8px);
}

.drawer-mask.show{
    display:flex;
}

.drawer{
    width:100%;
    max-height:85vh;
    overflow:auto;
    padding:24px;
    border-radius:26px 26px 0 0;
    background:#101b2c;
    border-top:1px solid rgba(255,255,255,.1);
}

.drawer h2{
    margin:0;
    font-size:23px;
}

.drawer-sub{
    margin-top:6px;
    color:#94a3b8;
    font-size:13px;
}

.detail-list{
    margin-top:20px;
}

.detail{
    display:flex;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.detail-label{
    width:80px;
    color:#64748b;
    font-size:12px;
}

.detail-value{
    flex:1;
    color:#e2e8f0;
    font-size:13px;
}

/* =========================
   设置
========================= */

.settings-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.setting-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    text-align:left;
    color:#fff;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.06);
}

.setting-btn.danger{
    color:#fca5a5;
}

/* =========================
   手机
========================= */

@media(max-width:600px){

    .import-buttons{
        flex-direction:column;
    }

    .schedule-wrapper{
        padding:0 6px;
    }

    .schedule{
        min-width:720px;
    }

    .grid{
        grid-template-rows:repeat(12,68px);
    }

}
</style>
</head>

<body>

<!-- =========================
     导入页
========================= -->

<div id="importPage">

    <div class="import-box">

        <div class="logo">📚</div>

        <h1>我的课表</h1>

        <p>
            把学校教务系统的课表复制过来，
            自动生成你的专属课表。
        </p>

        <div class="import-buttons">

            <button
                class="primary-btn"
                onclick="openPasteModal()"
            >
                📋 粘贴课表
            </button>

            <button
                class="secondary-btn"
                onclick="document.getElementById('fileInput').click()"
            >
                📄 导入文件
            </button>

        </div>

        <div class="import-tip">
            支持直接复制教务系统“我的课表”。
            程序会优先读取网页表格，
            也支持手机复制后的普通文本。
        </div>

    </div>

</div>

<input
    id="fileInput"
    type="file"
    accept=".txt,.json,.html,.htm"
    style="display:none"
    onchange="handleFileImport(event)"
>

<!-- =========================
     主页面
========================= -->

<div id="mainPage" class="hidden">

    <div class="topbar">

        <div class="topbar-inner">

            <div class="title-area">

                <h1>我的课表</h1>

                <p>
                    2026-2027学年 · 第一学期

            </div>

            <div class="top-actions">

                <button
                    class="icon-btn"

                </button>

            </div>

    </div>

    <div class="overview">

                </div>

                <div

                    class="overview-date"

            </div>

    </div>

    <div class="schedule-wrapper">

        <div class="schedule">

            <div class="days">

                <div></div>

                <div id="day-1" class="day">

                    <span id="date-1" class="day-date"></span>
                </div>

                <div id="day-2" class="day">
                    星期二
                    <span id="date-2" class="day-date"></span>
                </div>

                <div id="day-3" class="day">
                    星期三
                    <span id="date-3" class="day-date"></span>
                </div>

                <div id="day-4" class="day">
                    星期四
                    <span id="date-4" class="day-date"></span>
                </div>

                <div id="day-5" class="day">
                    星期五
                    <span id="date-5" class="day-date"></span>
                </div>

                <div id="day-6" class="day">
                    星期六
                    <span id="date-6" class="day-date"></span>
                </div>

            </div>

            <div id="grid" class="grid"></div>

        </div>

</div>

<!-- =========================
     粘贴
========================= -->

<div
    id="pasteModal"
    class="modal-mask"
    onclick="closePasteByBackground(event)"
>

    <div class="modal">

        <div class="modal-title">

</div>

<!-- =========================
     课程详情
========================= -->

<div

    <div class="drawer">

        <div class="modal-title">

                <h2 id="drawerTitle">课程</h2>

        </div>

        <div class="detail-list">

            <div class="detail">

                <div class="detail-label">
                    上课时间
                </div>

                <div
                    id="drawerPeriod"

                ></div>

            </div>

            <div class="detail">

                <div class="detail-label">
                    上课周次
                </div>

                <div
                    id="drawerWeeks"
                    class="detail-value"
                ></div>

            </div>

            <div class="detail">

                <div class="detail-label">
                    上课地点
                </div>

                <div
                    id="drawerRoom"
                    class="detail-value"
                ></div>

            </div>

            <div class="detail">

                <div class="detail-label">
                    课程代码
                </div>

                <div
                    id="drawerCode"
                    class="detail-value"
                ></div>

            </div>

        </div>

    </div>

</div>

<!-- =========================
     设置
========================= -->

<div
    id="settingsMask"
    class="modal-mask"
    onclick="closeSettingsByBackground(event)"
>

    <div class="modal">

        <div class="modal-title">

            <h2>设置</h2>

            <button
                class="close-btn"
                onclick="closeSettings()"
            >
                ×
            </button>

        </div>

        <div class="settings-list">

            <button
                class="setting-btn"
                onclick="reimport()"
            >
                📋 重新导入课表
            </button>

            <button
                class="setting-btn"
                onclick="exportSchedule()"
            >
                💾 导出课表备份
            </button>

            <button
                class="setting-btn"
                onclick="document.getElementById('backupInput').click()"
            >
                📂 导入课表备份
            </button>

            <button
                class="setting-btn danger"
                onclick="clearSchedule()"
            >
                🗑️ 清空当前课表
            </button>

        </div>

    </div>

</div>

<input
    id="backupInput"
    type="file"
    accept=".json"
    style="display:none"
    onchange="handleBackupImport(event)"
>

<script>
/* =========================================================
   基础
========================================================= */

const STORAGE_KEY = "my_schedule_v7";

const TOTAL_WEEKS = 18;

const semesterStart =
    new Date("2026-09-07T00:00:00");

let selectedWeek = 1;

let courses = [];

let pastedHTML = "";

const dayNames = [
    "",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六",
    "星期日"
];

const colors = [
    "blue",
    "purple",
    "green",
    "orange",
    "pink",
    "cyan"
];

const roomNames = {
    "x1201":"一教201"
};

/* =========================================================
   教室
========================================================= */

function getRoomName(room){

    if(!room){
        return "未设置";
    }

    return roomNames[room] || room;
}

/* =========================================================
   颜色
========================================================= */

function getCourseColor(name){

    let hash = 0;

    for(let i = 0; i < name.length; i++){

        hash =
            name.charCodeAt(i) +
            ((hash << 5) - hash);

    }

    return colors[
        Math.abs(hash) % colors.length
    ];
}

/* =========================================================
   HTML转义
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================================================
   当前周
========================================================= */

function getCurrentWeek(){

    const now = new Date();

    const diff =
        now.getTime() -
        semesterStart.getTime();

    const days =
        Math.floor(diff / 86400000);

    let week =
        Math.floor(days / 7) + 1;

    if(week < 1){
        week = 1;
    }

    if(week > TOTAL_WEEKS){
        week = TOTAL_WEEKS;
    }

    return week;
}

/* =========================================================
   当前星期
========================================================= */

function getCurrentDay(){

    const day =
        new Date().getDay();

    return day === 0 ? 7 : day;
}

/* =========================================================
   日期
========================================================= */

function getDateForDay(day){

    const date =
        new Date(semesterStart);

    date.setDate(
        date.getDate() +
        (selectedWeek - 1) * 7 +
        day - 1
    );

    return (
        `${date.getMonth()+1}/` +
        `${date.getDate()}`
    );
}

/* =========================================================
   周选择
========================================================= */

function createWeeks(){

    const box =
        document.getElementById("weeks");

    box.innerHTML = "";

    const current =
        getCurrentWeek();

    for(let i = 1; i <= TOTAL_WEEKS; i++){

        const btn =
            document.createElement("button");

        btn.className = "week-btn";

        btn.textContent = `第${i}周`;

        if(i === current){
            btn.classList.add("today-week");
        }

        btn.onclick = function(){

            selectedWeek = i;

            render();

            btn.scrollIntoView({
                behavior:"smooth",
                block:"nearest",
                inline:"center"
            });

        };

        box.appendChild(btn);

    }
}

   日期

function renderDates(){

    for(let i = 1; i <= 7; i++){

        const el =
            document.getElementById(
                `date-${i}`
            );

        if(el){

                getDateForDay(i);
        }

}

/* =========================================================
   今日概览
========================================================= */

function renderOverview(){

    const now = new Date();

    const currentWeek =
        getCurrentWeek();

    const currentDay =
        getCurrentDay();

    document.getElementById(
        "overviewDate"
    ).textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

    document.getElementById(
        "overviewTitle"
    ).textContent =
        dayNames[currentDay];

    const today =
        courses
            .filter(c =>
                c.day === currentDay &&
                c.weeks.includes(selectedWeek)
            )
            .sort((a,b) => a.start - b.start);

    const list =
        document.getElementById(
            "todayList"
        );

    list.innerHTML = "";

    const desc =
        document.getElementById(
            "overviewDesc"
        );

    if(today.length === 0){

        desc.textContent =
            selectedWeek === currentWeek
            ? "今天没有课程，好好休息一下"
            : "这一周对应星期没有课程";

        list.style.display = "none";

        return;
    }

    desc.textContent =
        `今天共有 ${today.length} 门课程`;

    list.style.display = "flex";

    today.forEach(course => {

        const item =
            document.createElement("div");

        item.className =
            "today-card";

        item.innerHTML = `
            <div class="today-time">
                第${course.start}-${course.end}节
            </div>

            <div class="today-name">
                ${escapeHTML(course.name)}
            </div>

            <div class="today-room">
                🏫 ${escapeHTML(
                    getRoomName(course.room)
                )}
            </div>
        `;

        item.onclick =
            () => openDrawer(course);

        list.appendChild(item);

    });
}

/* =========================================================
   主课表
========================================================= */

function render(){

    document
        .querySelectorAll(".week-btn")
        .forEach((btn,index) => {

            btn.classList.toggle(
                "active",
                index + 1 === selectedWeek
            );

        });

    renderDates();
    renderOverview();

    const currentWeek =
        getCurrentWeek();

    const currentDay =
        getCurrentDay();

    document
        .querySelectorAll(".day")
        .forEach((day,index) => {

            day.classList.toggle(
                "today",
                selectedWeek === currentWeek &&
                index + 1 === currentDay
            );

        });

    const grid =
        document.getElementById("grid");

    grid.innerHTML = "";

    for(let p = 1; p <= 12; p++){

        const el =
            document.createElement("div");

        el.className = "period";

        el.style.gridColumn = "1";
        el.style.gridRow = p;

        el.innerHTML =
            `<div>${p}</div>`;

        grid.appendChild(el);

    }

    for(let day = 1; day <= 7; day++){

        for(let p = 1; p <= 12; p++){

            const el =
                document.createElement("div");

            el.className = "empty";

            el.style.gridColumn = day + 1;
            el.style.gridRow = p;

            grid.appendChild(el);

        }

    }

    const currentCourses =
        courses.filter(c =>
            c.weeks.includes(selectedWeek)
        );

    currentCourses.forEach(course => {

        const card =
            document.createElement("div");

        card.className =
            "course " +
            (
                course.color ||
                getCourseColor(course.name)
            );

        let start =
            Number(course.start) || 1;

        let end =
            Number(course.end) || start;

        start = Math.max(
            1,
            Math.min(12,start)
        );

        end = Math.max(
            start,
            Math.min(12,end)
        );

        card.style.gridColumn =
            course.day + 1;

        card.style.gridRow =
            `${start} / span ${end-start+1}`;

        card.innerHTML = `
            <div class="course-name">
                ${escapeHTML(course.name)}
            </div>

            <div class="course-teacher">
                ${escapeHTML(
                    course.teacher || "教师未设置"
                )}
            </div>

            <div class="course-room">
                🏫
                ${escapeHTML(
                    getRoomName(course.room)
                )}
            </div>

            <div class="course-period">
                ${start}-${end}节
            </div>
        `;

        card.onclick =
            () => openDrawer(course);

        grid.appendChild(card);

    });

    if(currentCourses.length === 0){

        const el =
            document.createElement("div");

        el.className = "no-class";

        el.innerHTML = `
            <div class="no-class-icon">📚</div>
            <div class="no-class-title">
                本周暂无课程
            </div>
            <div class="no-class-desc">
                当前第${selectedWeek}周没有安排课程
            </div>
        `;

        grid.appendChild(el);
    }
}

/* =========================================================
   ★ HTML表格解析
========================================================= */

function parseScheduleHTML(html){

    const result = [];

    try{

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                html,
                "text/html"
            );

        const tables =
            [...doc.querySelectorAll("table")];

        let table = null;

        for(const candidate of tables){

            const text =
                candidate.innerText ||
                candidate.textContent ||
                "";

            if(
                text.includes("第一节") &&
                text.includes("星期一") &&
                text.includes("星期日")
            ){

                table = candidate;
                break;

            }

        }

        if(!table){
            return result;
        }

        const rows =
            [...table.querySelectorAll("tr")];

        for(const row of rows){

            const cells =
                [...row.children]
                    .filter(el =>
                        el.tagName === "TD" ||
                        el.tagName === "TH"
                    );

            if(cells.length < 2){
                continue;
            }

            const first =
                (
                    cells[0].innerText ||
                    cells[0].textContent ||
                    ""
                ).trim();

            const period =
                getPeriod(first);

            if(!period){
                continue;
            }

            /*
             * 直接按真实表格列：
             *
             * 0 = 节次
             * 1 = 周一
             * ...
             * 7 = 周日
             */

            for(
                let day = 1;
                day <= 7;
                day++
            ){

                const cell =
                    cells[day];

                if(!cell){
                    continue;
                }

                const value =
                    cell.innerText ||
                    cell.textContent ||
                    "";

                parseCoursesFromCell(
                    value,
                    period,
                    day,
                    result
                );

            }

        }

    }catch(error){

        console.error(
            "HTML解析失败:",
            error
        );

    }

    return result;
}

/* =========================================================
   ★ 普通文本解析
========================================================= */

function parseSchoolSchedule(text){

    const result = [];

    let source =
        String(text || "")
            .replace(/\r\n/g,"\n")
            .replace(/\r/g,"\n")
            .replace(/\u00a0/g," ")
            .replace(/（/g,"(")
            .replace(/）/g,")");

    /*
     * 只处理课表部分
     */

    const start =
        source.indexOf("节次/周次");

    if(start >= 0){

        source =
            source.slice(start);

    }

    const endMarkers = [
        "课程列表:",
        "课程列表",
        "实践专周课程列表"
    ];

    let end = -1;

    for(const marker of endMarkers){

        const index =
            source.indexOf(marker);

        if(
            index >= 0 &&
            (
                end < 0 ||
                index < end
            )
        ){

            end = index;

        }

    }

    if(end >= 0){

        source =
            source.slice(0,end);

    }

    /*
     * =====================================================
     * 第一方案：逐行 TAB 表格
     * =====================================================
     */

    const lines =
        source.split("\n");

    for(const raw of lines){

        const parts =
            raw.split("\t");

        if(parts.length < 2){
            continue;
        }

        const period =
            getPeriod(
                parts[0]
            );

        if(!period){
            continue;
        }

        /*
         * 可能存在多余的空列，
         * 但正常复制结果就是：
         *
         * 节次 + 7个星期
         */

        for(
            let day = 1;
            day <= 7;
            day++
        ){

            const cell =
                parts[day] || "";

            parseCoursesFromCell(
                cell,
                period,
                day,
                result
            );

        }

    }

    if(result.length){

        return mergeCourses(result);

    }

    /*
     * =====================================================
     * 第二方案：按第一节～第十二节切块
     * =====================================================
     */

    const periodRegex =
        /第(一|二|三|四|五|六|七|八|九|十|十一|十二)节/g;

    const matches =
        [...source.matchAll(periodRegex)];

    for(
        let i = 0;
        i < matches.length;
        i++
    ){

        const match =
            matches[i];

        const period =
            chinesePeriodNumber(
                match[1]
            );

        if(!period){
            continue;
        }

        const blockStart =
            match.index +
            match[0].length;

        const blockEnd =
            i + 1 < matches.length
            ? matches[i + 1].index
            : source.length;

        const block =
            source.slice(
                blockStart,
                blockEnd
            );

        parsePeriodBlock(
            block,
            period,
            result
        );

    }

    return mergeCourses(result);
}

/* =========================================================
   中文节次
========================================================= */

function chinesePeriodNumber(value){

    const map = {
        "一":1,
        "二":2,
        "三":3,
        "四":4,
        "五":5,
        "六":6,
        "七":7,
        "八":8,
        "九":9,
        "十":10,
        "十一":11,
        "十二":12
    };

    return map[value] || null;
}

/* =========================================================
   节次识别
========================================================= */

function getPeriod(text){

    if(!text){
        return null;
    }

    const value =
        String(text).trim();

    let match =
        value.match(
            /^第(一|二|三|四|五|六|七|八|九|十|十一|十二)节/
        );

    if(match){

        return chinesePeriodNumber(
            match[1]
        );

    }

    match =
        value.match(
            /^第(\d{1,2})节/
        );

    if(match){

        const n =
            Number(match[1]);

        if(
            n >= 1 &&
            n <= 12
        ){

            return n;

        }

    }

    return null;
}

/* =========================================================
   ★ 解析一个节次区域
========================================================= */

function parsePeriodBlock(
    block,
    period,
    result
){

    /*
     * 先尝试 TAB。
     */

    const lines =
        block.split("\n");

    const cells =
        Array.from(
            {length:7},
            () => []
        );

    /*
     * 找到包含多个 TAB 的行。
     */

    let foundTabRow = false;

    for(const raw of lines){

        const parts =
            raw.split("\t");

        if(parts.length >= 7){

            foundTabRow = true;

            for(
                let d = 0;
                d < 7;
                d++
            ){

                if(parts[d + 1]){

                    cells[d].push(
                        parts[d + 1]
                    );

                }

            }

        }

    }

    if(foundTabRow){

        for(
            let d = 0;
            d < 7;
            d++
        ){

            parseCoursesFromCell(
                cells[d].join("\n"),
                period,
                d + 1,
                result
            );

        }

        return;
    }

    /*
     * =====================================================
     * 如果 TAB 不存在：
     *
     * 看是否还有星期一、星期二……
     * =====================================================
     */

    const weekdayRegex =
        /星期([一二三四五六日天])/g;

    const dayMatches =
        [...block.matchAll(weekdayRegex)];

    if(dayMatches.length){

        for(
            let i = 0;
            i < dayMatches.length;
            i++
        ){

            const match =
                dayMatches[i];

            const day =
                weekdayNumber(
                    match[1]
                );

            const start =
                match.index +
                match[0].length;

            const end =
                i + 1 < dayMatches.length
                ? dayMatches[i + 1].index
                : block.length;

            const part =
                block.slice(
                    start,
                    end
                );

            parseCoursesFromCell(
                part,
                period,
                day,
                result
            );

        }

        return;
    }

    /*
     * =====================================================
     * 如果星期名称也被浏览器删除，
     * 这里不能安全猜星期。
     *
     * 不乱分配，避免生成错误课表。
     * =====================================================
     */

}

/* =========================================================
   星期数字
========================================================= */

function weekdayNumber(x){

    const map = {
        "一":1,
        "二":2,
        "三":3,
        "四":4,
        "五":5,
        "六":6,
        "日":7,
        "天":7
    };

    return map[x] || null;
}

/* =========================================================
   ★ 课程解析
========================================================= */

function parseCoursesFromCell(
    cell,
    period,
    day,
    result
){

    if(
        !cell ||
        !period ||
        !day
    ){
        return;
    }

    let text =
        String(cell)
            .replace(/（/g,"(")
            .replace(/）/g,")")
            .replace(/\r/g," ")
            .replace(/\n/g," ")
            .replace(/\t/g," ")
            .replace(/\s+/g," ")
            .trim();

    if(!text){
        return;
    }

    /*
     * 真实格式：
     *
     * 课程名称(课程代码) (教师)
     * (周次,教室)
     *
     * 一个格子可能有多门。
     */

    const regex =
        /([^()]+?)\s*\(([0-9A-Za-z.]+)\)\s*\(([^()]+)\)\s*\(\s*([^()]*)\)/g;

    let match;

    while(
        (match = regex.exec(text))
    ){

        const name =
            cleanCourseName(
                match[1]
            );

        const code =
            match[2].trim();

        const teacher =
            match[3].trim();

        const detail =
            parseDetail(
                match[4]
            );

        if(
            !name ||
            !code ||
            !teacher ||
            !detail ||
            !detail.weeks.length
        ){
            continue;
        }

        addCourse(
            result,
            {
                day:day,
                start:period,
                end:getEndPeriod(period),
                name:name,
                code:code,
                teacher:teacher,
                weeks:detail.weeks,
                room:detail.room
            }
        );

    }
}

/* =========================================================
   课程详情
========================================================= */

function parseDetail(text){

    if(!text){
        return null;
    }

    let value =
        String(text)
            .trim()
            .replace(/，/g,",")
            .replace(/（/g,"(")
            .replace(/）/g,")");

    const comma =
        value.indexOf(",");

    let weekText =
        value;

    let room = "";

    if(comma >= 0){

        weekText =
            value.slice(
                0,
                comma
            ).trim();

        room =
            value.slice(
                comma + 1
            ).trim();

    }

    const weeks =
        parseWeeks(weekText);

    if(!weeks.length){

        return null;

    }

    return {
        weeks:weeks,
        room:room
    };
}

/* =========================================================
   周次
========================================================= */

function parseWeeks(text){

    if(!text){
        return [];
    }

    let value =
        String(text)
            .replace(/第/g,"")
            .replace(/周次/g,"")
            .replace(/周/g,"")
            .replace(/、/g," ")
            .replace(/，/g," ")
            .replace(/,/g," ")
            .replace(/\s+/g," ")
            .trim();

    if(!value){
        return [];
    }

    const set =
        new Set();

    /*
     * 1-16
     */

    const rangeRegex =
        /(\d{1,2})\s*-\s*(\d{1,2})/g;

    let match;

    while(
        (match = rangeRegex.exec(value))
    ){

        let start =
            Number(match[1]);

        let end =
            Number(match[2]);

        if(start > end){

            [start,end] =
                [end,start];

        }

        for(
            let i = start;
            i <= end;
            i++
        ){

            if(
                i >= 1 &&
                i <= TOTAL_WEEKS
            ){

                set.add(i);

            }

        }

    }

    /*
     * 删除范围
     */

    value =
        value.replace(
            rangeRegex,
            " "
        );

    /*
     * 处理：
     *
     * 1 3-8
     *
     * 2
     */

    const singles =
        value.match(
            /\d{1,2}/g
        ) || [];

    singles.forEach(x => {

        const n =
            Number(x);

        if(
            n >= 1 &&
            n <= TOTAL_WEEKS
        ){

            set.add(n);

        }

    });

    return [
        ...set
    ].sort(
        (a,b) => a-b
    );
}

/* =========================================================
   课程结束节次
========================================================= */

function getEndPeriod(start){

    start =
        Number(start) || 1;

    /*
     * 你的课表通常连续两节。
     */

    return start < 12
        ? start + 1
        : 12;
}

/* =========================================================
   课程名称
========================================================= */

function cleanCourseName(name){

    return String(name || "")
        .replace(
            /星期[一二三四五六日天]/g,
            ""
        )
        .replace(/\s+/g," ")
        .trim();
}

/* =========================================================
   添加课程
========================================================= */

function addCourse(result,data){

    if(
        !data.name ||
        !data.weeks ||
        !data.weeks.length
    ){

        return;

    }

    result.push({

        day:Number(data.day),

        start:Number(data.start),

        end:Number(data.end),

        name:data.name,

        code:data.code || "",

        teacher:data.teacher || "",

        weeks:[
            ...data.weeks
        ],

        room:data.room || "",

        color:getCourseColor(
            data.name
        )

    });
}

/* =========================================================
   合并重复课程
========================================================= */

function mergeCourses(list){

    const map =
        new Map();

    list.forEach(course => {

        const key = [
            course.day,
            course.start,
            course.end,
            course.name,
            course.code,
            course.teacher,
            course.room
        ].join("|");

        if(!map.has(key)){

            map.set(
                key,
                {
                    ...course,
                    weeks:[
                        ...course.weeks
                    ]
                }
            );

        }else{

            const old =
                map.get(key);

            old.weeks =
                [
                    ...new Set([
                        ...old.weeks,
                        ...course.weeks
                    ])
                ].sort(
                    (a,b) => a-b
                );

        }

    });

    return [
        ...map.values()
    ];
}

/* =========================================================
   课程详情
========================================================= */

function openDrawer(course){

    document.getElementById(
        "drawerTitle"
    ).textContent =
        course.name;

    document.getElementById(
        "drawerTeacher"
    ).textContent =
        course.teacher || "未设置";

    document.getElementById(
        "drawerPeriod"
    ).textContent =
        `${dayNames[course.day]} · 第${course.start}-${course.end}节`;

    document.getElementById(
        "drawerWeeks"
    ).textContent =
        formatWeeks(course.weeks);

    document.getElementById(
        "drawerRoom"
    ).textContent =
        getRoomName(course.room);

    document.getElementById(
        "drawerCode"
    ).textContent =
        course.code || "未设置";

    document
        .getElementById("drawer")
        .classList.add("show");
}

function closeDrawer(){

    document
        .getElementById("drawer")
        .classList.remove("show");

}

function closeDrawerByBackground(event){

    if(event.target.id === "drawer"){

        closeDrawer();

    }

}

/* =========================================================
   周数显示
========================================================= */

function formatWeeks(weeks){

    if(
        !weeks ||
        !weeks.length
    ){

        return "无";

    }

    const sorted =
        [...weeks].sort(
            (a,b) => a-b
        );

    const result = [];

    let start =
        sorted[0];

    let prev =
        sorted[0];

    for(
        let i = 1;
        i < sorted.length;
        i++
    ){

        const current =
            sorted[i];

        if(
            current === prev + 1
        ){

            prev = current;

        }else{

            result.push(
                start === prev
                ? `${start}周`
                : `${start}-${prev}周`
            );

            start = current;

            prev = current;

        }

    }

    result.push(
        start === prev
        ? `${start}周`
        : `${start}-${prev}周`
    );

    return result.join("、");
}

/* =========================================================
   设置
========================================================= */

function openSettings(){

    document
        .getElementById("settingsMask")
        .classList.add("show");

}

function closeSettings(){

        .getElementById("settingsMask")

}

function closeSettingsByBackground(event){

/* =========================================================
   清空
========================================================= */

function clearSchedule(){

    if(
        !confirm(
            "确定要清空当前课表吗？"
        )
    ){

        return;

    }

    localStorage.removeItem(
        STORAGE_KEY
    );

    localStorage.removeItem(
        "my_schedule_v6"
    );

    localStorage.removeItem(
        "my_schedule_v5"
    );

    localStorage.removeItem(
        "my_schedule_v4"
    );

    localStorage.removeItem(
        "my_schedule_v3"
    );

    courses = [];

    document
        .getElementById("mainPage")
        .classList.add("hidden");

    document
        .getElementById("importPage")
        .classList.remove("hidden");

    closeSettings();
}

/* =========================================================
   导出
========================================================= */

function exportSchedule(){

    if(!courses.length){

        alert(
            "当前没有课表可以导出。"
        );

        return;

    }

    const data = {

        version:7,

        exportedAt:
            new Date().toISOString(),

        courses:courses

    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "我的课表备份.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}

/* =========================================================
   JSON备份
========================================================= */

function handleBackupImport(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(){

            try{

                const data =
                    JSON.parse(
                        reader.result
                    );

                if(
                    !Array.isArray(
                        data.courses
                    )
                ){

                    throw new Error();

                }

                courses =
                    data.courses;

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(courses)
                );

                closeSettings();

                showMainPage();

                alert(
                    `导入成功，共 ${courses.length} 个课程安排。`
                );

            }catch(e){

                alert(
                    "备份文件格式不正确。"
                );

            }

        };

    reader.readAsText(
        file,
        "UTF-8"
    );

    event.target.value = "";
}

/* =========================================================
   普通文件导入
========================================================= */

function handleFileImport(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(){

            const text =
                String(
                    reader.result
                );

            if(
                file.name
                    .toLowerCase()
                    .endsWith(".json")
            ){

                try{

                    const data =
                        JSON.parse(text);

                    if(
                        Array.isArray(
                            data.courses
                        )
                    ){

                        courses =
                            data.courses;

                        localStorage.setItem(
                            STORAGE_KEY,
                            JSON.stringify(courses)
                        );

                        showMainPage();

                        alert(
                            `导入成功，共 ${courses.length} 个课程安排。`
                        );

                        return;

                    }

                }catch(e){

                    alert(
                        "JSON 文件格式不正确。"
                    );

                    return;

                }

            }

            let result = [];

            if(
                file.name
                    .toLowerCase()
                    .endsWith(".html") ||
                file.name
                    .toLowerCase()
                    .endsWith(".htm")
            ){

                result =
                    parseScheduleHTML(
                        text
                    );

            }

            if(!result.length){

                result =
                    parseSchoolSchedule(
                        text
                    );

            }

            if(!result.length){

                alert(
                    "没有识别到课程。"
                );

                return;

            }

            courses =
                mergeCourses(result);

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(courses)
            );

            showMainPage();

            alert(
                `导入成功，共识别 ${courses.length} 个课程安排。`
            );

        };

    reader.readAsText(
        file,
        "UTF-8"
    );

    event.target.value = "";
}

/* =========================================================
   显示主页面
========================================================= */

function showMainPage(){

    document
        .getElementById("importPage")
        .classList.add("hidden");

    document
        .getElementById("mainPage")
        .classList.remove("hidden");

    selectedWeek =
        getCurrentWeek();

    createWeeks();

    render();

    setTimeout(() => {

        const active =
            document.querySelector(
                ".week-btn.active"
            );

        if(active){

            active.scrollIntoView({
                behavior:"auto",
                block:"nearest",
                inline:"center"
            });

        }

    },100);
}

/* =========================================================
   初始化
========================================================= */

function init(){

    /*
     * 使用 v7。
     *
     * 不读取旧 v6，
     * 避免旧版本错误解析结果
     * 继续显示。
     */

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(saved){

        try{

            const data =
                JSON.parse(saved);

            if(
                Array.isArray(data) &&
                data.length
            ){

                courses = data;

                showMainPage();

                return;

            }

        }catch(e){

            localStorage.removeItem(
                STORAGE_KEY
            );

        }

    }

    document
        .getElementById("importPage")
        .classList.remove("hidden");

    document
        .getElementById("mainPage")
        .classList.add("hidden");
}

/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            closeDrawer();

            closePasteModal();

            closeSettings();

        }

    }
);

/* =========================================================
   启动
========================================================= */

init();

</script>
