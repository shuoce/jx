
<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta
    name="theme-color"
    content="#07111f"
>

<title>我的课表</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07111f;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
textarea,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================
   背景
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(40,120,255,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(160,60,255,.14),
            transparent 35%
        );
}


/* =========================
   导入页面
========================= */

#importPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.import-box{
    width:100%;
    max-width:520px;
    padding:32px 24px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;

    background:
        rgba(255,255,255,.055);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 80px rgba(0,0,0,.35);

    text-align:center;
}

.logo{
    width:72px;
    height:72px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #8b5cf6
        );

    font-size:34px;

    box-shadow:
        0 12px 40px rgba(59,130,246,.3);
}

.import-box h1{
    margin:0;
    font-size:28px;
}

.import-box p{
    margin:10px 0 28px;
    color:#94a3b8;
    line-height:1.7;
}

.import-buttons{
    display:flex;
    gap:12px;
}

.import-buttons button{
    flex:1;
}

.primary-btn,
.secondary-btn{
    min-height:50px;
    padding:0 18px;

    border-radius:15px;

    font-weight:700;
    color:#fff;
}

.primary-btn{
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 8px 28px rgba(37,99,235,.25);
}

.primary-btn:disabled{
    opacity:.6;
}

.secondary-btn{
    background:
        rgba(255,255,255,.08);

    border:1px solid
        rgba(255,255,255,.1);
}

.import-tip{
    margin-top:20px;
    padding:14px;

    border-radius:14px;

    background:
        rgba(255,255,255,.035);

    color:#64748b;

    font-size:12px;
    line-height:1.7;
}


/* =========================
   主页面
========================= */

#mainPage{
    min-height:100vh;
    padding-bottom:40px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;

    padding:
        calc(12px + env(safe-area-inset-top))
        16px
        12px;

    background:
        rgba(7,17,31,.82);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.title-area h1{
    margin:0;
    font-size:22px;
}

.title-area p{
    margin:4px 0 0;
    color:#64748b;
    font-size:12px;
}

.top-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;

    border-radius:13px;

    background:
        rgba(255,255,255,.07);

    color:#fff;

    border:1px solid
        rgba(255,255,255,.08);

    font-size:18px;
}


/* =========================
   周选择
========================= */

.week-area{
    max-width:1200px;
    margin:16px auto 0;
    padding:0 16px;
}

.weeks{
    display:flex;
    gap:8px;

    overflow-x:auto;
    padding-bottom:5px;

    scrollbar-width:none;
}

.weeks::-webkit-scrollbar{
    display:none;
}

.week-btn{
    flex:none;

    padding:9px 15px;

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    color:#94a3b8;

    border:1px solid
        rgba(255,255,255,.06);
}

.week-btn.active{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    border-color:transparent;
}

.week-btn.today-week{
    box-shadow:
        inset 0 -2px 0 #38bdf8;
}


/* =========================
   今日概览
========================= */

.overview{
    max-width:1200px;
    margin:16px auto;
    padding:0 16px;
}

.overview-box{
    padding:18px;

    border-radius:20px;

    background:
        rgba(255,255,255,.055);

    border:1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(15px);
}

.overview-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.overview-title{
    font-size:19px;
    font-weight:800;
}

.overview-date{
    color:#64748b;
    font-size:12px;
}

.overview-desc{
    margin-top:6px;
    color:#94a3b8;
    font-size:13px;
}

.today-list{
    display:flex;
    gap:10px;

    margin-top:14px;

    overflow-x:auto;
}

.today-card{
    flex:none;
    min-width:180px;

    padding:13px;

    border-radius:15px;

    background:
        rgba(255,255,255,.05);

    border:1px solid
        rgba(255,255,255,.06);
}

.today-time{
    color:#60a5fa;
    font-size:11px;
}

.today-name{
    margin-top:5px;
    font-size:14px;
    font-weight:700;
}

.today-room{
    margin-top:7px;
    color:#94a3b8;
    font-size:11px;
}


/* =========================
   课表
========================= */

.schedule-wrapper{
    max-width:1200px;
    margin:auto;
    padding:0 10px;

    overflow-x:auto;
}

.schedule{
    min-width:760px;
}

.days{
    display:grid;

    grid-template-columns:
        44px
        repeat(7,1fr);

    gap:4px;

    margin-bottom:4px;
}

.day{
    padding:10px 4px;

    text-align:center;

    border-radius:10px;

    background:
        rgba(255,255,255,.045);

    color:#94a3b8;

    font-size:12px;
}

.day.today{
    color:#fff;

    background:
        rgba(37,99,235,.25);

    border:
        1px solid rgba(59,130,246,.4);
}

.day-date{
    display:block;
    margin-top:3px;
    font-size:10px;
    color:#64748b;
}

.grid{
    position:relative;

    display:grid;

    grid-template-columns:
        44px
        repeat(7,1fr);

    grid-template-rows:
        repeat(12,72px);

    gap:4px;
}

.period{
    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:
        rgba(255,255,255,.035);

    color:#64748b;

    font-size:11px;
}

.period-number{
    opacity:.8;
}

.empty{
    border-radius:10px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid rgba(255,255,255,.025);
}

.course{
    position:relative;
    z-index:3;

    margin:2px;

    padding:9px;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    border:1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 8px 20px rgba(0,0,0,.18);
}

.course-name{
    font-size:12px;
    font-weight:800;
    line-height:1.35;
}

.course-teacher{
    margin-top:4px;
    font-size:10px;
    color:rgba(255,255,255,.75);
}

.course-room{
    display:flex;
    gap:3px;

    margin-top:5px;

    font-size:9px;

    color:rgba(255,255,255,.7);
}

.course-period{
    position:absolute;
    right:5px;
    bottom:4px;

    font-size:8px;
    opacity:.65;
}


/* =========================
   课程颜色
========================= */

.course.blue{
    background:
        linear-gradient(
            145deg,
            rgba(37,99,235,.72),
            rgba(29,78,216,.48)
        );
}

.course.purple{
    background:
        linear-gradient(
            145deg,
            rgba(124,58,237,.72),
            rgba(109,40,217,.48)
        );
}

.course.green{
    background:
        linear-gradient(
            145deg,
            rgba(16,185,129,.72),
            rgba(5,150,105,.48)
        );
}

.course.orange{
    background:
        linear-gradient(
            145deg,
            rgba(249,115,22,.72),
            rgba(234,88,12,.48)
        );
}

.course.pink{
    background:
        linear-gradient(
            145deg,
            rgba(236,72,153,.72),
            rgba(219,39,119,.48)
        );
}

.course.cyan{
    background:
        linear-gradient(
            145deg,
            rgba(6,182,212,.72),
            rgba(8,145,178,.48)
        );
}


/* =========================
   无课程
========================= */

.no-class{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    color:#64748b;

    pointer-events:none;
}

.no-class-icon{
    font-size:30px;
}

.no-class-title{
    margin-top:6px;
    color:#94a3b8;
    font-weight:700;
}

.no-class-desc{
    margin-top:4px;
    font-size:11px;
}


/* =========================
   弹窗
========================= */

.modal-mask{
    position:fixed;
    inset:0;

    z-index:100;

    display:none;

    align-items:flex-end;
    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:blur(8px);
}

.modal-mask.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:620px;

    max-height:90vh;

    overflow:auto;

    padding:20px;

    border-radius:24px;

    background:
        #101b2c;

    border:1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 30px 100px rgba(0,0,0,.5);
}

.modal-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:14px;
}

.modal-title h2{
    margin:0;
    font-size:19px;
}

.close-btn{
    width:36px;
    height:36px;

    border-radius:10px;

    background:
        rgba(255,255,255,.07);

    color:#fff;
}

textarea{
    width:100%;
    min-height:280px;

    resize:vertical;

    padding:14px;

    border-radius:15px;

    border:1px solid
        rgba(255,255,255,.1);

    outline:none;

    background:
        rgba(0,0,0,.25);

    color:#fff;

    line-height:1.55;

    font-size:13px;
}

textarea:focus{
    border-color:#3b82f6;
}

.modal-tip{
    margin:10px 0;

    color:#64748b;

    font-size:11px;

    line-height:1.7;
}

.modal-actions{
    display:flex;
    gap:10px;

    margin-top:12px;
}

.modal-actions button{
    flex:1;
}


/* =========================
   抽屉
========================= */

.drawer-mask{
    position:fixed;
    inset:0;

    z-index:110;

    display:none;

    align-items:flex-end;

    background:
        rgba(0,0,0,.6);

    backdrop-filter:blur(8px);
}

.drawer-mask.show{
    display:flex;
}

.drawer{
    width:100%;
    max-height:85vh;

    overflow:auto;

    padding:24px;

    border-radius:
        26px 26px 0 0;

    background:
        #101b2c;

    border-top:
        1px solid rgba(255,255,255,.1);
}

.drawer h2{
    margin:0;
    font-size:23px;
}

.drawer-sub{
    margin-top:6px;
    color:#94a3b8;
    font-size:13px;
}

.detail-list{
    margin-top:20px;
}

.detail{
    display:flex;

    padding:14px 0;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.detail-label{
    width:80px;
    color:#64748b;
    font-size:12px;
}

.detail-value{
    flex:1;
    color:#e2e8f0;
    font-size:13px;
}


/* =========================
   设置
========================= */

.settings-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.setting-btn{
    width:100%;

    padding:15px;

    border-radius:14px;

    text-align:left;

    color:#fff;

    background:
        rgba(255,255,255,.06);

    border:1px solid
        rgba(255,255,255,.06);
}

.setting-btn.danger{
    color:#fca5a5;
}


/* =========================
   手机
========================= */

@media(max-width:600px){

    .import-buttons{
        flex-direction:column;
    }

    .schedule-wrapper{
        padding:0 6px;
    }

    .schedule{
        min-width:720px;
    }

    .grid{
        grid-template-rows:
            repeat(12,68px);
    }

}

</style>
</head>


<body>


<!-- =====================================================
     导入页面
====================================================== -->

<div id="importPage">

    <div class="import-box">

        <div class="logo">
            📚
        </div>

        <h1>我的课表</h1>

        <p>
            把学校教务系统的课表复制过来，
            自动生成你的专属课表。
        </p>

        <div class="import-buttons">

            <button
                class="primary-btn"
                onclick="openPasteModal()"
            >
                📋 粘贴课表
            </button>

            <button
                class="secondary-btn"
                onclick="document.getElementById('fileInput').click()"
            >
                📄 导入文件
            </button>

        </div>

        <div class="import-tip">

            支持直接粘贴整个教务系统课表页面的文字。
            不需要手动删除“我的账户”“课程列表”等内容。

        </div>

    </div>

</div>


<input
    id="fileInput"
    type="file"
    accept=".txt,.json,.html,.htm"
    style="display:none"
    onchange="handleFileImport(event)"
>


<!-- =====================================================
     主页面
====================================================== -->

<div id="mainPage" class="hidden">


    <div class="topbar">

        <div class="topbar-inner">

            <div class="title-area">

                <h1>我的课表</h1>

                <p>
                    2026-2027学年 · 第一学期
                </p>

            </div>

            <div class="top-actions">

                <button
                    class="icon-btn"
                    onclick="openSettings()"
                >
                    ⚙️
                </button>

            </div>

        </div>

    </div>


    <!-- 周 -->

    <div class="week-area">

        <div
            id="weeks"
            class="weeks"
        ></div>

    </div>


    <!-- 今日 -->

    <div class="overview">

        <div class="overview-box">

            <div class="overview-head">

                <div>

                    <div
                        id="overviewTitle"
                        class="overview-title"
                    >
                        今天
                    </div>

                    <div
                        id="overviewDesc"
                        class="overview-desc"
                    >
                        暂无课程
                    </div>

                </div>

                <div
                    id="overviewDate"
                    class="overview-date"
                ></div>

            </div>

            <div
                id="todayList"
                class="today-list"
            ></div>

        </div>

    </div>


    <!-- 星期 -->

    <div class="schedule-wrapper">

        <div class="schedule">

            <div class="days">

                <div></div>

                <div
                    id="day-1"
                    class="day"
                >
                    星期一
                    <span
                        id="date-1"
                        class="day-date"
                    ></span>
                </div>

                <div
                    id="day-2"
                    class="day"
                >
                    星期二
                    <span
                        id="date-2"
                        class="day-date"
                    ></span>
                </div>

                <div
                    id="day-3"
                    class="day"
                >
                    星期三
                    <span
                        id="date-3"
                        class="day-date"
                    ></span>
                </div>

                <div
                    id="day-4"
                    class="day"
                >
                    星期四
                    <span
                        id="date-4"
                        class="day-date"
                    ></span>
                </div>

                <div
                    id="day-5"
                    class="day"
                >
                    星期五
                    <span
                        id="date-5"
                        class="day-date"
                    ></span>
                </div>

                <div
                    id="day-6"
                    class="day"
                >
                    星期六
                    <span
                        id="date-6"
                        class="day-date"
                    ></span>
                </div>

                <div
                    id="day-7"
                    class="day"
                >
                    星期日
                    <span
                        id="date-7"
                        class="day-date"
                    ></span>
                </div>

            </div>


            <div
                id="grid"
                class="grid"
            ></div>

        </div>

    </div>

</div>


<!-- =====================================================
     粘贴弹窗
====================================================== -->

<div
    id="pasteModal"
    class="modal-mask"
    onclick="closePasteByBackground(event)"
>

    <div class="modal">

        <div class="modal-title">

            <h2>导入我的课表</h2>

            <button
                class="close-btn"
                onclick="closePasteModal()"
            >
                ×
            </button>

        </div>


        <textarea
            id="importText"
            placeholder="把教务系统“我的课表”页面复制过来的全部文字粘贴到这里……"
        ></textarea>


        <div class="modal-tip">

            可以直接粘贴整个页面。<br>

            程序会自动寻找：
            “节次/周次 → 第一节 → …… → 第十二节”，
            其他账户菜单、课程列表等内容会自动忽略。

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closePasteModal()"
            >
                取消
            </button>

            <button
                class="primary-btn"
                onclick="parseAndSave()"
            >
                ✨ 生成我的课表
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     课程详情
====================================================== -->

<div
    id="drawer"
    class="drawer-mask"
    onclick="closeDrawerByBackground(event)"
>

    <div class="drawer">

        <div class="modal-title">

            <div>

                <h2 id="drawerTitle">
                    课程
                </h2>

                <div
                    id="drawerTeacher"
                    class="drawer-sub"
                >
                </div>

            </div>

            <button
                class="close-btn"
                onclick="closeDrawer()"
            >
                ×
            </button>

        </div>


        <div class="detail-list">

            <div class="detail">

                <div class="detail-label">
                    上课时间
                </div>

                <div
                    id="drawerPeriod"
                    class="detail-value"
                >
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    上课周次
                </div>

                <div
                    id="drawerWeeks"
                    class="detail-value"
                >
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    上课地点
                </div>

                <div
                    id="drawerRoom"
                    class="detail-value"
                >
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    课程代码
                </div>

                <div
                    id="drawerCode"
                    class="detail-value"
                >
                </div>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     设置
====================================================== -->

<div
    id="settingsMask"
    class="modal-mask"
    onclick="closeSettingsByBackground(event)"
>

    <div class="modal">

        <div class="modal-title">

            <h2>设置</h2>

            <button
                class="close-btn"
                onclick="closeSettings()"
            >
                ×
            </button>

        </div>


        <div class="settings-list">

            <button
                class="setting-btn"
                onclick="reimport()"
            >
                📋 重新导入课表
            </button>


            <button
                class="setting-btn"
                onclick="exportSchedule()"
            >
                💾 导出课表备份
            </button>


            <button
                class="setting-btn"
                onclick="document.getElementById('backupInput').click()"
            >
                📂 导入课表备份
            </button>


            <button
                class="setting-btn danger"
                onclick="clearSchedule()"
            >
                🗑️ 清空当前课表
            </button>

        </div>

    </div>

</div>


<input
    id="backupInput"
    type="file"
    accept=".json"
    style="display:none"
    onchange="handleBackupImport(event)"
>


<script>

/* =========================================================
   基础
========================================================= */

const STORAGE_KEY = "my_schedule_v5";

const TOTAL_WEEKS = 18;

const semesterStart =
    new Date("2026-09-07T00:00:00");

let selectedWeek = 1;

let courses = [];


const dayNames = [
    "",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六",
    "星期日"
];


const colors = [
    "blue",
    "purple",
    "green",
    "orange",
    "pink",
    "cyan"
];


const roomNames = {

    "x1201":"一教201"

};


/* =========================================================
   教室
========================================================= */

function getRoomName(room){

    if(!room)
        return "未设置";

    return roomNames[room] || room;

}


/* =========================================================
   课程颜色
========================================================= */

function getCourseColor(name){

    let hash = 0;

    for(let i=0;i<name.length;i++){

        hash =
            name.charCodeAt(i) +
            ((hash << 5) - hash);

    }

    return colors[
        Math.abs(hash) % colors.length
    ];

}


/* =========================================================
   HTML 转义
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   当前周
========================================================= */

function getCurrentWeek(){

    const now = new Date();

    const diff =
        now.getTime() -
        semesterStart.getTime();

    const days =
        Math.floor(
            diff /
            86400000
        );

    let week =
        Math.floor(days / 7) + 1;

    if(week < 1)
        week = 1;

    if(week > TOTAL_WEEKS)
        week = TOTAL_WEEKS;

    return week;

}


/* =========================================================
   当前星期
========================================================= */

function getCurrentDay(){

    const day =
        new Date().getDay();

    return day === 0 ? 7 : day;

}


/* =========================================================
   日期
========================================================= */

function getDateForDay(day){

    const date =
        new Date(semesterStart);

    date.setDate(
        date.getDate() +
        (selectedWeek - 1) * 7 +
        day - 1
    );

    return (
        `${date.getMonth()+1}/` +
        `${date.getDate()}`
    );

}


/* =========================================================
   创建周
========================================================= */

function createWeeks(){

    const box =
        document.getElementById("weeks");

    box.innerHTML = "";

    const current =
        getCurrentWeek();

    for(let i=1;i<=TOTAL_WEEKS;i++){

        const btn =
            document.createElement("button");

        btn.className =
            "week-btn";

        btn.textContent =
            `第${i}周`;

        if(i === current){

            btn.classList.add(
                "today-week"
            );

        }

        btn.onclick = function(){

            selectedWeek = i;

            render();

            btn.scrollIntoView({
                behavior:"smooth",
                block:"nearest",
                inline:"center"
            });

        };

        box.appendChild(btn);

    }

}

function render(){

    document
        .querySelectorAll(".week-btn")
        .forEach((btn,index)=>{

            btn.classList.toggle(
                "active",
                index + 1 === selectedWeek
            );

        });


    renderDates();

    renderOverview();


    const currentWeek =
        getCurrentWeek();

    const currentDay =
        getCurrentDay();


    document
        .querySelectorAll(".day")
        .forEach((day,index)=>{

            day.classList.toggle(
                "today",
                selectedWeek === currentWeek &&
                index + 1 === currentDay
            );

        });


    const grid =
        document.getElementById("grid");

    grid.innerHTML = "";


    /* 左边节次 */

    for(let p=1;p<=12;p++){

        const el =
            document.createElement("div");

        el.className =
            "period";

        el.style.gridColumn =
            "1";

        el.style.gridRow =
            p;

        el.innerHTML =
            `<div class="period-number">${p}</div>`;

        grid.appendChild(el);

    }


    /* 背景 */

    for(let day=1;day<=7;day++){

        for(let p=1;p<=12;p++){

            const el =
                document.createElement("div");

            el.className =
                "empty";

            el.style.gridColumn =
                day + 1;

            el.style.gridRow =
                p;

            grid.appendChild(el);

        }

    }


    const currentCourses =
        courses.filter(c =>
            c.weeks.includes(
                selectedWeek
            )
        );


    currentCourses.forEach(course => {

        const card =
            document.createElement("div");

        card.className =
            "course " +
            (
                course.color ||
                getCourseColor(
                    course.name
                )
            );


        let start =
            Number(course.start) || 1;

        let end =
            Number(course.end) || start;


        start =
            Math.max(
                1,
                Math.min(
                    12,
                    start
                )
            );


        end =
            Math.max(
                start,
                Math.min(
                    12,
                    end
                )
            );


        card.style.gridColumn =
            course.day + 1;

        card.style.gridRow =
            `${start} / span ${end-start+1}`;


        card.innerHTML = `

            <div class="course-name">
                ${escapeHTML(course.name)}
            </div>

            <div class="course-teacher">
                ${escapeHTML(
                    course.teacher ||
                    "教师未设置"
                )}
            </div>

            <div class="course-room">
                🏫

                    getRoomName(

            </div>

        card.onclick =

        grid.appendChild(card);

    if(currentCourses.length === 0){

        const el =
            document.createElement("div");

        el.className =

        el.innerHTML = `

            <div class="no-class-icon">
                📚
            </div>

            <div class="no-class-title">
                本周暂无课程
            </div>

            <div class="no-class-desc">
                当前第${selectedWeek}周没有安排课程
            </div>

        grid.appendChild(el);

    }

/* =========================================================
   ★ 学校课表专用解析器
========================================================= */

function parseSchoolSchedule(text){

    const result = [];


    let source =
        String(text)
        .replace(/\r/g,"")
        .replace(/\u00a0/g," ");


    /*
        只取：

        节次/周次

        到

        第十二节

        这一部分。

        后面的课程列表全部不要。
    */

    const startIndex =
        source.indexOf(
            "节次/周次"
        );


    if(startIndex >= 0){

        source =
            source.slice(
                startIndex
            );

    }


    const endMarkers = [
        "课程列表:",
        "课程列表：",
        "实践专周课程列表",
        "实践专周课程列表:"
    ];


    let endIndex = -1;


    endMarkers.forEach(marker => {

        const index =
            source.indexOf(marker);

        if(
            index >= 0 &&
            (endIndex < 0 || index < endIndex)
        ){

            endIndex = index;

        }

    });


    if(endIndex >= 0){

        source =
            source.slice(
                0,
                endIndex
            );

    }


    /*
        最优方式：
        尝试把复制出来的内容按照 TAB
        恢复成真正的七天表格。
    */

    const tabResult =
        parseWithTabs(
            source
        );


    if(tabResult.length > 0){

        return tabResult;

    }


    /*
        如果手机复制时 TAB 消失，
        使用无 TAB 模式。
    */

    return parseWithoutTabs(
        source
    );

}


/* =========================================================
   ★ TAB 表格解析
========================================================= */

function parseWithTabs(text){

    const result = [];

    const lines =
        text.split("\n");


    let currentPeriod = null;

    let periodLines = [];


    function flush(){

        if(
            currentPeriod &&
            periodLines.length
        ){

            parseTabPeriod(
                currentPeriod,
                periodLines,
                result
            );

        }

        periodLines = [];

    }


    for(const raw of lines){

        const line =
            raw.trim();


        const p =
            getPeriod(
                line
            );


        if(p){

            flush();

            currentPeriod = p;

            continue;

        }


        if(currentPeriod){

            periodLines.push(raw);

        }

    }


    flush();


    return result;

}


/* =========================================================
   TAB 单节解析
========================================================= */

function parseTabPeriod(
    period,
    lines,
    result
){

    /*
        复制表格后，
        每一行通常是：

        第一列节次
        星期一
        星期二
        ...
        星期日

        但手机可能把同一个节次
        的内容压到多行。

        所以这里把所有 TAB
        收集起来。
    */

    let cells = [];


    for(const line of lines){

        if(line.includes("\t")){

            const parts =
                line.split("\t");

            cells =
                cells.concat(parts);

        }

    }


    if(cells.length === 0)
        return;


    /*
        去掉表头以前的内容，
        找到“星期一”。
    */

    let header =
        cells.findIndex(
            x => x.includes("星期一")
        );


    if(header >= 0){

        cells =
            cells.slice(
                header + 1
            );

    }


    /*
        现在每7个视为一个星期组。
    */

    for(
        let i=0;
        i<cells.length;
        i++
    ){

        const day =
            (i % 7) + 1;


        const cell =
            cells[i];


        parseCoursesFromCell(
            cell,
            period,
            day,
            result
        );

    }

}


/* =========================================================
   ★ 无 TAB 解析
========================================================= */

function parseWithoutTabs(text){

    const result = [];


    /*
        这里专门针对你发来的这种：

        第一节
        星期一的课程
        星期二的课程
        ...

        但由于聊天复制有可能把
        星期名称直接丢掉，

        所以我们还利用课程代码
        来识别课程。

    */


    const lines =
        text
        .split("\n")
        .map(x=>x.trim())
        .filter(Boolean);


    let period = null;

    let currentDay = null;


    for(let i=0;i<lines.length;i++){

        const line =
            lines[i];


        const p =
            getPeriod(line);


        if(p){

            period = p;

            currentDay = null;

            continue;

        }


        const dayMatch =
            line.match(
                /星期([一二三四五六日天])/
            );


        if(dayMatch){

            currentDay =
                weekdayNumber(
                    dayMatch[1]
                );


            const after =
                line
                .replace(
                    /^.*?星期[一二三四五六日天]/,
                    ""
                );


            if(after.trim()){

                parseCoursesFromCell(
                    after,
                    period,
                    currentDay,
                    result
                );

            }

            continue;

        }


        /*
            如果明确有星期，
            正常解析。
        */

        if(
            period &&
            currentDay
        ){

            parseCoursesFromCell(
                line,
                period,
                currentDay,
                result
            );

        }

    }


    /*
        如果一个都没找到，
        使用“固定七列顺序”
        尝试恢复。
    */

    if(result.length === 0){

        return parseFlattenedTable(
            text
        );

    }


    return result;

}


/* =========================================================
   ★ 扁平化表格恢复
========================================================= */

function parseFlattenedTable(text){

    const result = [];


    /*
        你的学校复制内容在聊天里
        会变成：

        第一节
        课程A
        课程B
        课程C
        ...

        星期信息已经没有了。

        这种情况下，单纯靠文字
        是无法百分百知道空白星期的。

        但是如果原始 clipboard 仍有
        TAB，这个函数不会被使用。

        这里仅做最后兜底。
    */

    const lines =
        text
        .split("\n")
        .map(x=>x.trim())
        .filter(Boolean);


    let period = null;

    let collected = [];


    function flush(){

        if(
            period &&
            collected.length
        ){

            /*
                每一节最多7个星期单元。
            */

            let day = 1;

            for(const text of collected){

                if(day > 7)
                    break;

                const countBefore =
                    result.length;

                parseCoursesFromCell(
                    text,
                    period,
                    day,
                    result
                );


                /*
                    每一行视为一个非空星期格。

                    这是无 TAB 情况下
                    最合理的兜底。
                */

                day++;

            }

        }

        collected = [];

    }


    for(const line of lines){

        const p =
            getPeriod(line);


        if(p){

            flush();

            period = p;

            continue;

        }


        if(
            isCourseLine(line)
        ){

            collected.push(line);

        }

    }


    flush();


    return result;

}


/* =========================================================
   节次识别
========================================================= */

function getPeriod(line){

    if(!line)
        return null;


    const m =
        line.match(
            /^第\s*(一|二|三|四|五|六|七|八|九|十|十一|十二)\s*节/
        );


    if(m){

        return chineseNumber(
            m[1]
        );

    }


    const n =
        line.match(
            /^第?\s*(1[0-2]|[1-9])\s*节/
        );


    if(n){

        return Number(
            n[1]
        );

    }


    return null;

}


/* =========================================================
   星期
========================================================= */

function weekdayNumber(x){

    const map = {
        "一":1,
        "二":2,
        "三":3,
        "四":4,
        "五":5,
        "六":6,
        "日":7,
        "天":7
    };

    return map[x] || null;

}


function chineseNumber(x){

    const map = {
        "一":1,
        "二":2,
        "三":3,
        "四":4,
        "五":5,
        "六":6,
        "七":7,
        "八":8,
        "九":9,
        "十":10,
        "十一":11,
        "十二":12
    };

    return map[x] || null;

}


/* =========================================================
   ★★★ 课程识别 ★★★
========================================================= */

function parseCoursesFromCell(
    cell,
    period,
    day,
    result
){

    if(
        !cell ||
        !period ||
        !day
    )
        return;


    let text =
        String(cell)
        .replace(/\r/g," ")
        .replace(/\n/g," ")
        .replace(/\t/g," ")
        .replace(/\s+/g," ")
        .trim();


    if(!text)
        return;


    /*
        学校真实格式：

        电力电子技术实验
        (0101225S.01)
        (柳杰)
        (9-16,电气传动实训室)

        实际复制后：

        电力电子技术实验(0101225S.01) (柳杰)(9-16,电气传动实训室)

        注意：
        教师后面可能没有空格。
    */


    const regex =
        /([^()]+?)\s*\(([^()]+)\)\s*\(([^()]+)\)\s*\(([^()]*)\)/g;


    let match;

    let found = false;


    while(
        (match = regex.exec(text))
    ){

        found = true;


        const name =
            cleanCourseName(
                match[1]
            );


        const code =
            match[2].trim();


        const teacher =
            match[3].trim();


        const detail =
            parseDetail(
                match[4]
            );


        if(
            !name ||
            !code ||
            !teacher ||
            !detail
        ){

            continue;

        }


        addCourse(
            result,
            {
                day,
                start:period,
                end:getEndPeriod(period),
                name,
                code,
                teacher,
                weeks:detail.weeks,
                room:detail.room
            }
        );

    }


    /*
        防止：

        A课程(...) (...) (...)
        B课程(...) (...) (...)

        两门课程黏在一起时，
        正则无法从第一门后面正确继续。

        上面的全局 g 本身已经可以处理，
        这里再做一次校验。
    */

    if(found)
        return;


    /*
        备用：

        课程(代码)(教师)(详情)

        允许中文括号和英文括号混用。
    */

    const normalized =
        text
        .replace(/（/g,"(")
        .replace(/）/g,")");


    const regex2 =
        /([^()]+?)\s*\(([^()]+)\)\s*\(([^()]+)\)\s*\(([^()]*)\)/g;


    while(
        (match = regex2.exec(normalized))
    ){

        const name =
            cleanCourseName(
                match[1]
            );


        const code =
            match[2].trim();


        const teacher =
            match[3].trim();


        const detail =
            parseDetail(
                match[4]
            );


        if(
            !name ||
            !code ||
            !teacher ||
            !detail
        )
            continue;


        addCourse(
            result,
            {
                day,
                start:period,
                end:getEndPeriod(period),
                name,
                code,
                teacher,
                weeks:detail.weeks,
                room:detail.room
            }
        );

    }

}


/* =========================================================
   默认两节连堂
========================================================= */

function getEndPeriod(start){

    start =
        Number(start) || 1;

    return start < 12
        ? start + 1
        : 12;

}


/* =========================================================
   课程名清理
========================================================= */

function cleanCourseName(name){

    return String(name || "")
        .replace(/星期[一二三四五六日天]/g,"")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   判断课程行
========================================================= */

function isCourseLine(text){

    return (
        /\([A-Za-z0-9.]+\)/.test(text) &&
        /\([^()]+\)/.test(text)
    );

}


/* =========================================================
   ★ 周次+教室
========================================================= */

function parseDetail(text){

    if(!text)
        return null;


    let value =
        String(text)
        .trim()
        .replace(/，/g,",")
        .replace(/（/g,"(")
        .replace(/）/g,")");


    /*
        例如：

        9-16,电气传动实训室

        1-8,x2213

        18,可编程控制器实训室

        1 3-8,x1101
    */


    const comma =
        value.indexOf(",");


    let weekText = value;

    let room = "";


    if(comma >= 0){

        weekText =
            value
            .slice(
                0,
                comma
            )
            .trim();


        room =
            value
            .slice(
                comma + 1
            )
            .trim();

    }


    const weeks =
        parseWeeks(
            weekText
        );


    if(
        weeks.length === 0
    ){

        return null;

    }


    return {
        weeks,
        room
    };

}


/* =========================================================
   周数
========================================================= */

function parseWeeks(text){

    if(!text)
        return [];


    let value =
        String(text)
        .replace(/第/g,"")
        .replace(/周/g,"")
        .replace(/周次/g,"")
        .replace(/、/g," ")
        .replace(/，/g," ")
        .replace(/,/g," ")
        .replace(/\s+/g," ")
        .trim();


    if(!value)
        return [];


    const set =
        new Set();


    /*
        范围：

        1-8
        9-16
        3-8
    */

    const rangeRegex =
        /(\d{1,2})\s*-\s*(\d{1,2})/g;


    let match;


    while(
        (match =
            rangeRegex.exec(value))
    ){

        let start =
            Number(match[1]);

        let end =
            Number(match[2]);


        if(start > end){

            const temp = start;

            start = end;

            end = temp;

        }


        for(
            let i=start;
            i<=end;
            i++
        ){

            if(
                i>=1 &&
                i<=TOTAL_WEEKS
            ){

                set.add(i);

            }

        }

    }


    /*
        删除已经处理的范围。
    */

    value =
        value.replace(
            rangeRegex,
            " "
        );


    /*
        单周：

        18

        或：

        1 3-8

        删除范围后剩下1。
    */

    const singles =
        value.match(
            /\d{1,2}/g
        ) || [];


    singles.forEach(x => {

        const n =
            Number(x);

        if(
            n>=1 &&
            n<=TOTAL_WEEKS
        ){

            set.add(n);

        }

    });


    return [
        ...set
    ].sort(
        (a,b)=>a-b
    );

}


/* =========================================================
   添加课程
========================================================= */

function addCourse(
    result,
    data
){

    if(
        !data.name ||
        !data.weeks ||
        !data.weeks.length
    )
        return;


    result.push({

        day:Number(data.day),

        start:Number(data.start),

        end:Number(data.end),

        name:data.name,

        code:data.code || "",

        teacher:data.teacher || "",

        weeks:[
            ...data.weeks
        ],

        room:data.room || "",

        color:getCourseColor(
            data.name
        )

    });

}


/* =========================================================
   合并重复
========================================================= */

function mergeCourses(list){

    const map =
        new Map();


    list.forEach(course => {

        const key =
            [
                course.day,
                course.start,
                course.end,
                course.name,
                course.teacher,
                course.room
            ].join("|");


        if(!map.has(key)){

            map.set(
                key,
                {
                    ...course,
                    weeks:[
                        ...course.weeks
                    ]
                }
            );

        }else{

            const old =
                map.get(key);


            old.weeks =
                [
                    ...new Set([
                        ...old.weeks,
                        ...course.weeks
                    ])
                ].sort(
                    (a,b)=>a-b
                );

        }

    });


    return [
        ...map.values()
    ];

}

/* =========================================================
   周数显示
========================================================= */

function formatWeeks(weeks){

    if(
        !weeks ||
        !weeks.length
    )
        return "无";


    const sorted =
        [...weeks].sort(
            (a,b)=>a-b
        );


    const result = [];


    let start =
        sorted[0];

    let prev =
        sorted[0];


    for(
        let i=1;
        i<sorted.length;
        i++
    ){

        const current =
            sorted[i];


        if(
            current === prev + 1
        ){

            prev = current;

        }else{

            result.push(
                start === prev
                ? `${start}周`
                : `${start}-${prev}周`
            );

            start = current;

            prev = current;

        }

    }


    result.push(
        start === prev
        ? `${start}周`
        : `${start}-${prev}周`
    );


    return result.join("、");

}

/* =========================================================
   导出
========================================================= */

function exportSchedule(){

    if(!courses.length){

        alert(
            "当前没有课表可以导出。"
        );

        return;

    }


    const data = {

        version:5,

        exportedAt:
            new Date().toISOString(),

        courses

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "我的课表备份.json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);

}


/* =========================================================
   导入 JSON
========================================================= */

function handleBackupImport(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(){

            try{

                const data =
                    JSON.parse(
                        reader.result
                    );


                if(
                    !Array.isArray(
                        data.courses
                    )
                ){

                    throw new Error();

                }


                courses =
                    data.courses;


                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        courses
                    )
                );


                closeSettings();

                showMainPage();


                alert(
                    `导入成功，共 ${courses.length} 个课程安排。`
                );


            }catch(e){

                alert(
                    "备份文件格式不正确。"
                );

            }

        };


    reader.readAsText(
        file,
        "UTF-8"
    );


    event.target.value = "";

}


/* =========================================================
   文件导入
========================================================= */

function handleFileImport(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(){

            const text =
                String(
                    reader.result
                );


            if(
                file.name
                .toLowerCase()
                .endsWith(".json")
            ){

                try{

                    const data =
                        JSON.parse(text);


                    if(
                        Array.isArray(
                            data.courses
                        )
                    ){

                        courses =
                            data.courses;


                        localStorage.setItem(
                            STORAGE_KEY,
                            JSON.stringify(
                                courses
                            )
                        );


                        showMainPage();

                        alert(
                            `导入成功，共 ${courses.length} 个课程安排。`
                        );

                        return;

                    }

                }catch(e){

                    alert(
                        "JSON 文件格式不正确。"
                    );

                    return;

                }

            }


            const result =
                parseSchoolSchedule(
                    text
                );


            if(!result.length){

                alert(
                    "没有识别到课程。"
                );

                return;

            }


            courses =
                mergeCourses(result);


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    courses
                )
            );


            showMainPage();


            alert(
                `导入成功，共识别 ${courses.length} 个课程安排。`
            );

        };


    reader.readAsText(
        file,
        "UTF-8"
    );


    event.target.value = "";

}


/* =========================================================
   显示主页面
========================================================= */

function showMainPage(){

    document
        .getElementById("importPage")
        .classList.add("hidden");


    document
        .getElementById("mainPage")
        .classList.remove("hidden");


    selectedWeek =
        getCurrentWeek();


    createWeeks();

    render();


    setTimeout(()=>{

        const active =
            document.querySelector(
                ".week-btn.active"
            );


        if(active){

            active.scrollIntoView({
                behavior:"auto",
                block:"nearest",
                inline:"center"
            });

        }

    },100);

}


/* =========================================================
   初始化
========================================================= */

function init(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(saved){

        try{

            const data =
                JSON.parse(saved);


            if(
                Array.isArray(data) &&
                data.length
            ){

                courses = data;

                showMainPage();

                return;

            }

        }catch(e){

            localStorage.removeItem(
                STORAGE_KEY
            );

        }

    }


    document
        .getElementById("importPage")
        .classList.remove("hidden");


    document
        .getElementById("mainPage")
        .classList.add("hidden");

}

document.addEventListener(

    function(e){

        if(e.key === "Escape"){

            closeDrawer();

            closePasteModal();

            closeSettings();

        }

    }
);


/* =========================================================
   启动
========================================================= */

init();
