
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<meta name="description" content="我的课表 · 手机课表">
<title>我的课表</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:
        radial-gradient(circle at 20% 0%,rgba(45,125,255,.16),transparent 35%),
        radial-gradient(circle at 100% 20%,rgba(150,70,255,.12),transparent 35%),
        #07111f;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
textarea,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =====================================================
   页面
===================================================== */

.page{
    width:100%;
    min-height:100vh;
}

.container{
    width:min(1200px,100%);
    margin:auto;
    padding:18px 12px 40px;
}

/* =====================================================
   导入页面
===================================================== */

.import-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.import-box{
    width:min(560px,100%);
    padding:34px 24px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:28px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
    text-align:center;
}

.import-icon{
    width:76px;
    height:76px;
    margin:0 auto 18px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:linear-gradient(
        135deg,
        rgba(60,140,255,.3),
        rgba(130,70,255,.25)
    );
}

.import-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:10px;
}

.import-desc{
    color:#aebbd0;
    line-height:1.7;
    font-size:14px;
    margin-bottom:26px;
}

.import-buttons{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    border:0;
    border-radius:14px;
    padding:13px 20px;
    color:#fff;
    transition:.2s;
}

.primary-btn{
    background:linear-gradient(
        135deg,
        #287cff,
        #745cff
    );
    box-shadow:0 10px 30px rgba(55,110,255,.25);
}

.secondary-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
}

.primary-btn:active,
.secondary-btn:active{
    transform:scale(.97);
}

.primary-btn:disabled{
    opacity:.6;
}

/* =====================================================
   顶部
===================================================== */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.title-wrap{
    min-width:0;
}

.title{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.5px;
}

.subtitle{
    color:#8e9db3;
    font-size:12px;
    margin-top:4px;
}

.settings-btn{
    width:42px;
    height:42px;
    flex:none;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.06);
    color:#fff;
    font-size:20px;
}

/* =====================================================
   周选择
===================================================== */

.week-box{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:4px 1px 10px;
    scrollbar-width:none;
}

.week-box::-webkit-scrollbar{
    display:none;
}

.week-btn{
    flex:none;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#9dacbf;
    border-radius:12px;
    padding:9px 13px;
    font-size:13px;
}

.week-btn.active{
    color:#fff;
    background:linear-gradient(
        135deg,
        #287cff,
        #745cff
    );
    border-color:transparent;
}

.week-btn.today-week{
    box-shadow:inset 0 -2px 0 rgba(255,255,255,.8);
}

/* =====================================================
   今日概览
===================================================== */

.overview{
    margin:4px 0 14px;
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.overview-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.overview-title{
    font-size:20px;
    font-weight:750;
}

.overview-desc{
    color:#8e9db3;
    font-size:13px;
    margin-top:5px;
}

.overview-date{
    color:#8998ad;
    font-size:12px;
    white-space:nowrap;
}

.today-list{
    display:flex;
    gap:9px;
    overflow-x:auto;
    margin-top:14px;
    padding-bottom:2px;
    scrollbar-width:none;
}

.today-list::-webkit-scrollbar{
    display:none;
}

.today-card{
    min-width:185px;
    padding:12px;
    border-radius:15px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
}

.today-time{
    color:#82a9ff;
    font-size:11px;
    margin-bottom:5px;
}

.today-name{
    font-size:14px;
    font-weight:700;
    line-height:1.4;
}

.today-room{
    margin-top:6px;
    color:#9baabd;
    font-size:11px;
}

/* =====================================================
   课表
===================================================== */

.schedule-wrap{
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:thin;
}

.schedule{
    min-width:850px;
}

.days{
    display:grid;
    grid-template-columns:55px repeat(7,1fr);
    gap:4px;
    margin-bottom:5px;
}

.day{
    min-height:54px;
    border-radius:13px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.day-name{
    font-size:12px;
    color:#a7b4c7;
}

.day-date{
    margin-top:4px;
    font-size:11px;
    color:#6f7e92;
}

.day.today{
    background:rgba(50,120,255,.13);
    border-color:rgba(70,140,255,.4);
}

.day.today .day-name{
    color:#8bb4ff;
}

.grid{
    position:relative;
    display:grid;
    grid-template-columns:55px repeat(7,1fr);
    grid-template-rows:repeat(12,74px);
    gap:4px;
}

.period{
    border-radius:10px;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.04);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:9px;
}

.period-number{
    width:24px;
    height:24px;
    border-radius:8px;
    background:rgba(255,255,255,.06);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#75859a;
    font-size:11px;
}

.empty{
    border-radius:10px;
    background:rgba(255,255,255,.018);
    border:1px solid rgba(255,255,255,.035);
}

.course{
    position:relative;
    z-index:3;
    margin:2px;
    padding:9px;
    border-radius:11px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 7px 20px rgba(0,0,0,.16);
    border:1px solid rgba(255,255,255,.08);
}

.course-name{
    font-size:12px;
    font-weight:750;
    line-height:1.35;
}

.course-teacher{
    margin-top:4px;
    font-size:10px;
    color:rgba(255,255,255,.72);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.course-room{
    display:flex;
    gap:3px;
    margin-top:5px;
    font-size:9px;
    color:rgba(255,255,255,.68);
    white-space:nowrap;
    overflow:hidden;
}

.course-room span:last-child{
    overflow:hidden;
    text-overflow:ellipsis;
}

.course-period{
    position:absolute;
    right:6px;
    bottom:5px;
    font-size:8px;
    color:rgba(255,255,255,.55);
}

/* 课程颜色 */

.course.blue{
    background:linear-gradient(
        145deg,
        rgba(40,124,255,.8),
        rgba(38,91,190,.72)
    );
}

.course.purple{
    background:linear-gradient(
        145deg,
        rgba(126,83,255,.82),
        rgba(87,58,180,.72)
    );
}

.course.green{
    background:linear-gradient(
        145deg,
        rgba(20,170,120,.78),
        rgba(19,115,92,.72)
    );
}

.course.orange{
    background:linear-gradient(
        145deg,
        rgba(240,135,43,.84),
        rgba(178,88,28,.72)
    );
}

.course.pink{
    background:linear-gradient(
        145deg,
        rgba(231,78,139,.8),
        rgba(157,48,91,.72)
    );
}

.course.cyan{
    background:linear-gradient(
        145deg,
        rgba(28,177,202,.8),
        rgba(20,115,143,.72)
    );
}

.no-class{
    position:absolute;
    left:55px;
    right:0;
    top:90px;
    text-align:center;
    color:#8492a6;
    pointer-events:none;
}

.no-class-icon{
    font-size:30px;
    margin-bottom:8px;
}

.no-class-title{
    color:#a8b5c8;
    font-size:14px;
}

.no-class-desc{
    margin-top:4px;
    font-size:11px;
}

/* =====================================================
   弹窗
===================================================== */

.modal-mask{
    position:fixed;
    z-index:100;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

.modal-mask.show{
    display:flex;
}

.modal{
    width:min(620px,100%);
    max-height:90vh;
    overflow:auto;
    padding:20px;
    border-radius:24px;
    background:#0d1a2c;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.modal-title{
    font-size:18px;
    font-weight:750;
}

.close-btn{
    width:36px;
    height:36px;
    border:0;
    border-radius:11px;
    background:rgba(255,255,255,.07);
    color:#fff;
    font-size:20px;
}

#importText{
    width:100%;
    min-height:260px;
    resize:vertical;
    border:1px solid rgba(255,255,255,.09);
    border-radius:16px;
    padding:14px;
    background:rgba(0,0,0,.2);
    color:#e9f0fa;
    outline:none;
    line-height:1.55;
    font-size:13px;
}

#importText:focus{
    border-color:rgba(72,135,255,.55);
}

.modal-tip{
    margin:10px 0 14px;
    color:#7f90a7;
    font-size:11px;
    line-height:1.6;
}

.modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

/* =====================================================
   抽屉
===================================================== */

.drawer{
    position:fixed;
    z-index:110;
    inset:0;
    display:none;
    justify-content:flex-end;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(5px);
}

.drawer.show{
    display:flex;
}

.drawer-panel{
    width:min(430px,100%);
    height:100%;
    overflow:auto;
    background:#0d1a2c;
    border-left:1px solid rgba(255,255,255,.08);
    padding:24px 20px;
    animation:drawerIn .22s ease;
}

@keyframes drawerIn{
    from{
        transform:translateX(100%);
    }
    to{
        transform:translateX(0);
    }
}

.drawer-title{
    font-size:24px;
    font-weight:800;
    line-height:1.35;
    padding-right:35px;
}

.drawer-close{
    position:absolute;
    right:15px;
    top:15px;
}

.detail-list{
    margin-top:25px;
}

.detail-item{
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.detail-label{
    color:#718197;
    font-size:11px;
    margin-bottom:5px;
}

.detail-value{
    color:#dce5f2;
    font-size:14px;
    line-height:1.5;
}

/* =====================================================
   设置
===================================================== */

.settings-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.setting-btn{
    width:100%;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.045);
    color:#fff;
    border-radius:15px;
    padding:15px;
    text-align:left;
}

.setting-btn.danger{
    color:#ff899d;
}

@media(max-width:600px){

    .container{
        padding:13px 9px 30px;
    }

    .title{
        font-size:23px;
    }

    .overview{
        padding:15px;
    }

    .import-box{
        padding:28px 18px;
    }

    .import-title{
        font-size:26px;
    }

}
</style>
</head>

<body>

<!-- =====================================================
     导入页面
===================================================== -->

<section id="importPage" class="page import-page hidden">

    <div class="import-box">

        <div class="import-icon">
            📚
        </div>

        <div class="import-title">
            我的课表
        </div>

        <div class="import-desc">
            第一次使用，请导入你的学校课表。<br>
            支持直接复制教务系统“全部教学周”课表。
        </div>

        <div class="import-buttons">

            <button
                class="primary-btn"
                onclick="openPasteModal()"
            >
                📋 粘贴课表
            </button>

            <button
                class="secondary-btn"
                onclick="document.getElementById('fileInput').click()"
            >
                📂 导入文件
            </button>

        </div>

        <input
            id="fileInput"
            type="file"
            accept=".txt,.json"
            style="display:none"
            onchange="handleFileImport(event)"
        >

    </div>

</section>


<!-- =====================================================
     主页面
===================================================== -->

<section id="mainPage" class="page hidden">

    <div class="container">

        <header class="header">

            <div class="title-wrap">

                <div class="title">
                    我的课表
                </div>

                <div class="subtitle">
                    2026-2027学年第一学期
                </div>

            </div>

            <button
                class="settings-btn"
                onclick="openSettings()"
            >
                ⚙️
            </button>

        </header>


        <!-- 周 -->

        <div
            id="weeks"
            class="week-box"
        ></div>


        <!-- 今日概览 -->

        <section class="overview">

            <div class="overview-top">

                <div>

                    <div
                        id="overviewTitle"
                        class="overview-title"
                    >
                        星期一
                    </div>

                    <div
                        id="overviewDesc"
                        class="overview-desc"
                    >
                        今天没有课程
                    </div>

                </div>

                <div
                    id="overviewDate"
                    class="overview-date"
                ></div>

            </div>

            <div
                id="todayList"
                class="today-list"
            ></div>

        </section>


        <!-- 课表 -->

        <div class="schedule-wrap">

            <div class="schedule">

                <div class="days">

                    <div></div>

                    <div
                        id="day-1"
                        class="day"
                    >
                        <div class="day-name">
                            星期一
                        </div>
                        <div
                            id="date-1"
                            class="day-date"
                        ></div>
                    </div>

                    <div
                        id="day-2"
                        class="day"
                    >
                        <div class="day-name">
                            星期二
                        </div>
                        <div
                            id="date-2"
                            class="day-date"
                        ></div>
                    </div>

                    <div
                        id="day-3"
                        class="day"
                    >
                        <div class="day-name">
                            星期三
                        </div>
                        <div
                            id="date-3"
                            class="day-date"
                        ></div>
                    </div>

                    <div
                        id="day-4"
                        class="day"
                    >
                        <div class="day-name">
                            星期四
                        </div>
                        <div
                            id="date-4"
                            class="day-date"
                        ></div>
                    </div>

                    <div
                        id="day-5"
                        class="day"
                    >
                        <div class="day-name">
                            星期五
                        </div>
                        <div
                            id="date-5"
                            class="day-date"
                        ></div>
                    </div>

                    <div
                        id="day-6"
                        class="day"
                    >
                        <div class="day-name">
                            星期六
                        </div>
                        <div
                            id="date-6"
                            class="day-date"
                        ></div>
                    </div>

                    <div
                        id="day-7"
                        class="day"
                    >
                        <div class="day-name">
                            星期日
                        </div>
                        <div
                            id="date-7"
                            class="day-date"
                        ></div>
                    </div>

                </div>


                <div
                    id="grid"
                    class="grid"
                ></div>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     粘贴弹窗
===================================================== -->

<div
    id="pasteModal"
    class="modal-mask"
    onclick="closePasteByBackground(event)"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                📋 粘贴你的课表
            </div>

            <button
                class="close-btn"
                onclick="closePasteModal()"
            >
                ×
            </button>

        </div>

        <textarea
            id="importText"
            placeholder="请从学校教务系统复制课表内容，然后粘贴到这里……"
        ></textarea>

        <div class="modal-tip">
            建议在教务系统选择“学生课表 → 全部教学周”，
            然后复制课表表格。<br>
            系统会自动识别星期、课程、教师、周次和教室。
        </div>

        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closePasteModal()"
            >
                取消
            </button>

            <button
                class="primary-btn"
                onclick="parseAndSave()"
            >
                ✨ 生成我的课表
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     课程详情
===================================================== -->

<div
    id="drawer"
    class="drawer"
    onclick="closeDrawerByBackground(event)"
>

    <div class="drawer-panel">

        <button
            class="close-btn drawer-close"
            onclick="closeDrawer()"
        >
            ×
        </button>

        <div
            id="drawerTitle"
            class="drawer-title"
        >
            课程
        </div>

        <div class="detail-list">

            <div class="detail-item">

                <div class="detail-label">
                    教师
                </div>

                <div
                    id="drawerTeacher"
                    class="detail-value"
                ></div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    时间
                </div>

                <div
                    id="drawerPeriod"
                    class="detail-value"
                ></div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    上课周次
                </div>

                <div
                    id="drawerWeeks"
                    class="detail-value"
                ></div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    教室
                </div>

                <div
                    id="drawerRoom"
                    class="detail-value"
                ></div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    课程代码
                </div>

                <div
                    id="drawerCode"
                    class="detail-value"
                ></div>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     设置
===================================================== -->

<div
    id="settingsMask"
    class="modal-mask"
    onclick="closeSettingsByBackground(event)"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                ⚙️ 课表设置
            </div>

            <button
                class="close-btn"
                onclick="closeSettings()"
            >
                ×
            </button>

        </div>

        <div class="settings-list">

            <button
                class="setting-btn"
                onclick="reimport()"
            >
                📋 重新导入课表
            </button>

            <button
                class="setting-btn"
                onclick="exportSchedule()"
            >
                💾 导出课表备份
            </button>

            <button
                class="setting-btn"
                onclick="document.getElementById('backupInput').click()"
            >
                📂 恢复课表备份
            </button>

            <button
                class="setting-btn danger"
                onclick="clearSchedule()"
            >
                🗑️ 清空当前课表
            </button>

        </div>

        <input
            id="backupInput"
            type="file"
            accept=".json"
            style="display:none"
            onchange="handleBackupImport(event)"
        >

    </div>

</div>


<script>
/* =========================================================
   全局
========================================================= */

const STORAGE_KEY = "my_schedule_v4";
const TOTAL_WEEKS = 18;

const semesterStart =
    new Date("2026-09-07T00:00:00");

let selectedWeek = 1;
let courses = [];


/* =========================================================
   星期
========================================================= */

const dayNames = [
    "",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六",
    "星期日"
];


/* =========================================================
   教室
========================================================= */

const roomNames = {
    "x1201":"一教201"
};

function getRoomName(room){

    if(!room)
        return "未设置";

    return roomNames[room] || room;

}


/* =========================================================
   颜色
========================================================= */

const colors = [
    "blue",
    "purple",
    "green",
    "orange",
    "pink",
    "cyan"
];

function getCourseColor(name){

    let hash = 0;

    name = String(name || "");

    for(let i=0;i<name.length;i++){

        hash =
            name.charCodeAt(i) +
            ((hash << 5) - hash);

    }

    return colors[
        Math.abs(hash) % colors.length
    ];

}


/* =========================================================
   当前周
========================================================= */

function getCurrentWeek(){

    const now = new Date();

    const diff =
        now.getTime() -
        semesterStart.getTime();

    const days =
        Math.floor(
            diff / 86400000
        );

    let week =
        Math.floor(days / 7) + 1;

    if(week < 1)
        week = 1;

    if(week > TOTAL_WEEKS)
        week = TOTAL_WEEKS;

    return week;

}


/* =========================================================
   当前星期
========================================================= */

function getCurrentDay(){

    let day =
        new Date().getDay();

    return day === 0 ? 7 : day;

}


/* =========================================================
   日期
========================================================= */

function getDateForDay(day){

    const date =
        new Date(semesterStart);

    date.setDate(
        date.getDate() +
        (selectedWeek - 1) * 7 +
        (day - 1)
    );

    return `${date.getMonth()+1}/${date.getDate()}`;

}

function getFullDate(date){

    return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`;

}


/* =========================================================
   创建周
========================================================= */

function createWeeks(){

    const box =
        document.getElementById("weeks");

    box.innerHTML = "";

    const currentWeek =
        getCurrentWeek();

    for(let i=1;i<=TOTAL_WEEKS;i++){

        const button =
            document.createElement("button");

        button.className = "week-btn";
        button.textContent = `第${i}周`;

        if(i === currentWeek)
            button.classList.add("today-week");

        button.onclick = function(){

            selectedWeek = i;

            render();

            button.scrollIntoView({
                behavior:"smooth",
                block:"nearest",
                inline:"center"
            });

        };

        box.appendChild(button);

    }

}


/* =========================================================
   日期
========================================================= */

function renderDates(){

    for(let day=1;day<=7;day++){

        const el =
            document.getElementById(`date-${day}`);

        if(el)
            el.textContent =
                getDateForDay(day);

    }

}


/* =========================================================
   今日概览
========================================================= */

function renderOverview(){

    const now = new Date();

    const currentWeek =
        getCurrentWeek();

    const currentDay =
        getCurrentDay();

    document.getElementById(
        "overviewDate"
    ).textContent =
        getFullDate(now);

    document.getElementById(
        "overviewWeek"
    )?.remove();

    document.getElementById(
        "overviewTitle"
    ).textContent =
        dayNames[currentDay];

    const todayCourses =
        courses
        .filter(course =>
            Array.isArray(course.weeks) &&
            course.weeks.includes(selectedWeek) &&
            Number(course.day) === currentDay
        )
        .sort(
            (a,b) =>
                Number(a.start) -
                Number(b.start)
        );

    const list =
        document.getElementById("todayList");

    list.innerHTML = "";

    if(todayCourses.length === 0){

        document.getElementById(
            "overviewDesc"
        ).textContent =
            selectedWeek === currentWeek
            ? "今天没有课程，好好休息一下"
            : "这一周对应星期没有课程";

        list.style.display = "none";

        return;

    }

    document.getElementById(
        "overviewDesc"
    ).textContent =
        `今天共有 ${todayCourses.length} 门课程`;

    list.style.display = "flex";

    todayCourses.forEach(course => {

        const item =
            document.createElement("div");

        item.className = "today-card";

        item.innerHTML = `
            <div class="today-time">
                第${course.start}-${course.end}节
            </div>

            <div class="today-name">
                ${escapeHTML(course.name)}
            </div>

            <div class="today-room">
                🏫 ${escapeHTML(
                    getRoomName(course.room)
                )}
            </div>
        `;

        item.onclick =
            () => openDrawer(course);

        list.appendChild(item);

    });

}


/* =========================================================
   主课表
========================================================= */

function render(){

    document
        .querySelectorAll(".week-btn")
        .forEach((button,index)=>{

            button.classList.toggle(
                "active",
                index + 1 === selectedWeek
            );

        });

    renderDates();
    renderOverview();

    const currentWeek =
        getCurrentWeek();

    const currentDay =
        getCurrentDay();

    document
        .querySelectorAll(".day")
        .forEach((day,index)=>{

            day.classList.remove("today");

            if(
                selectedWeek === currentWeek &&
                index + 1 === currentDay
            ){

                day.classList.add("today");

            }

        });

    const grid =
        document.getElementById("grid");

    grid.innerHTML = "";

    /* 左侧节次 */

    for(let i=0;i<12;i++){

        const period =
            document.createElement("div");

        period.className = "period";
        period.style.gridColumn = "1";
        period.style.gridRow = i + 1;

        period.innerHTML = `
            <div class="period-number">
                ${i+1}
            </div>
        `;

        grid.appendChild(period);

    }


    /* 背景格 */

    for(let day=1;day<=7;day++){

        for(let p=1;p<=12;p++){

            const empty =
                document.createElement("div");

            empty.className = "empty";
            empty.style.gridColumn = day + 1;
            empty.style.gridRow = p;

            grid.appendChild(empty);

        }

    }


    const currentCourses =
        courses.filter(course =>
            Array.isArray(course.weeks) &&
            course.weeks.includes(selectedWeek)
        );


    if(currentCourses.length === 0){

        const empty =
            document.createElement("div");

        empty.className = "no-class";

        empty.innerHTML = `
            <div class="no-class-icon">
                📚
            </div>

            <div class="no-class-title">
                本周暂无课程
            </div>

            <div class="no-class-desc">
                当前第${selectedWeek}周没有安排课程
            </div>
        `;

        grid.appendChild(empty);

    }


    currentCourses.forEach(course => {

        const card =
            document.createElement("div");

        card.className =
            `course ${
                course.color ||
                getCourseColor(course.name)
            }`;

        let day =
            Number(course.day);

        let start =
            Number(course.start);

        let end =
            Number(course.end);

        if(day < 1 || day > 7)
            return;

        if(start < 1)
            start = 1;

        if(start > 12)
            start = 12;

        if(end < start)
            end = start;

        if(end > 12)
            end = 12;

        const length =
            end - start + 1;

        card.style.gridColumn =
            day + 1;

        card.style.gridRow =
            `${start} / span ${length}`;

        card.innerHTML = `
            <div class="course-name">
                ${escapeHTML(course.name)}
            </div>

            <div class="course-teacher">
                ${escapeHTML(
                    course.teacher ||
                    "教师未设置"
                )}
            </div>

            <div class="course-room">
                <span>🏫</span>
                <span>
                    ${escapeHTML(
                        getRoomName(course.room)
                    )}
                </span>
            </div>

            <div class="course-period">
                ${start}-${end}节
            </div>
        `;

        card.onclick =
            () => openDrawer(course);

        grid.appendChild(card);

    });

}


/* =========================================================
   HTML 转义
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   粘贴窗口
========================================================= */

function openPasteModal(){

    document
        .getElementById("pasteModal")
        .classList.add("show");

    setTimeout(()=>{

        document
            .getElementById("importText")
            .focus();

    },200);

}

function closePasteModal(){

    document
        .getElementById("pasteModal")
        .classList.remove("show");

}

function closePasteByBackground(event){

    if(event.target.id === "pasteModal")
        closePasteModal();

}


/* =========================================================
   解析并保存
========================================================= */

function parseAndSave(){

    const textarea =
        document.getElementById("importText");

    const text =
        textarea.value.trim();

    if(!text){

        alert("请先粘贴你的课表内容。");

        return;

    }

    const button =
        document.querySelector(
            "#pasteModal .primary-btn"
        );

    if(button){

        button.disabled = true;
        button.textContent = "正在解析…";

    }

    setTimeout(()=>{

        try{

            const result =
                parseScheduleText(text);

            if(!result.length){

                alert(
                    "没有识别到课程。\n\n" +
                    "请确认复制的是学校教务系统中的“全部教学周”课表。"
                );

                return;

            }

            courses =
                mergeCourses(result);

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(courses)
            );

            closePasteModal();
            showMainPage();

            alert(
                `导入成功！\n\n共识别 ${courses.length} 个课程安排。`
            );

        }catch(error){

            console.error(error);

            alert(
                "解析失败：\n\n" +
                (error.message || "未知错误")
            );

        }finally{

            if(button){

                button.disabled = false;
                button.textContent =
                    "✨ 生成我的课表";

            }

        }

    },30);

}


/* =========================================================
   ★ 核心解析器
========================================================= */

function parseScheduleText(text){

    text =
        String(text)
        .replace(/\r/g,"")
        .replace(/\u00a0/g," ");

    /*
       第一种：
       真正的表格复制文本。

       我们优先寻找：
       第一节
       第二节
       ...
    */

    const lines =
        text.split("\n");

    const result = [];

    let currentPeriod = null;
    let block = [];

    function flush(){

        if(
            currentPeriod &&
            block.length
        ){

            parsePeriodBlock(
                currentPeriod,
                block,
                result
            );

        }

        block = [];

    }

    for(const raw of lines){

        const line =
            raw.trim();

        const period =
            getPeriodFromLine(line);

        if(period){

            flush();

            currentPeriod = period;

            continue;

        }

        if(currentPeriod)
            block.push(raw);

    }

    flush();


    /*
       如果第一种没有识别，
       使用更宽松的解析器。
    */

    if(result.length)
        return result;

    return fallbackParseSchedule(text);

}


/* =========================================================
   节次
========================================================= */

function getPeriodFromLine(line){

    if(!line)
        return null;

    const match =
        line.match(
            /^(?:第\s*)?(一|二|三|四|五|六|七|八|九|十|十一|十二|1[0-2]|[1-9])\s*节/
        );

    if(!match)
        return null;

    const value = match[1];

    if(/^\d+$/.test(value))
        return Number(value);

    return chineseNumber(value);

}


/* =========================================================
   一个节次
========================================================= */

function parsePeriodBlock(
    period,
    lines,
    result
){

    /*
       先尝试逐行处理 Tab。

       这是手机从 HTML 表格复制
       最常见的情况。
    */

    for(const raw of lines){

        if(!raw.includes("\t"))
            continue;

        const columns =
            raw.split("\t");

        /*
           有些复制结果：
           第一列是节次，
           后面7列就是星期。
        */

        if(columns.length >= 8){

            for(let day=1;day<=7;day++){

                const cell =
                    columns[day] || "";

                parseCellCourses(
                    cell,
                    period,
                    day,
                    result
                );

            }

        }else if(columns.length >= 7){

            /*
               如果正好7列，
               默认就是星期一到星期日。
            */

            const start =
                columns.length === 7
                ? 0
                : columns.length - 7;

            for(let day=1;day<=7;day++){

                const cell =
                    columns[start + day - 1] || "";

                parseCellCourses(
                    cell,
                    period,
                    day,
                    result
                );

            }

        }

    }


    /*
       如果已经成功，不需要继续。
    */

    if(
        result.some(
            x => x.start === period
        )
    )
        return;


    /*
       再把整个块按星期拆。
    */

    const text =
        lines
        .join(" ")
        .replace(/\s+/g," ")
        .trim();

    const parts =
        splitByWeekdays(text);

    if(parts){

        for(let day=1;day<=7;day++){

            if(parts[day]){

                parseCellCourses(
                    parts[day],
                    period,
                    day,
                    result
                );

            }

        }

    }

}


/* =========================================================
   星期拆分
========================================================= */

function splitByWeekdays(text){

    const regex =
        /星期([一二三四五六日天])/g;

    const matches = [];

    let match;

    while(
        (match = regex.exec(text))
    ){

        matches.push({
            day:weekdayNumber(match[1]),
            start:regex.lastIndex
        });

    }

    if(!matches.length)
        return null;

    const result = {};

    for(let i=0;i<matches.length;i++){

        const current =
            matches[i];

        const end =
            i + 1 < matches.length
            ? matches[i+1].start
            : text.length;

        result[current.day] =
            text
            .slice(
                current.start,
                end
            )
            .trim();

    }

    return result;

}


/* =========================================================
   单元格解析
========================================================= */

function parseCellCourses(
    cell,
    period,
    day,
    result
){

    if(!cell)
        return;

    let text =
        String(cell)
        .replace(/\r/g," ")
        .replace(/\n/g," ")
        .replace(/\s+/g," ")
        .trim();

    if(!text)
        return;


    /*
       去掉一些明显的无关内容。
    */

    text =
        text
        .replace(
            /^(?:星期[一二三四五六日天])\s*/,
            ""
        );


    /*
       最完整格式：

       电力电子技术实验
       (0101225S.01)
       (柳杰)
       (9-16,电气传动实训室)
    */

    const fullRegex =
        /([^()]+?)\s*\(([^()]+)\)\s*\(([^()]+)\)\s*\(([^()]+)\)/g;

    let match;
    let found = false;

    while(
        (match = fullRegex.exec(text))
    ){

        found = true;

        const name =
            cleanCourseName(match[1]);

        const code =
            match[2].trim();

        const teacher =
            match[3].trim();

        const detail =
            parseScheduleDetailContent(
                match[4]
            );

        if(
            !name ||
            !code ||
            !teacher ||
            !detail
        )
            continue;

        addCourse(
            result,
            {
                day,
                start:period,
                end:
                    period < 12
                    ? period + 1
                    : period,
                name,
                code,
                teacher,
                weeks:detail.weeks,
                room:detail.room
            }
        );

    }

    if(found)
        return;


    /*
       第二种格式：

       课程(代码)(老师)
       (1-8,x2213)
    */

    const courseRegex =
        /([^()]+?)\s*\(([^()]+)\)\s*\(([^()]+)\)/g;

    const matches = [];

    let m;

    while(
        (m = courseRegex.exec(text))
    ){

        matches.push(m);

    }

    for(const match of matches){

        const name =
            cleanCourseName(match[1]);

        const code =
            match[2].trim();

        const teacher =
            match[3].trim();

        const after =
            text.slice(
                match.index +
                match[0].length
            );

        const detailMatch =
            after.match(
                /\(([^()]*(?:\d|\-)[^()]*)\)/
            );

        if(!detailMatch)
            continue;

        const detail =
            parseScheduleDetailContent(
                detailMatch[1]
            );

        if(!detail)
            continue;

        addCourse(
            result,
            {
                day,
                start:period,
                end:
                    period < 12
                    ? period + 1
                    : period,
                name,
                code,
                teacher,
                weeks:detail.weeks,
                room:detail.room
            }
        );

    }

}


/* =========================================================
   课程名称
========================================================= */

function cleanCourseName(name){

    return String(name || "")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   添加课程
========================================================= */

function addCourse(result,data){

    if(
        !data.name ||
        !data.weeks ||
        !data.weeks.length
    )
        return;

    result.push({

        day:Number(data.day),

        start:Number(data.start),

        end:Number(data.end),

        name:data.name,

        code:data.code || "",

        teacher:data.teacher || "",

        weeks:data.weeks,

        room:data.room || "",

        color:getCourseColor(
            data.name
        )

    });

}


/* =========================================================
   课程详情
========================================================= */

function parseScheduleDetailContent(content){

    if(!content)
        return null;

    let text =
        String(content)
        .trim()
        .replace(/，/g,",")
        .replace(/、/g," ");

    const comma =
        text.indexOf(",");

    if(comma < 0){

        const weeks =
            parseWeeks(text);

        if(!weeks.length)
            return null;

        return {
            weeks,
            room:""
        };

    }

    const weekText =
        text
        .slice(0,comma)
        .trim();

    const room =
        text
        .slice(comma + 1)
        .trim();

    const weeks =
        parseWeeks(weekText);

    if(!weeks.length)
        return null;

    return {
        weeks,
        room
    };

}


/* =========================================================
   周次
========================================================= */

function parseWeeks(text){

    if(!text)
        return [];

    let normalized =
        String(text)
        .replace(/周/g,"")
        .replace(/第/g,"")
        .replace(/、/g," ")
        .replace(/，/g," ")
        .replace(/,/g," ")
        .replace(/\s+/g," ")
        .trim();

    if(!normalized)
        return [];

    const weeks =
        new Set();


    /*
       处理：

       1-8
       9-16
       1～8
       1~8
    */

    normalized =
        normalized
        .replace(/～/g,"-")
        .replace(/~/g,"-");

    const rangeRegex =
        /(\d{1,2})\s*-\s*(\d{1,2})/g;

    let range;

    while(
        (range =
            rangeRegex.exec(normalized))
    ){

        let start =
            Number(range[1]);

        let end =
            Number(range[2]);

        if(start > end){

            const temp = start;
            start = end;
            end = temp;

        }

        for(
            let i=start;
            i<=end;
            i++
        ){

            if(
                i>=1 &&
                i<=TOTAL_WEEKS
            ){

                weeks.add(i);

            }

        }

    }


    normalized =
        normalized.replace(
            rangeRegex,
            " "
        );


    /*
       处理单周：

       1
       3
       8

       所以：

       1 3-8

       会得到：

       1、3、4、5、6、7、8
    */

    const singles =
        normalized.match(
            /\d{1,2}/g
        ) || [];

    singles.forEach(value=>{

        const n =
            Number(value);

        if(
            n>=1 &&
            n<=TOTAL_WEEKS
        ){

            weeks.add(n);

        }

    });


    return [
        ...weeks
    ].sort(
        (a,b)=>a-b
    );

}


/* =========================================================
   中文数字
========================================================= */

function chineseNumber(text){

    const map = {
        "一":1,
        "二":2,
        "三":3,
        "四":4,
        "五":5,
        "六":6,
        "七":7,
        "八":8,
        "九":9,
        "十":10,
        "十一":11,
        "十二":12
    };

    return map[text] || null;

}


/* =========================================================
   星期数字
========================================================= */

function weekdayNumber(value){

    const map = {
        "一":1,
        "二":2,
        "三":3,
        "四":4,
        "五":5,
        "六":6,
        "日":7,
        "天":7
    };

    return map[value] || null;

}


/* =========================================================
   备用解析
========================================================= */

function fallbackParseSchedule(text){

    const result = [];

    const lines =
        text
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);

    let period = null;
    let day = null;

    for(const line of lines){

        const p =
            getPeriodFromLine(line);

        if(p){

            period = p;
            day = null;

            continue;

        }

        const d =
            line.match(
                /^星期([一二三四五六日天])/
            );

        if(d){

            day =
                weekdayNumber(d[1]);

            continue;

        }

        if(
            period &&
            day
        ){

            parseCellCourses(
                line,
                period,
                day,
                result
            );

        }

    }

    return result;

}


/* =========================================================
   合并重复
========================================================= */

function mergeCourses(list){

    const map =
        new Map();

    list.forEach(course=>{

        const key =
            [
                course.day,
                course.start,
                course.end,
                course.name,
                course.teacher,
                course.room
            ].join("|");

        if(!map.has(key)){

            map.set(
                key,
                {
                    ...course,
                    weeks:[
                        ...course.weeks
                    ]
                }
            );

        }else{

            const old =
                map.get(key);

            old.weeks =
                [
                    ...new Set([
                        ...old.weeks,
                        ...course.weeks
                    ])
                ].sort(
                    (a,b)=>a-b
                );

        }

    });

    return [
        ...map.values()
    ];

}


/* =========================================================
   课程详情
========================================================= */

function openDrawer(course){

    document.getElementById(
        "drawerTitle"
    ).textContent =
        course.name;

    document.getElementById(
        "drawerTeacher"
    ).textContent =
        course.teacher || "未设置";

    document.getElementById(
        "drawerPeriod"
    ).textContent =
        `${dayNames[course.day]} · 第${course.start}-${course.end}节`;

    document.getElementById(
        "drawerWeeks"
    ).textContent =
        formatWeeks(course.weeks);

    document.getElementById(
        "drawerRoom"
    ).textContent =
        getRoomName(course.room);

    document.getElementById(
        "drawerCode"
    ).textContent =
        course.code || "未设置";

    document.getElementById(
        "drawer"
    ).classList.add("show");

}

function closeDrawer(){

    document.getElementById(
        "drawer"
    ).classList.remove("show");

}

function closeDrawerByBackground(event){

    if(event.target.id === "drawer")
        closeDrawer();

}


/* =========================================================
   周数格式化
========================================================= */

function formatWeeks(weeks){

    if(!weeks || !weeks.length)
        return "无";

    const sorted =
        [...weeks].sort(
            (a,b)=>a-b
        );

    const result = [];

    let start = sorted[0];
    let prev = sorted[0];

    for(let i=1;i<sorted.length;i++){

        const current =
            sorted[i];

        if(current === prev + 1){

            prev = current;

        }else{

            result.push(
                start === prev
                ? `${start}周`
                : `${start}-${prev}周`
            );

            start = current;
            prev = current;

        }

    }

    result.push(
        start === prev
        ? `${start}周`
        : `${start}-${prev}周`
    );

    return result.join("、");

}

   清空
========================================================= */

function clearSchedule(){

    const ok =
        confirm(
            "确定要清空当前课表吗？\n\n清空后需要重新导入。"
        );

    if(!ok)
        return;

    localStorage.removeItem(
        STORAGE_KEY

        "my_schedule_v3"
    );

/* =========================================================
   导出
========================================================= */

function exportSchedule(){

    if(!courses.length){

        alert("当前没有课表可以导出。");

        return;

    }

    const data = {
        version:4,
        exportedAt:new Date().toISOString(),
        courses
    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "我的课表备份.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}


/* =========================================================
   JSON 恢复
========================================================= */

function handleBackupImport(event){

    const file =
        event.target.files[0];

    if(!file)
        return;

    const reader =
        new FileReader();

    reader.onload = function(){

        try{

            const data =
                JSON.parse(
                    reader.result
                );

            if(
                !data.courses ||
                !Array.isArray(data.courses)
            ){

                throw new Error();

            }

            courses =
                data.courses;

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(courses)
            );

            closeSettings();
            showMainPage();

            alert(
                `导入成功，共 ${courses.length} 个课程安排。`
            );

        }catch(e){

            alert(
                "课表备份文件格式不正确。"
            );

        }

    };

    reader.readAsText(
        file,
        "UTF-8"
    );

    event.target.value = "";

}


/* =========================================================
   文件导入
========================================================= */

function handleFileImport(event){

    const file =
        event.target.files[0];

    if(!file)
        return;

    const reader =
        new FileReader();

    reader.onload = function(){

        const text =
            String(
                reader.result
            ).trim();

        if(
            file.name
            .toLowerCase()
            .endsWith(".json")
        ){

            try{

                const data =
                    JSON.parse(text);

                if(
                    data.courses &&
                    Array.isArray(
                        data.courses
                    )
                ){

                    courses =
                        data.courses;

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(courses)
                    );

                    showMainPage();

                    alert(
                        `课表导入成功，共 ${courses.length} 个课程安排。`
                    );

                    return;

                }

            }catch(e){

                alert(
                    "JSON 文件格式不正确。"
                );

                return;

            }

        }


        const result =
            parseScheduleText(text);

        if(!result.length){

            alert(
                "没有识别到课程，请确认文件内容是学校课表。"
            );

            return;

        }

        courses =
            mergeCourses(result);

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(courses)
        );

        showMainPage();

        alert(
            `课表导入成功，共识别 ${courses.length} 个课程安排。`
        );

    };

    reader.readAsText(
        file,
        "UTF-8"
    );

    event.target.value = "";

}


/* =========================================================
   显示主页面
========================================================= */

function showMainPage(){

    document.getElementById(
        "importPage"
    ).classList.add("hidden");

    document.getElementById(
        "mainPage"
    ).classList.remove("hidden");

    selectedWeek =
        getCurrentWeek();

    createWeeks();
    render();

    setTimeout(()=>{

        const active =
            document.querySelector(
                ".week-btn.active"
            );

        if(active){

            active.scrollIntoView({
                behavior:"auto",
                block:"nearest",
                inline:"center"
            });

        }

    },100);

}


/* =========================================================
   初始化
========================================================= */

function init(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(
                Array.isArray(parsed) &&
                parsed.length
            ){

                courses = parsed;

                showMainPage();

                return;

            }

        }

    }catch(error){

        console.error(
            "读取课表失败",
            error
        );

        localStorage.removeItem(
            STORAGE_KEY
        );

    }


    document.getElementById(
        "importPage"
    ).classList.remove("hidden");

    document.getElementById(
        "mainPage"
    ).classList.add("hidden");

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeDrawer();
            closePasteModal();
            closeSettings();

        }

    }
);


/* =========================================================
   启动
========================================================= */

init();
