
<script>

/* =========================================================
   全局
========================================================= */

const STORAGE_KEY = "my_schedule_v4";

const TOTAL_WEEKS = 18;

const semesterStart =
    new Date("2026-09-07T00:00:00");

let selectedWeek = 1;

let courses = [];


/* =========================================================
   星期
========================================================= */

const dayNames = [
    "",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六",
    "星期日"
];


/* =========================================================
   教室
========================================================= */

const roomNames = {
    "x1201": "一教201"
};


function getRoomName(room){

    if(!room){
        return "未设置";
    }

    return roomNames[room] || room;

}


/* =========================================================
   颜色
========================================================= */

const colors = [
    "blue",
    "purple",
    "green",
    "orange",
    "pink",
    "cyan"
];


function getCourseColor(name){

    let hash = 0;

    for(let i = 0; i < name.length; i++){

        hash =
            name.charCodeAt(i) +
            ((hash << 5) - hash);

    }

    return colors[
        Math.abs(hash) % colors.length
    ];

}


/* =========================================================
   当前教学周
========================================================= */

function getCurrentWeek(){

    const now = new Date();

    const diff =
        now.getTime() -
        semesterStart.getTime();

    const days =
        Math.floor(
            diff /
            (1000 * 60 * 60 * 24)
        );

    let week =
        Math.floor(days / 7) + 1;

    if(week < 1)
        week = 1;

    if(week > TOTAL_WEEKS)
        week = TOTAL_WEEKS;

    return week;

}


/* =========================================================
   当前星期
========================================================= */

function getCurrentDay(){

    let day =
        new Date().getDay();

    if(day === 0)
        day = 7;

    return day;

}


/* =========================================================
   日期
========================================================= */

function getDateForDay(day){

    const date =
        new Date(
            semesterStart
        );

    date.setDate(
        date.getDate() +
        (selectedWeek - 1) * 7 +
        (day - 1)
    );

    return (
        `${date.getMonth()+1}/` +
        `${date.getDate()}`
    );

}


function getFullDate(date){

    return (
        `${date.getFullYear()}年` +
        `${date.getMonth()+1}月` +
        `${date.getDate()}日`
    );

}


/* =========================================================
   创建教学周
========================================================= */

function createWeeks(){

    const box =
        document.getElementById("weeks");

    box.innerHTML = "";

    const currentWeek =
        getCurrentWeek();

    for(let i = 1; i <= TOTAL_WEEKS; i++){

        const button =
            document.createElement("button");

        button.className = "week-btn";

        button.textContent =
            `第${i}周`;

        if(i === currentWeek){

            button.classList.add(
                "today-week"
            );

        }

        button.onclick = function(){

            selectedWeek = i;

            render();

            button.scrollIntoView({
                behavior:"smooth",
                block:"nearest",
                inline:"center"
            });

        };

        box.appendChild(button);

    }

}


/* =========================================================
   日期渲染
========================================================= */

function renderDates(){

    for(let day = 1; day <= 7; day++){

        const el =
            document.getElementById(
                `date-${day}`
            );

        if(el){

            el.textContent =
                getDateForDay(day);

        }

    }

}


/* =========================================================
   今日概览
========================================================= */

function renderOverview(){

    const now =
        new Date();

    const currentWeek =
        getCurrentWeek();

    const currentDay =
        getCurrentDay();

    document.getElementById(
        "overviewDate"
    ).textContent =
        getFullDate(now);

    document.getElementById(
        "overviewWeek"
    ).textContent =
        `第${selectedWeek}周`;

    const todayCourses =
        courses
        .filter(course =>

            course.weeks.includes(
                selectedWeek
            ) &&

            course.day === currentDay

        )
        .sort(
            (a,b) =>
                a.start - b.start
        );

    const list =
        document.getElementById(
            "todayList"
        );

    list.innerHTML = "";

    document.getElementById(
        "overviewTitle"
    ).textContent =
        dayNames[currentDay];

    if(todayCourses.length === 0){

        document.getElementById(
            "overviewDesc"
        ).textContent =

            selectedWeek === currentWeek

            ? "今天没有课程，好好休息一下"

            : "这一周对应星期没有课程";

        list.style.display = "none";

        return;

    }

    document.getElementById(
        "overviewDesc"
    ).textContent =
        `今天共有 ${todayCourses.length} 门课程`;

    list.style.display = "flex";

    todayCourses.forEach(course => {

        const item =
            document.createElement("div");

        item.className =
            "today-card";

        item.innerHTML = `

            <div class="today-time">
                第${course.start}-${course.end}节
            </div>

            <div class="today-name">
                ${escapeHTML(course.name)}
            </div>

            <div class="today-room">
                🏫 ${escapeHTML(
                    getRoomName(course.room)
                )}
            </div>

        `;

        item.onclick =
            () => openDrawer(course);

        list.appendChild(item);

    });

}


/* =========================================================
   主课表渲染
========================================================= */

function render(){

    document
        .querySelectorAll(".week-btn")
        .forEach((button,index)=>{

            button.classList.toggle(
                "active",
                index + 1 === selectedWeek
            );

        });

    renderDates();

    renderOverview();

    const currentWeek =
        getCurrentWeek();

    const currentDay =
        getCurrentDay();

    document
        .querySelectorAll(".day")
        .forEach((day,index)=>{

            day.classList.remove("today");

            if(
                selectedWeek === currentWeek &&
                index + 1 === currentDay
            ){

                day.classList.add("today");

            }

        });

    const grid =
        document.getElementById("grid");

    grid.innerHTML = "";

    /* 左侧节次 */

    for(let i = 0; i < 12; i++){

        const period =
            document.createElement("div");

        period.className = "period";

        period.style.gridColumn = "1";

        period.style.gridRow =
            i + 1;

        period.innerHTML = `

            <div class="period-number">
                ${i + 1}
            </div>

        `;

        grid.appendChild(period);

    }


    /* 背景格 */

    for(let day = 1; day <= 7; day++){

        for(let p = 1; p <= 12; p++){

            const empty =
                document.createElement("div");

            empty.className = "empty";

            empty.style.gridColumn =
                day + 1;

            empty.style.gridRow = p;

            grid.appendChild(empty);

        }

    }


    const currentCourses =
        courses.filter(course =>
            course.weeks.includes(
                selectedWeek
            )
        );


    if(currentCourses.length === 0){

        const empty =
            document.createElement("div");

        empty.className = "no-class";

        empty.innerHTML = `

            <div class="no-class-icon">
                📚
            </div>

            <div class="no-class-title">
                本周暂无课程
            </div>

            <div class="no-class-desc">
                当前第${selectedWeek}周没有安排课程
            </div>

        `;

        grid.appendChild(empty);

    }


    currentCourses.forEach(course => {

        const card =
            document.createElement("div");

        card.className =
            `course ${
                course.color ||
                getCourseColor(course.name)
            }`;

        card.style.gridColumn =
            course.day + 1;

        let start =
            Number(course.start);

        let end =
            Number(course.end);

        if(start < 1)
            start = 1;

        if(end > 12)
            end = 12;

        if(end < start)
            end = start;

        const length =
            end - start + 1;

        card.style.gridRow =
            `${start} / span ${length}`;

        card.innerHTML = `

            <div class="course-name">
                ${escapeHTML(course.name)}
            </div>

            <div class="course-teacher">
                ${escapeHTML(
                    course.teacher ||
                    "教师未设置"
                )}
            </div>

            <div class="course-room">

                <span>🏫</span>

                <span>
                    ${escapeHTML(
                        getRoomName(course.room)
                    )}
                </span>

            </div>

            <div class="course-period">
                ${start}-${end}节
            </div>

        `;

        card.onclick =
            () => openDrawer(course);

        grid.appendChild(card);

    });

}


/* =========================================================
   HTML 转义
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   粘贴弹窗
========================================================= */

function openPasteModal(){

    document
        .getElementById("pasteModal")
        .classList.add("show");

    setTimeout(()=>{

        document
            .getElementById("importText")
            .focus();

    },200);

}


function closePasteModal(){

    document
        .getElementById("pasteModal")
        .classList.remove("show");

}


function closePasteByBackground(event){

    if(
        event.target.id === "pasteModal"
    ){

        closePasteModal();

    }

}


/* =========================================================
   核心：解析并保存
========================================================= */

function parseAndSave(){

    const textarea =
        document.getElementById(
            "importText"
        );

    const text =
        textarea.value.trim();

    if(!text){

        alert(
            "请先粘贴你的课表内容。"
        );

        return;

    }


    /* 防止按钮看起来没反应 */

    const button =
        document.querySelector(
            '#pasteModal .primary-btn'
        );

    if(button){

        button.disabled = true;

        button.textContent =
            "正在解析…";

    }


    setTimeout(()=>{

        try{

            const result =
                parseScheduleText(text);

            if(!result || result.length === 0){

                alert(
                    "没有识别到课程。\n\n" +
                    "请确认你复制的是学校教务系统里的“全部教学周”课表。\n\n" +
                    "如果确认无误，把你复制后的内容发给我，我可以继续适配你的学校格式。"
                );

                return;

            }


            courses =
                mergeCourses(result);


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(courses)
            );


            closePasteModal();

            showMainPage();


            alert(
                `导入成功！\n\n` +
                `共识别 ${courses.length} 个课程安排。`
            );


        }catch(error){

            console.error(
                "课表解析错误：",
                error
            );

            alert(
                "课表解析失败。\n\n" +
                "错误原因：" +
                (error.message || "未知错误")
            );

        }finally{

            if(button){

                button.disabled = false;

                button.textContent =
                    "✨ 生成我的课表";

            }

        }

    },50);

}


/* =========================================================
   ★ 新版课表解析器
========================================================= */

function parseScheduleText(text){

    /*
        核心思路：

        1. 找到“第一节～第十二节”
        2. 每个节次作为一个独立区块
        3. 优先识别 Tab 表格
        4. 每个 Tab 列对应星期
        5. 课程支持：
           课程(代码) (老师) (周次,教室)
        6. 如果课程和详情分两行，也支持
    */


    const normalized =
        String(text)
        .replace(/\r/g,"")
        .replace(/\u00a0/g," ");


    const lines =
        normalized
        .split("\n");


    const result = [];


    let currentPeriod = null;

    let block = [];


    function flushBlock(){

        if(
            currentPeriod &&
            block.length
        ){

            parsePeriodBlock(
                currentPeriod,
                block,
                result
            );

        }

        block = [];

    }


    for(let i = 0; i < lines.length; i++){

        const raw =
            lines[i];

        const line =
            raw.trim();


        const period =
            getPeriodFromLine(line);


        if(period){

            flushBlock();

            currentPeriod =
                period;

            continue;

        }


        if(currentPeriod){

            block.push(raw);

        }

    }


    flushBlock();


    /*
        如果 Tab 结构没识别到，
        再进行通用扫描。
    */

    if(result.length === 0){

        return fallbackParseSchedule(
            normalized
        );

    }


    return result;

}


/* =========================================================
   获取节次
========================================================= */

function getPeriodFromLine(line){

    if(!line)
        return null;


    const chinese =
        line.match(
            /^第\s*(一|二|三|四|五|六|七|八|九|十|十一|十二)\s*节/
        );


    if(chinese){

        return chineseNumber(
            chinese[1]
        );

    }


    const number =
        line.match(
            /^第?\s*(1[0-2]|[1-9])\s*节/
        );


    if(number){

        return Number(
            number[1]
        );

    }


    return null;

}


/* =========================================================
   解析一个节次
========================================================= */

function parsePeriodBlock(
    period,
    lines,
    result
){

    /*
        第一优先级：
        Tab 表格。
    */

    const tabLines =
        lines.filter(
            line => line.includes("\t")
        );


    if(tabLines.length > 0){

        /*
            合并这个节次的内容。

            保留 Tab，
            换行变为空格。

            这样：
            课程
            (1-8,x2213)

            会重新组成完整课程。
        */

        const blockText =
            lines
            .join(" ")
            .replace(/\s+/g," ")
            .trim();


        const tabs =
            lines
            .join("\n")
            .split(/\t/);


        /*
            如果存在明显的7列，
            直接按列处理。
        */

        if(tabs.length >= 7){

            const columns =
                normalizeTableColumns(
                    tabs
                );

            for(
                let day = 1;
                day <= 7;
                day++
            ){

                const cell =
                    columns[day - 1] || "";

                parseCellCourses(
                    cell,
                    period,
                    day,
                    result
                );

            }

            if(result.length > 0)
                return;

        }


        /*
            第二种 Tab 情况：
            有些手机复制后 Tab 不完整。

            尝试根据星期名称分割。
        */

        const weekdayParts =
            splitByWeekdays(
                blockText
            );


        if(weekdayParts){

            for(
                let day = 1;
                day <= 7;
                day++
            ){

                if(
                    weekdayParts[day]
                ){

                    parseCellCourses(
                        weekdayParts[day],
                        period,
                        day,
                        result
                    );

                }

            }

            if(result.length > 0)
                return;

        }

    }


    /*
        没有 Tab：

        尝试按：

        星期一
        课程
        星期二
        课程

        这种格式解析。
    */

    parseSequentialBlock(
        period,
        lines,
        result
    );

}


/* =========================================================
   清理表格列
========================================================= */

function normalizeTableColumns(parts){

    const columns =
        new Array(7)
        .fill("");

    /*
        找到 星期一～星期日
        作为真正数据开始位置。
    */

    let startIndex = -1;

    for(
        let i = 0;
        i < parts.length;
        i++
    ){

        if(
            /星期一/.test(
                parts[i]
            )
        ){

            startIndex = i;

            break;

        }

    }


    if(startIndex >= 0){

        const data =
            parts.slice(
                startIndex + 1
            );

        for(
            let i = 0;
            i < 7;
            i++
        ){

            columns[i] =
                (data[i] || "")
                .trim();

        }

        return columns;

    }


    /*
        没有星期标题，
        默认最后7列。
    */

    const data =
        parts.slice(-7);

    for(
        let i = 0;
        i < 7;
        i++
    ){

        columns[i] =
            (data[i] || "")
            .trim();

    }

    return columns;

}


/* =========================================================
   星期分割
========================================================= */

function splitByWeekdays(text){

    const result = {};

    const regex =
        /星期([一二三四五六日天])/g;

    const matches = [];

    let match;

    while(
        (match = regex.exec(text))
    ){

        matches.push({
            index:match.index,
            end:regex.lastIndex,
            day:weekdayNumber(
                match[1]
            )
        });

    }


    if(matches.length === 0)
        return null;


    for(
        let i = 0;
        i < matches.length;
        i++
    ){

        const current =
            matches[i];

        const next =
            matches[i + 1];


        const end =
            next
            ? next.index
            : text.length;


        result[current.day] =
            text
            .slice(
                current.end,
                end
            )
            .trim();

    }


    return result;

}


/* =========================================================
   顺序块解析
========================================================= */

function parseSequentialBlock(
    period,
    lines,
    result
){

    let day = null;

    let pendingText = "";


    function processPending(){

        if(
            !day ||
            !pendingText.trim()
        ){

            pendingText = "";

            return;

        }


        parseCellCourses(
            pendingText,
            period,
            day,
            result
        );

        pendingText = "";

    }


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const raw =
            lines[i];

        const line =
            raw.trim();


        if(!line)
            continue;


        const dayMatch =
            line.match(
                /^星期([一二三四五六日天])/
            );


        if(dayMatch){

            processPending();

            day =
                weekdayNumber(
                    dayMatch[1]
                );

            continue;

        }


        if(day){

            pendingText +=
                " " + line;

        }

    }


    processPending();

}


/* =========================================================
   星期数字
========================================================= */

function weekdayNumber(value){

    const map = {

        "一":1,
        "二":2,
        "三":3,
        "四":4,
        "五":5,
        "六":6,
        "日":7,
        "天":7

    };

    return map[value] || null;

}


/* =========================================================
   单元格课程解析
========================================================= */

function parseCellCourses(
    cell,
    period,
    day,
    result
){

    if(
        !cell ||
        !day ||
        !period
    )
        return;


    let text =
        String(cell)
        .replace(/\r/g," ")
        .replace(/\n/g," ")
        .replace(/\s+/g," ")
        .trim();


    if(!text)
        return;


    /*
        去掉明显的表头。
    */

    text =
        text
        .replace(
            /星期[一二三四五六日天]/g,
            " "
        )
        .trim();


    /*
        ★ 最重要的正则

        同时支持：

        课程(代码) (老师) (1-8,x2213)

        以及：

        课程(代码) (老师)
        (1-8,x2213)
    */

    const regex =
        /([^()]+?)\s*\(([^()]+)\)\s*\(([^()]+)\)\s*\(([^()]+)\)/g;


    let found = false;

    let match;


    while(
        (match = regex.exec(text))
    ){

        found = true;


        const name =
            cleanCourseName(
                match[1]
            );


        const code =
            match[2].trim();


        const teacher =
            match[3].trim();


        const detail =
            parseScheduleDetailContent(
                match[4]
            );


        if(
            !name ||
            !code ||
            !teacher ||
            !detail
        ){

            continue;

        }


        addCourse(
            result,
            {
                day,
                start:period,
                end:period + 1 <= 12
                    ? period + 1
                    : period,
                name,
                code,
                teacher,
                weeks:detail.weeks,
                room:detail.room
            }
        );

    }


    /*
        如果上面的正则没有识别，
        尝试：

        课程(代码) (老师)
        + 后面的详情
    */

    if(!found){

        const courseRegex =
            /([^()]+?)\s*\(([^()]+)\)\s*\(([^()]+)\)/g;


        const matches = [];

        let m;

        while(
            (m = courseRegex.exec(text))
        ){

            matches.push(m);

        }


        for(
            let i = 0;
            i < matches.length;
            i++
        ){

            const m =
                matches[i];


            const name =
                cleanCourseName(
                    m[1]
                );


            const code =
                m[2].trim();


            const teacher =
                m[3].trim();


            /*
                从课程结束后找：

                (1-8,x2213)
            */

            const after =
                text.slice(
                    m.index + m[0].length
                );


            const detailMatch =
                after.match(
                    /\(([^()]*\d[^()]*)\)/
                );


            if(!detailMatch)
                continue;


            const detail =
                parseScheduleDetailContent(
                    detailMatch[1]
                );


            if(!detail)
                continue;


            addCourse(
                result,
                {
                    day,
                    start:period,
                    end:
                        period + 1 <= 12
                        ? period + 1
                        : period,
                    name,
                    code,
                    teacher,
                    weeks:detail.weeks,
                    room:detail.room
                }
            );

        }

    }

}


/* =========================================================
   课程名称清理
========================================================= */

function cleanCourseName(name){

    return String(name || "")
        .replace(/^\s+/,"")
        .replace(/\s+$/,"")
        .replace(
            /^(?:星期[一二三四五六日天])$/,
            ""
        )
        .trim();

}


/* =========================================================
   添加课程
========================================================= */

function addCourse(
    result,
    data
){

    if(
        !data.name ||
        !data.weeks ||
        data.weeks.length === 0
    ){

        return;

    }


    result.push({

        day:Number(data.day),

        start:Number(data.start),

        end:Number(data.end),

        name:data.name,

        code:data.code || "",

        teacher:data.teacher || "",

        weeks:data.weeks,

        room:data.room || "",

        color:getCourseColor(
            data.name
        )

    });

}


/* =========================================================
   课程详情
========================================================= */

function parseScheduleDetailContent(
    content
){

    if(!content)
        return null;


    let text =
        String(content)
        .trim();


    text =
        text
        .replace(/，/g,",")
        .replace(/、/g," ");


    /*
        最后一个逗号后面是教室
    */

    const comma =
        text.indexOf(",");


    if(comma < 0){

        /*
            没有教室：

            1-8

        */

        const weeks =
            parseWeeks(text);

        if(weeks.length === 0)
            return null;

        return {

            weeks,

            room:""

        };

    }


    const weekText =
        text
        .slice(
            0,
            comma
        )
        .trim();


    const room =
        text
        .slice(
            comma + 1
        )
        .trim();


    const weeks =
        parseWeeks(
            weekText
        );


    if(
        weeks.length === 0
    ){

        return null;

    }


    return {

        weeks,

        room

    };

}


/* =========================================================
   周数解析
========================================================= */

function parseWeeks(text){

    if(!text)
        return [];


    let normalized =
        String(text)
        .replace(/周/g,"")
        .replace(/、/g," ")
        .replace(/，/g," ")
        .replace(/,/g," ")
        .replace(/\s+/g," ")
        .trim();


    if(!normalized)
        return [];


    const weeks =
        new Set();


    /*
        例如：

        1-8
        9-16
    */

    const rangeRegex =
        /(\d{1,2})\s*-\s*(\d{1,2})/g;


    let range;


    while(
        (range =
            rangeRegex.exec(normalized))
    ){

        let start =
            Number(range[1]);

        let end =
            Number(range[2]);


        if(start > end){

            [
                start,
                end
            ] =
            [
                end,
                start
            ];

        }


        for(
            let i = start;
            i <= end;
            i++
        ){

            if(
                i >= 1 &&
                i <= TOTAL_WEEKS
            ){

                weeks.add(i);

            }

        }

    }


    /*
        删除已经处理的范围。
    */

    normalized =
        normalized.replace(
            rangeRegex,
            " "
        );


    /*
        处理：

        1 3-8

        中的：

        1
    */

    const singles =
        normalized.match(
            /\d{1,2}/g
        ) || [];


    singles.forEach(value => {

        const n =
            Number(value);

        if(
            n >= 1 &&
            n <= TOTAL_WEEKS
        ){

            weeks.add(n);

        }

    });


    return [
        ...weeks
    ].sort(
        (a,b)=>a-b
    );

}

/* =========================================================
   备用解析
========================================================= */

function fallbackParseSchedule(text){

    const result = [];


    /*
        直接扫描：

        第一节 ... 星期一 ... 课程(...)
        第二节 ... 星期二 ...

        适合部分手机复制格式。
    */

    const lines =
        text
        .split(/\r?\n/)
        .map(
            x => x.trim()
        )
        .filter(Boolean);


    let period = null;

    let day = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i];


        const p =
            getPeriodFromLine(
                line
            );


        if(p){

            period = p;

            day = null;

            continue;

        }


        const d =
            line.match(
                /^星期([一二三四五六日天])/
            );


        if(d){

            day =
                weekdayNumber(
                    d[1]
                );

            continue;

        }


        if(
            period &&
            day
        ){

            parseCellCourses(
                line,
                period,
                day,
                result
            );

        }

    }


    return result;

}


/* =========================================================
   合并重复
========================================================= */

function mergeCourses(list){

    const map =
        new Map();


    list.forEach(course => {

        const key =
            [
                course.day,
                course.start,
                course.end,
                course.name,
                course.teacher,
                course.room
            ].join("|");


        if(!map.has(key)){

            map.set(
                key,
                {
                    ...course,
                    weeks:[
                        ...course.weeks
                    ]
                }
            );

        }else{

            const old =
                map.get(key);


            old.weeks = [
                ...new Set([
                    ...old.weeks,
                    ...course.weeks
                ])
            ].sort(
                (a,b)=>a-b
            );

        }

    });


    return [
        ...map.values()
    ];

}

/* =========================================================
   周数显示
========================================================= */

function formatWeeks(weeks){

    if(
        !weeks ||
        weeks.length === 0
    ){

        return "无";

    }


    const sorted =
        [...weeks].sort(
            (a,b)=>a-b
        );


    const result = [];


    let start =
        sorted[0];

    let prev =
        sorted[0];


    for(
        let i = 1;
        i < sorted.length;
        i++
    ){

        const current =
            sorted[i];


        if(
            current === prev + 1
        ){

            prev = current;

        }else{

            if(start === prev){

                result.push(
                    `${start}周`
                );

            }else{

                result.push(
                    `${start}-${prev}周`
                );

            }

            start = current;

            prev = current;

        }

    }


    if(start === prev){

        result.push(
            `${start}周`
        );

    }else{

        result.push(
            `${start}-${prev}周`
        );

    }


    return result.join("、");

}

function exportSchedule(){

    if(
        courses.length === 0
    ){

        alert(
            "当前没有课表可以导出。"
        );

        return;

    }


    const data = {

        version:4,

        exportedAt:
            new Date().toISOString(),

        courses

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href = url;

    a.download =
        "我的课表备份.json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);

}


/* =========================================================
   JSON 备份
========================================================= */

function handleBackupImport(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(){

            try{

                const data =
                    JSON.parse(
                        reader.result
                    );


                if(
                    !data.courses ||
                    !Array.isArray(
                        data.courses
                    )
                ){

                    throw new Error();

                }


                courses =
                    data.courses;


                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        courses
                    )
                );


                closeSettings();

                showMainPage();


                alert(
                    `导入成功，共 ${courses.length} 个课程安排。`
                );


            }catch(e){

                alert(
                    "课表备份文件格式不正确。"
                );

            }

        };


    reader.readAsText(
        file,
        "UTF-8"
    );


    event.target.value = "";

}


/* =========================================================
   TXT / JSON 文件导入
========================================================= */

function handleFileImport(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(){

            const text =
                String(
                    reader.result
                ).trim();


            /*
                JSON
            */

            if(
                file.name
                    .toLowerCase()
                    .endsWith(".json")
            ){

                try{

                    const data =
                        JSON.parse(text);


                    if(
                        data.courses &&
                        Array.isArray(
                            data.courses
                        )
                    ){

                        courses =
                            data.courses;


                        localStorage.setItem(
                            STORAGE_KEY,
                            JSON.stringify(
                                courses
                            )
                        );


                        showMainPage();


                        alert(
                            `课表导入成功，共 ${courses.length} 个课程安排。`
                        );


                        return;

                    }

                }catch(e){

                    alert(
                        "JSON 文件格式不正确。"
                    );

                    return;

                }

            }


            /*
                TXT
            */

            const result =
                parseScheduleText(
                    text
                );


            if(
                result.length === 0
            ){

                alert(
                    "没有识别到课程，请确认文件内容是学校课表。"
                );

                return;

            }


            courses =
                mergeCourses(
                    result
                );


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    courses
                )
            );


            showMainPage();


            alert(
                `课表导入成功，共识别 ${courses.length} 个课程安排。`
            );

        };


    reader.readAsText(
        file,
        "UTF-8"
    );


    event.target.value = "";

}
